  {"id":"cn-101","ch":"cn-1","tag":"必背","stem":"OSI 参考模型中，负责「端到端」可靠传输的是（　）。","opts":["数据链路层","网络层","传输层","会话层"],"ans":[2],"ex":"传输层提供**端到端**（进程到进程）通信；数据链路层是**点到点**（相邻结点）。网络层负责路由与转发（主机到主机），不保证可靠交付（IP 尽力而为）。"},
  {"id":"cn-102","ch":"cn-1","stem":"下列协议中，工作在网络层的是（　）。","opts":["TCP","IP","HTTP","PPP"],"ans":[1],"ex":"网络层协议：IP、ICMP、IGMP、ARP（常划在链路层与网络层之间）、路由协议 RIP/OSPF/BGP。TCP 在传输层，HTTP 在应用层，PPP 在数据链路层。"},
  {"id":"cn-103","ch":"cn-1","stem":"数据从应用层向下传递时，每经过一层都会（　）。","opts":["删除本层首部","加上本层首部（封装）","重新排序","进行差错校验后丢弃首部"],"ans":[1],"ex":"发送方逐层**封装**（加首部，链路层还加尾部），接收方逐层**解封装**（去首部）。这就是「对等层通信」的实质：逻辑上同层对话，物理上逐层封装穿越。"},
  {"id":"cn-104","ch":"cn-1","stem":"下列关于面向连接与无连接服务的说法，正确的是（　）。","opts":["面向连接服务一定可靠","无连接服务一定不可靠","面向连接服务提供连接建立、数据传输、连接释放三阶段","无连接服务不需要地址"],"ans":[2],"ex":"面向连接 = 有连接建立/释放阶段（如 TCP），但「连接」不必然等于「可靠」（如帧中继）。无连接（如 UDP、IP）不需建链，每个报文独立携带目的地址。"},
  {"id":"cn-105","ch":"cn-1","stem":"下列设备中，工作在网络层的是（　）。","opts":["集线器（Hub）","交换机（Switch）","路由器（Router）","中继器（Repeater）"],"ans":[2],"ex":"中继器/集线器（物理层）、交换机/网桥（数据链路层）、路由器（网络层）、网关（应用层，泛指高层转换）。交换机按 MAC 转发，路由器按 IP 转发。"},
  {"id":"cn-201","ch":"cn-2","tag":"计算","stem":"某理想低通信道带宽为 3kHz，采用 4 种相位（4 种码元）调制，其极限数据率为（　）。","opts":["6 kbps","12 kbps","24 kbps","48 kbps"],"ans":[1],"ex":"奈氏准则：`C = 2W log₂V`。W=3kHz、V=4 → C = 2×3000×log₂4 = 2×3000×2 = **12 kbps**。奈氏给出的是理想无噪声下的上限，与信噪比无关。"},
  {"id":"cn-202","ch":"cn-2","tag":"计算","stem":"某信道带宽为 3kHz，信噪比为 30dB，其极限数据传输速率约为（　）。","opts":["3 kbps","6 kbps","30 kbps","60 kbps"],"ans":[2],"ex":"香农定理：`C = W log₂(1+S/N)`。30dB → S/N = 10^(30/10) = 1000。C = 3000 × log₂(1001) ≈ 3000 × 9.97 ≈ **29.9 kbps**，取 30 kbps。"},
  {"id":"cn-203","ch":"cn-2","stem":"关于码元与比特率，下列说法正确的是（　）。","opts":["一个码元一定携带 1 比特","波特率等于比特率","一个码元可携带多个比特，取决于码元的离散状态数","比特率一定大于波特率"],"ans":[2],"ex":"若码元有 V 种状态，则每个码元携带 log₂V 比特：`比特率 = 波特率 × log₂V`。只有 V=2 时两者相等；V=1 时比特率为 0（无信息）。"},
  {"id":"cn-204","ch":"cn-2","stem":"曼彻斯特编码的特点是（　）。","opts":["每个码元中间跳变，自带同步信息，频带利用率低","只有高电平表示 1","不需要同步信号但能效最高","与差分曼彻斯特编码完全相同"],"ans":[0],"ex":"曼彻斯特编码在每个码元**中间**都有一次跳变（用于提取同步时钟），因此编码效率只有 50%（波特率是比特率的 2 倍）。以太网 10BASE-T 用的就是曼彻斯特编码。"},
  {"id":"cn-205","ch":"cn-2","stem":"下列传输介质中，抗电磁干扰能力最强、带宽最大的是（　）。","opts":["双绞线","同轴电缆","光纤","无线电波"],"ans":[2],"ex":"光纤以光信号传输，不受电磁干扰、带宽极高、衰减小、保密性好。双绞线便宜但抗干扰弱；同轴居中；无线电易受干扰且共享介质。"},
  {"id":"cn-301","ch":"cn-3","stem":"CSMA/CD 协议中，「冲突检测」的作用是（　）。","opts":["在发送前避免冲突","边发送边监听，发现冲突立即停止并退避重发","在接收后校验帧","用于分配 IP 地址"],"ans":[1],"ex":"CSMA/CD = 载波监听 + 多点接入 + **冲突检测**。发送中持续检测，冲突则立即停止（发强化干扰信号）并按**二进制指数退避**重传。冲突检测使以太网无需确认即可高效工作。"},
  {"id":"cn-302","ch":"cn-3","tag":"高频","stem":"以太网规定最小帧长为 64 字节，其主要目的是（　）。","opts":["节省带宽","保证发送方在帧发送完毕前能检测到冲突","便于差错校验","兼容 IPv4 首部长度"],"ans":[1],"ex":"若帧太短，可能在发完前冲突信号还没返回，发送方会误以为发送成功。最小帧长 = 2×单程传播时延×数据率（往返时延内发出的比特数），即「争用期」内必须仍在发送。"},
  {"id":"cn-303","ch":"cn-3","tag":"计算","stem":"采用停止-等待协议，数据帧长 1000 bit，数据率 10 Mbps，往返时延 20 ms（忽略确认帧发送时间），则信道利用率为（　）。","opts":["约 0.5%","约 5%","约 50%","约 95%"],"ans":[0],"ex":"发送时延 = 1000/10⁷ = 0.1 ms；一个周期 = 0.1 + 20 = 20.1 ms。利用率 = 0.1/20.1 ≈ **0.5%**。这就是停止-等待在长时延链路上效率极低的原因，需用滑动窗口。"},
  {"id":"cn-304","ch":"cn-3","stem":"以太网交换机（二层交换机）的转发表是通过（　）建立的。","opts":["手工静态配置全部表项","自学习：记录收到帧的源 MAC 与入端口","运行 OSPF 协议","由 DHCP 服务器下发"],"ans":[1],"ex":"交换机收到帧后记录「源 MAC → 入端口」，转发时查目的 MAC：命中则定向转发，未命中则泛洪。表项有老化时间，过期删除。"},
  {"id":"cn-305","ch":"cn-3","stem":"数据链路层的 PPP 协议提供的功能是（　）。","opts":["可靠传输与流量控制","组帧、差错检测（FCS）、链路建立与认证","路由选择","拥塞控制"],"ans":[1],"ex":"PPP 面向字节、只做**差错检测不做纠错/重传**（不可靠），支持 LCP 链路建立与 PAP/CHAP 认证，用于点对点链路（拨号、专线）。"},
  {"id":"cn-401","ch":"cn-4","tag":"计算","stem":"某子网掩码为 255.255.255.192，则该子网可分配给主机的地址数是（　）。","opts":["62","64","126","254"],"ans":[0],"ex":"255.255.255.192 = /26，主机位 6 位 → 2⁶ = 64 个地址，去掉网络地址与广播地址，**可用主机数 62**。"},
  {"id":"cn-402","ch":"cn-4","tag":"计算","stem":"将 192.168.0.0/24、192.168.1.0/24、192.168.2.0/24、192.168.3.0/24 四个网络进行路由聚合，结果是（　）。","opts":["192.168.0.0/23","192.168.0.0/22","192.168.0.0/21","192.168.0.0/20"],"ans":[1],"ex":"前两段相同（192.168.0），第三段为 0~3，二进制 00000000~00000011，前 6 位相同，故网络前缀 = 16+6 = 22 位 → **192.168.0.0/22**。"},
  {"id":"cn-403","ch":"cn-4","tag":"计算","stem":"某 IP 数据报总长度 4000 B（首部 20 B），需通过 MTU=1500 B 的链路，则需分成（　）个分片。","opts":["2","3","4","5"],"ans":[1],"ex":"数据部分 3980 B，每片数据上限 = 1500−20 = 1480 B（且必须为 8 的倍数，1480 可）。片 1：1480（偏移 0）；片 2：1480（偏移 185 单位）；片 3：1020（偏移 370 单位）。共 **3 片**。"},
  {"id":"cn-404","ch":"cn-4","stem":"ARP 协议的作用是（　）。","opts":["把域名解析为 IP","在同一局域网内把 IP 地址解析为 MAC 地址","把 MAC 地址解析为 IP 地址","在两个网络间选择路由"],"ans":[1],"ex":"ARP 在**同一广播域内**通过广播请求、单播应答，把目的 IP 解析为 MAC。若目的主机不在本网段，则 ARP 请求的是**默认网关的 MAC**。跨网段ARP代理少见，勿混。"},
  {"id":"cn-405","ch":"cn-4","stem":"下列路由协议中，采用链路状态算法的是（　）。","opts":["RIP","OSPF","BGP","IGRP"],"ans":[1],"ex":"OSPF 是**链路状态**协议（每台路由器洪泛 LSA，各自用 Dijkstra 算最短路径）；RIP 是**距离向量**协议（跳数，最大 15）。BGP 是自治系统间的**路径向量**协议。"},
  {"id":"cn-406","ch":"cn-4","stem":"NAT（网络地址转换）技术的主要作用是（　）。","opts":["加密 IP 数据报","缓解 IPv4 地址短缺，让内网主机共用少量公网地址访问外网","加快路由收敛","实现子网划分"],"ans":[1],"ex":"NAT/NAPT 在私有网络与公网之间改写源/目的 IP 与端口，使多个内网主机共享一个公网 IP。它破坏了端到端透明性，也是很多 P2P 连接需要打洞的原因。"},
  {"id":"cn-501","ch":"cn-5","tag":"必背","stem":"TCP 三次握手中，第三次握手（ACK）的主要作用是（　）。","opts":["确认服务器接收能力","防止已失效的连接请求报文段突然到达导致错误连接","协商窗口大小","开始慢启动"],"ans":[1],"ex":"三次握手可防止「旧的重复 SYN」建立无效连接：客户端对服务器 SYN+ACK 再次确认，服务器才认为连接建立。两次握手的话，服务器会为失效请求白建连接、浪费资源。"},
  {"id":"cn-502","ch":"cn-5","tag":"高频","stem":"TCP 四次挥手中，主动关闭方进入 TIME_WAIT 状态并等待 2MSL，其目的是（　）。","opts":["等待数据全部到达","保证最后一个 ACK 能被对方收到，并让旧报文在网络中消失","让子网重新收敛","减少重传次数"],"ans":[1],"ex":"两个目的：① 若最后一个 ACK 丢失，对方会重发 FIN，本端还能再回一个 ACK；② 让本连接的旧报文段在网络中消亡，避免影响新连接（同端口复用）。"},
  {"id":"cn-503","ch":"cn-5","tag":"计算","stem":"TCP 慢启动阶段，初始拥塞窗口 cwnd = 1 MSS，若未达到慢启动阈值，则经过 4 个 RTT 后 cwnd 为（　）MSS。","opts":["4","8","16","32"],"ans":[2],"ex":"慢启动每个 RTT **翻倍**：1 → 2 → 4 → 8 → 16。4 个 RTT 后为 **16 MSS**。到达阈值后转为拥塞避免（每 RTT 加 1 MSS），呈线性增长。"},
  {"id":"cn-504","ch":"cn-5","stem":"主机 A 向 B 连续发送 3 个报文段，每段 1000 B，初始序号为 1000。则第三个报文段的序号是（　）。","opts":["2000","3000","1000","4000"],"ans":[1],"ex":"TCP 序号按**字节**编号：段 1 用 1000~1999，段 2 用 2000~2999，段 3 用 **3000** 起。注意 SYN 与 FIN 各消耗一个序号。"},
  {"id":"cn-505","ch":"cn-5","stem":"关于 UDP，下列说法正确的是（　）。","opts":["提供可靠传输","首部仅 8 字节，无连接、不保证可靠、开销小","支持拥塞控制","必须按序交付"],"ans":[1],"ex":"UDP 首部 8 字节（源端口 2、目的端口 2、长度 2、校验和 2）。它无连接、不可靠、无流量与拥塞控制、不保证顺序，正因开销小、时延低，才适合实时音视频、DNS、DHCP 等场景。"},
  {"id":"cn-506","ch":"cn-5","stem":"TCP 的流量控制是通过（　）实现的。","opts":["拥塞窗口 cwnd","接收窗口 rwnd 与滑动窗口机制","IP 首部中的 TTL","路由重定向"],"ans":[1],"ex":"**流量控制**看接收方通告的窗口 rwnd（避免淹没接收方）；**拥塞控制**看 cwnd（避免压垮网络）。实际发送窗口 = min(rwnd, cwnd)。"},
  {"id":"cn-601","ch":"cn-6","stem":"DNS 查询中，「递归查询」的含义是（　）。","opts":["本机反复向根服务器查询","本机把查询交给本地域名服务器，由它代为一路查到底并返回最终结果","服务器只返回下一级服务器地址","使用 UDP 端口 53 的查询"],"ans":[1],"ex":"递归查询：客户端只发一次请求，本地 DNS 负责替它走完整个解析链。迭代查询：服务器返回「下一步该问谁」，由提问方自己继续。主机→本地 DNS 通常是递归，本地 DNS→根/顶级域通常是迭代。"},
  {"id":"cn-602","ch":"cn-6","stem":"HTTP/1.1 相比 HTTP/1.0 的最大改进是（　）。","opts":["引入加密传输","默认使用持久连接（keep-alive），可复用 TCP 连接","改用 UDP 传输","支持二进制分帧"],"ans":[1],"ex":"HTTP/1.1 默认持久连接，多个请求可复用同一 TCP 连接，减少握手与慢启动开销。加密是 HTTPS（TLS）的事；二进制分帧与多路复用是 HTTP/2 的特性。"},
  {"id":"cn-603","ch":"cn-6","stem":"发送电子邮件时，把邮件送到接收方邮件服务器的协议通常是（　）。","opts":["POP3","IMAP","SMTP","FTP"],"ans":[2],"ex":"SMTP 负责**发送/中继**邮件（推），POP3/IMAP 负责**读取**邮件（拉）。注意 SMTP 只支持 ASCII，需 MIME 扩展来传附件与中文。"},
  {"id":"cn-604","ch":"cn-6","stem":"DHCP 协议使用（　）方式为客户端动态分配 IP 地址。","opts":["客户端主动广播自己的固定 IP","客户端广播 DHCP Discover，服务器应答提供地址","通过 DNS 查询地址","由路由器静态配置"],"ans":[1],"ex":"DHCP 四步：**Discover（广播）→ Offer → Request → ACK**。客户端初始无 IP，用 0.0.0.0 源地址、255.255.255.255 目的地址广播，服务器从地址池分配并给出租期。"},
  {"id":"cn-605","ch":"cn-6","stem":"在浏览器输入 URL 后，最先发生的是（　）。","opts":["建立 TCP 连接","DNS 解析域名得到 IP","发送 HTTP 请求","加载缓存图片"],"ans":[1],"ex":"顺序：URL 解析 → DNS 解析（若无缓存）→ 建立 TCP 连接（三次握手，HTTPS 还要 TLS 握手）→ 发送 HTTP 请求 → 接收响应 → 渲染页面。"},
  {"id":"cn-306","ch":"cn-3","tag":"计算","stem":"链路带宽 10 Mbps、单向传播时延 10 ms，数据帧长 1500 B（确认帧开销忽略）。采用滑动窗口协议时，使信道利用率达到 100% 所需的最小窗口大小为（　）帧。","opts":["17","18","20","24"],"ans":[1],"ex":"发送时延 = 1500×8 / 10⁷ = 1.2 ms，一个来回共 1.2 + 20（RTT）= 21.2 ms。窗口需覆盖这段时间：W × 1.2 ≥ 21.2 → W ≥ 17.67，故最小取 **18 帧**。"},
  {"id":"cn-307","ch":"cn-3","tag":"计算","stem":"以太网 MAC 帧最小长度为 64 B，其中首部 14 B、尾部 FCS 4 B，则数据字段最少要（　），不足的需填充。","opts":["42 B","46 B","48 B","50 B"],"ans":[1],"ex":"数据最少 = 64 − 14 − 4 = **46 B**。之所以规定最小帧长，是为了保证发送方在争用期内仍处于发送状态，能检测到冲突。"},
  {"id":"cn-308","ch":"cn-3","stem":"用一台 8 端口的二层以太网交换机连接 8 台主机，则冲突域和广播域的数量分别是（　）。","opts":["1 和 1","8 和 1","1 和 8","8 和 8"],"ans":[1],"ex":"交换机的每个端口是独立的冲突域（共 **8** 个），但在未划 VLAN 时所有端口同属一个广播域（**1** 个）。要分割广播域需用 VLAN 或路由器。"},
  {"id":"cn-311","ch":"cn-3","stem":"交换机收到一个帧，其目的 MAC 地址在转发表中查不到，此时交换机（　）。","opts":["丢弃该帧","向除入端口外的所有端口转发（泛洪）","从原端口发回","等待目的主机主动注册"],"ans":[1],"ex":"目的地址未知时按**泛洪**处理：转发到除接收端口外的所有端口。收到应答后学习到该 MAC 与端口，后续即可定向转发。这也是交换机能「自学习」的原因。"},
  {"id":"cn-309","ch":"cn-4","stem":"下列地址中，可以作为主机 IP 地址正常使用的是（　）。","opts":["192.168.1.0/24","192.168.1.255/24","192.168.1.100/24","224.0.0.1"],"ans":[2],"ex":"192.168.1.0/24 是网络地址、192.168.1.255 是广播地址，都不能分配给主机；224.0.0.1 是组播地址（D 类），也不是普通主机地址。"},
  {"id":"cn-314","ch":"cn-4","tag":"计算","stem":"某公司有 5 个部门，每个部门主机数不超过 25 台，现用 192.168.1.0/24 划分子网，最合适的子网掩码是（　）。","opts":["255.255.255.192","255.255.255.224","255.255.255.240","255.255.255.248"],"ans":[1],"ex":"每子网需 25 台可用主机 → 主机位 ≥ 5（2⁵−2 = 30 ≥ 25）。主机位 5 位即掩码 /27 = **255.255.255.224**，可划 8 个子网，满足 5 个部门。/28 只有 14 台主机，不够用。"},
  {"id":"cn-310","ch":"cn-5","tag":"计算","stem":"TCP 慢启动阈值 ssthresh 为 16 MSS，拥塞窗口从 1 MSS 开始增长，且期间未发生丢包，则经过 6 个 RTT 后 cwnd 约为（　）MSS。","opts":["16","17","18","32"],"ans":[2],"ex":"RTT 1~4 处于慢启动（翻倍）：1→2→4→8→16。第 5 个 RTT 起 cwnd 达到 ssthresh，转为**拥塞避免**，每 RTT 加 1：16→17→**18**。"},
  {"id":"cn-312","ch":"cn-6","stem":"HTTP 响应状态码 301 表示（　）。","opts":["请求成功","临时重定向","永久重定向","服务器内部错误"],"ans":[2],"ex":"3xx 为重定向：**301 永久重定向**（客户端应更新书签/缓存该新地址）、302 临时重定向、304 资源未修改（走缓存）。2xx 成功、4xx 客户端错误、5xx 服务端错误。"},
  {"id":"cn-106","ch":"cn-1","stem":"分组交换网的端到端总时延不包含（　）。","opts":["发送时延","传播时延","结点处理时延","磁盘寻道时延"],"ans":[3],"ex":"总时延 = 发送时延（数据率决定）+ 传播时延（距离/光速）+ 处理时延 + 排队时延。磁盘寻道是存储设备内部的时间，与网络传输无关。"},
  {"id":"cn-206","ch":"cn-2","stem":"频分复用（FDM）与时分复用（TDM）的根本区别是（　）。","opts":["FDM 按频率划分信道，TDM 按时间片划分信道","FDM 只能传数字信号","TDM 不需要任何同步","两者本质相同"],"ans":[0],"ex":"FDM 把频带切成互不重叠的子频带，各用户同时占用不同频率；TDM 让各用户轮流占用整个频带的同一时间片。TDM 需要严格同步，否则会串扰。"},
  {"id":"cn-207","ch":"cn-2","stem":"10BASE-T 以太网在物理层采用的编码方式是（　）。","opts":["曼彻斯特编码","4B/5B 编码","不归零（NRZ）编码","差分曼彻斯特编码"],"ans":[0],"ex":"10BASE-T 沿用 10Mbps 以太网的**曼彻斯特编码**（每码元中间跳变，自带同步，效率 50%）。4B/5B 用于 100BASE-FX 等快速以太网。"},
  {"id":"cn-315","ch":"cn-3","tag":"计算","stem":"采用 GBN（回退 N）协议，发送窗口为 4。若第 2 号帧丢失而 3、4 号帧被正确接收，接收方如何反应、发送方要重传哪些帧？","opts":["只重传第 2 帧","接收方丢弃 3、4 号帧，发送方重传第 2、3、4 帧","重传全部已发帧","不重传，靠上层重发"],"ans":[1],"ex":"GBN 的接收窗口只有 1：收到乱序的 3、4 号帧会**直接丢弃并重复确认最后一个按序帧**。发送方超时后从 2 号开始**把其后所有已发帧一起重传**，这正是「回退 N」的含义。"},
  {"id":"cn-316","ch":"cn-3","stem":"以太网 V2（DIX Ethernet）帧首部中「类型」字段的长度是（　）。","opts":["1 字节","2 字节","4 字节","6 字节"],"ans":[1],"ex":"以太网 V2 帧：目的 MAC 6B + 源 MAC 6B + **类型 2B** + 数据 46~1500B + FCS 4B。类型字段标识上层协议（0x0800 为 IP）。"},
  {"id":"cn-407","ch":"cn-4","stem":"IPv4 首部中用于防止分组在网络中无限循环的字段是（　）。","opts":["标识","标志","生存时间 TTL","首部校验和"],"ans":[2],"ex":"TTL 每经过一个路由器减 1，减到 0 就丢弃并回送 ICMP 超时报文。它既限制环路，也被 traceroute 用来探测路径。"},
  {"id":"cn-408","ch":"cn-4","tag":"高频","stem":"路由器转发分组时，若路由表中存在多条匹配的表项，应选择（　）。","opts":["最先匹配到的那条","前缀最长（最具体）的那条","度量值最大的那条","随机选择一条"],"ans":[1],"ex":"**最长前缀匹配**：掩码越长越具体，优先级越高。例如同时匹配 /16 和 /24 时选 /24。这是 CIDR 能够正确聚合路由的前提。"},
  {"id":"cn-507","ch":"cn-5","stem":"TCP 客户端主动关闭连接，发送 FIN 之后进入的状态是（　）。","opts":["CLOSE_WAIT","FIN_WAIT_1","TIME_WAIT","LAST_ACK"],"ans":[1],"ex":"主动关闭方的状态迁移：FIN_WAIT_1 →（收到对方的 ACK）FIN_WAIT_2 →（收到对方 FIN 并回 ACK）TIME_WAIT → 2MSL 后 CLOSED。CLOSE_WAIT 是被动关闭方的状态。"},
  {"id":"cn-508","ch":"cn-5","tag":"概念","stem":"下列字段中，**不属于** TCP 首部、但与可靠传输直接相关的一组是（　）。","opts":["序号","确认号","窗口","目的 MAC 地址"],"ans":[3],"ex":"序号（字节流编号）、确认号（累积确认）、窗口（流量控制）都是 TCP 首部字段。**目的 MAC 地址在以太网帧首部**，属于链路层，与 TCP 可靠传输无关。"},
  {"id":"cn-606","ch":"cn-6","stem":"HTTP 中用于与服务器协商缓存是否失效的请求头是（　）。","opts":["If-None-Match","Content-Length","User-Agent","Host"],"ans":[0],"ex":"`If-None-Match` 携带上次响应的 ETag，服务器比对后若资源未变则返回 **304 Not Modified**，客户端直接使用本地缓存，省掉传输。`If-Modified-Since` 是与之对应的按时间协商方式。"},
  {"id":"cn-607","ch":"cn-6","stem":"Cookie 机制的主要作用是（　）。","opts":["加密传输内容","让本身无状态（stateless）的 HTTP 能够在客户端保存会话状态","加快 DNS 解析","动态分配 IP 地址"],"ans":[1],"ex":"HTTP 本身不记忆状态，服务器通过 Set-Cookie 下发标识，浏览器后续请求自动携带，从而实现登录态、购物车等。Cookie 本身不加密（除非配合 HTTPS 的 Secure 属性）。"},
  {"id":"cn-608","ch":"cn-6","stem":"用户从邮件服务器**读取**自己的邮件，通常使用（　）。","opts":["SMTP","POP3 或 IMAP","FTP","SNMP"],"ans":[1],"ex":"SMTP 负责**发送/中继**（推），POP3/IMAP 负责**读取**（拉）。IMAP 支持在服务器上管理文件夹、多端同步，POP3 通常把邮件下载到本地。"}

window.DATA.k.cn = [
  {"ch":"cn-1","t":"OSI 七层与 TCP/IP 四层","tag":"必背","b":"OSI：**物、数、网、传、会、表、应**（物理/数据链路/网络/传输/会话/表示/应用）。\nTCP/IP：网络接口层、网际层（IP）、传输层（TCP/UDP）、应用层。\n各层数据单元：比特 → 帧 → 分组（数据报）→ 报文段/用户数据报 → 报文。\n!! 常考「某功能属于哪一层」：路由=网络层；端到端=传输层；相邻结点=链路层。"},
  {"ch":"cn-1","t":"封装与对等通信","tag":"速记","b":"发送方：应用数据 → 加 TCP 首部（段）→ 加 IP 首部（分组）→ 加帧头帧尾（帧）→ 比特流。\n每层只关心本层首部，中间设备最多解析到本层：交换机看到帧，路由器看到 IP 分组。\n!! 「对等层通信」是逻辑概念，实际数据逐层穿透协议栈。"},
  {"ch":"cn-1","t":"各层典型协议与设备","tag":"对照","b":"- 应用层：HTTP、DNS、SMTP、FTP、DHCP\n- 传输层：TCP、UDP\n- 网络层：IP、ICMP、ARP、RIP、OSPF、BGP\n- 链路层：PPP、HDLC、以太网、CSMA/CD\n- 物理层：RS-232、10BASE-T\n设备：集线器（物理）、交换机（链路）、路由器（网络）、网关（高层）\n!! ARP 归属有争议，多数教材归在网络层（也有归链路层），按题目语境判断。"},
  {"ch":"cn-2","t":"奈氏准则 vs 香农定理","tag":"必背","b":"**奈氏**（无噪声）：`C = 2W log₂V`，V 为码元状态数。\n**香农**（有噪声）：`C = W log₂(1 + S/N)`。\n`S/N(dB) = 10 log₁₀(S/N)`。\n!! 两者取**较小者**为实际上限时往往要一起用——题目说「理想低通」用奈氏，「有噪声/信噪比」用香农。"},
  {"ch":"cn-2","t":"编码与调制","tag":"速记","b":"- 曼彻斯特：每码元中间跳变，自带同步，效率 50%（以太网）\n- 差分曼彻斯特：看边界有无跳变表示 0/1，抗干扰更好\n- 4B/5B：每 4 比特映射成 5 比特，效率 80%（100BASE-FX）\n- 归零/不归零：NRZ 简单但无同步\n!! 波特率与比特率：`比特率 = 波特率 × log₂V`。"},
  {"ch":"cn-3","t":"CSMA/CD 要点","tag":"必背","b":"载波监听 + 多点接入 + 冲突检测。\n- 发送前监听（1-坚持）、边发边听、冲突则停发并**二进制指数退避**\n- 最小帧长 = 争用期（2τ）× 数据率 → 以太网 64 B\n- 只能用于**半双工**共享介质，全双工交换式以太网不需要 CSMA/CD\n!! 「为什么最小帧长是 64B」几乎年年考。"},
  {"ch":"cn-3","t":"差错控制与滑动窗口","tag":"必背","b":"- **奇偶校验**：只能检 1 位错\n- **CRC**：能检出绝大多数突发错误（链路层 FCS）\n- **停止-等待**：效率 = `Td/(Td+RTT+Ta)`\n- **GBN（回退 N）**：出错则重发该帧及其后所有帧，接收窗口 = 1\n- **选择重传 SR**：只重发出错帧，接收窗口 > 1\n!! 信道利用率低时先想「增大窗口 / 改用 GBN 或 SR」。"},
  {"ch":"cn-3","t":"交换机与网桥","tag":"速记","b":"交换机 = 多端口网桥，工作在链路层，**按 MAC 转发**，各端口是独立冲突域（全双工无冲突）。\n自学习：记录源 MAC → 入端口；目的未知则泛洪；有老化时间。\n!! 交换机分割**冲突域**但不分割**广播域**（要分割广播域需 VLAN 或路由器）。"},
  {"ch":"cn-4","t":"IP 地址与子网划分（核心计算）","tag":"必背","b":"`网络地址 = IP AND 子网掩码`\n`主机数 = 2^主机位数 − 2`（去掉网络地址与广播地址）\n`/26` → 掩码 255.255.255.192，主机位 6 → 62 台\n!! CIDR 聚合：把前缀末尾的差异位「抹掉」，取公共前缀。\n!! 记住常见：/24=255.255.255.0、/26=.192、/28=.240、/30=.252。"},
  {"ch":"cn-4","t":"ARP 与 ICMP","tag":"易错","b":"**ARP**：同网段内 IP → MAC，广播请求、单播应答，有缓存（老化）。跨网段时请求的是**网关 MAC**。\n**ICMP**：差错报告（目的不可达、超时、重定向）与询问（ping 用 Echo Request/Reply）。traceroute 利用 TTL 递减 + 超时报文。\n!! ping 不通不代表 ARP 不工作；ARP 是链路层广播，ICMP 是网络层报文。"},
  {"ch":"cn-4","t":"路由协议三类","tag":"对照","b":"- **RIP**：距离向量，跳数，最大 15 跳，30s 广播，收敛慢\n- **OSPF**：链路状态，洪泛 LSA + Dijkstra，收敛快，支持区域划分\n- **BGP**：路径向量，AS 之间，基于策略而非最短路径\n!! 内部网关协议 = RIP/OSPF；外部网关协议 = BGP。"},
  {"ch":"cn-4","t":"NAT 与 IP 分片","tag":"计算","b":"**NAT**：改写 IP + 端口，缓解地址短缺；破坏端到端透明。\n**分片**：MTU 限制，数据部分必须是 **8 字节的整数倍**；\n偏移字段以 8 字节为单位；MF=1 表示后面还有分片。\n!! 计算题：总长 4000、MTU 1500 → 数据 3980 → 1480+1480+1020 共 3 片。"},
  {"ch":"cn-5","t":"TCP 三次握手 / 四次挥手","tag":"必背","b":"**三次握手**：SYN → SYN+ACK → ACK。（防失效连接请求）\n**四次挥手**：FIN → ACK → FIN → ACK。（半关闭，双方各自释放）\n主动关闭方最后进入 **TIME_WAIT，等 2MSL**。\n!! 序号按字节编号；SYN 和 FIN 各消耗 1 个序号。"},
  {"ch":"cn-5","t":"流量控制 vs 拥塞控制","tag":"易错","b":"**流量控制**：接收方通告 rwnd，防止压垮接收方（端到端）。\n**拥塞控制**：cwnd 反映网络状况，防止压垮网络。\n实际发送窗口 = `min(rwnd, cwnd)`。\n拥塞控制四阶段：**慢启动（倍增）、拥塞避免（加 1）、快重传（3 个重复 ACK）、快恢复**。"},
  {"ch":"cn-5","t":"拥塞控制曲线（必背）","tag":"必背","b":"- 慢启动：cwnd 从 1 开始，**每个 RTT 翻倍**，直到 ssthresh\n- 拥塞避免：每 RTT 加 1 MSS（线性）\n- 超时重传：ssthresh = cwnd/2，cwnd 回到 **1**\n- 快重传 + 快恢复：ssthresh = cwnd/2，cwnd = ssthresh（不回 1）\n!! 超时 → 归 1；三重复 ACK → 快恢复。这是最常考的区别。"},
  {"ch":"cn-5","t":"TCP vs UDP","tag":"对照","b":"| | TCP | UDP |\n|---|---|---|\n| 连接 | 面向连接 | 无连接 |\n| 可靠性 | 可靠（确认重传排序） | 不可靠 |\n| 首部 | 20 B（可扩展） | 8 B |\n| 适用 | 文件、网页、邮件 | 实时音视频、DNS、DHCP |\n!! TCP 有流量/拥塞控制，UDP 都没有。"},
  {"ch":"cn-6","t":"DNS 解析过程","tag":"必背","b":"本机缓存 → hosts → 本地域名服务器 → 根 → 顶级域 → 权威服务器。\n**递归查询**：客户端只问一次，由本地 DNS 代劳到底。\n**迭代查询**：服务器只告诉「下一步问谁」。\n记录类型：A（IPv4）、AAAA（IPv6）、CNAME（别名）、MX（邮件）、NS。\n!! 默认用 UDP 53，区传送用 TCP 53。"},
  {"ch":"cn-6","t":"HTTP 与 HTTPS","tag":"速记","b":"- HTTP/1.0：非持久，每请求一个 TCP 连接\n- HTTP/1.1：**持久连接 + 管道化**，默认 keep-alive\n- HTTP/2：二进制分帧、多路复用、头部压缩\n- HTTPS = HTTP + TLS（443 端口）\n状态码：2xx 成功、3xx 重定向、4xx 客户端错、5xx 服务端错。\n!! 缓存控制：Cache-Control、ETag/If-None-Match、Last-Modified。"},
  {"ch":"cn-6","t":"邮件与 DHCP 流程","tag":"速记","b":"邮件：`SMTP（推，发送/中继）` + `POP3/IMAP（拉，读取）`，非 ASCII 内容用 **MIME** 扩展。\nDHCP 四步：**Discover → Offer → Request → ACK**（广播发起，客户端初始无 IP）。\n!! 邮件服务器之间用 SMTP；用户从服务器取信不能用 SMTP。"}

  {"id":"m-102","ch":"m-1","tag":"真题风格","stem":"`lim(x→0) (e^x − 1 − x) / x²` 的值为（　）。","opts":["0","1/2","1","2"],"ans":[1],"ex":"泰勒展开 `e^x = 1 + x + x²/2 + o(x²)`，故分子 = x²/2 + o(x²)，极限为 `1/2`。等价无穷小 `e^x − 1 ~ x` 在这里不够用（会得到 0/0 的错误结论），必须展开到二阶。"},
  {"id":"m-103","ch":"m-1","tag":"真题风格","stem":"`lim(x→0) (tan x − sin x)/x³` 的值为（　）。","opts":["1/6","1/3","1/2","1"],"ans":[2],"ex":"拆解：`tan x − sin x = sin x (1/cos x − 1) = sin x · (1 − cos x)/cos x`。当 x→0 时 `sin x ~ x`、`1 − cos x ~ x²/2`、`cos x → 1`，故整体 ~ `x · (x²/2) = x³/2`，极限为 `1/2`。"},
  {"id":"m-104","ch":"m-1","tag":"概念","stem":"函数 `f(x) = sin x / |x|` 在 x = 0 处（　）。","opts":["连续","是第一类跳跃间断点","是可去间断点","是第二类间断点"],"ans":[1],"ex":"左极限 `lim(x→0⁻) sin x / |x| = −1`，右极限 `lim(x→0⁺) = +1`，左右极限都存在但不相等 → **跳跃间断点**（第一类）。"},

  {"id":"m-106","ch":"m-1","stem":"若函数 f(x) 在 x₀ 处可导，则下列说法正确的是（　）。","opts":["f(x) 在 x₀ 处必连续","f(x) 在 x₀ 处必有极限但不一定连续","f(x) 在 x₀ 处连续但不可导","f(x) 在该点必取得极值"],"ans":[0],"ex":"可导 ⇒ 连续，反之不成立（如 |x| 在 0 处连续但不可导）。注意方向：可导是更强的条件。"},
  {"id":"m-201","ch":"m-2","tag":"概念","stem":"设 f(x) 在 x₀ 处可导，则 `lim(h→0) [f(x₀ + 2h) − f(x₀)] / h` 等于（　）。","opts":["f′(x₀)","2f′(x₀)","f′(x₀)/2","不存在"],"ans":[1],"ex":"令 `t = 2h`，原式 = `2 · lim(t→0) [f(x₀+t) − f(x₀)]/t = 2f′(x₀)`。**导数定义中的增量必须与分子增量一致**，不一致时要乘系数配平。"},
  {"id":"m-202","ch":"m-2","tag":"真题风格","stem":"设 `y = xˣ`（x > 0），则 y′ =（　）。","opts":["xˣ","xˣ ln x","xˣ(ln x + 1)","x^(x−1)"],"ans":[2],"ex":"取对数：`ln y = x ln x`，两边对 x 求导得 `y′/y = ln x + 1`，故 `y′ = xˣ(ln x + 1)`。幂指函数必须**先取对数再求导**（或写成 e^(x ln x)）。"},
  {"id":"m-203","ch":"m-2","stem":"函数 `f(x) = x³ − 3x` 的极大值与极小值分别为（　）。","opts":["2 与 −2","−2 与 2","0 与 −2","2 与 0"],"ans":[0],"ex":"`f′(x) = 3x² − 3 = 0` 得 x = ±1。`f″(x) = 6x`：f″(−1) = −6 < 0 → 极大值 f(−1) = −1 + 3 = **2**；f″(1) = 6 > 0 → 极小值 f(1) = 1 − 3 = **−2**。"},
  {"id":"m-204","ch":"m-2","tag":"概念","stem":"关于罗尔定理的条件，下列表述正确的是（　）。","opts":["f 在 [a,b] 连续、在 (a,b) 可导、且 f(a)=f(b)","f 在 [a,b] 可导且 f(a)=f(b)","f 在 (a,b) 连续且 f(a)≠f(b)","只需 f 在 [a,b] 连续即可"],"ans":[0],"ex":"罗尔定理三条件：闭区间连续、开区间可导、端点值相等，结论是存在 ξ∈(a,b) 使 f′(ξ)=0。三个条件缺一不可。"},
  {"id":"m-205","ch":"m-2","stem":"曲线 `y = x⁴ − 2x²` 的拐点个数为（　）。","opts":["0","1","2","3"],"ans":[2],"ex":"`y′ = 4x³ − 4x`，`y″ = 12x² − 4 = 0` 得 `x = ±1/√3`。两处二阶导变号，故有 **2 个拐点**。注意拐点要求二阶导**变号**，仅 y″=0 不够。"},
  {"id":"m-206","ch":"m-2","stem":"若 f(x) 在 x₀ 处取得极值且 f′(x₀) 存在，则必有（　）。","opts":["f′(x₀) > 0","f′(x₀) < 0","f′(x₀) = 0","f″(x₀) = 0"],"ans":[2],"ex":"费马引理：可导的极值点必为驻点（f′(x₀)=0）。但反过来不成立（如 y=x³ 在 0 处导数为 0 却不是极值）。"},
  {"id":"m-301","ch":"m-3","stem":"`∫ x·eˣ dx` 等于（　）。","opts":["(x − 1)eˣ + C","(x + 1)eˣ + C","x·eˣ + C","(x²/2)eˣ + C"],"ans":[0],"ex":"分部积分：取 u = x、dv = eˣdx，得 `∫x eˣdx = x eˣ − ∫eˣdx = (x − 1)eˣ + C`。"},
  {"id":"m-302","ch":"m-3","stem":"`∫₀^π sin x dx` 的值为（　）。","opts":["0","1","2","π"],"ans":[2],"ex":"`∫₀^π sin x dx = [−cos x]₀^π = −(−1) − (−1) = 2`。几何意义是正弦曲线在 [0,π] 上与 x 轴围成的面积（2 个单位面积）。"},
  {"id":"m-303","ch":"m-3","tag":"必背","stem":"反常积分 `∫₁^(+∞) (1/x^p) dx` 收敛的充要条件是（　）。","opts":["p > 0","p ≥ 1","p > 1","p < 1"],"ans":[2],"ex":"p ≠ 1 时原函数为 `x^(1−p)/(1−p)`，要使 x→+∞ 时趋于有限值需 `1−p < 0` 即 **p > 1**；p = 1 时 ln x → ∞ 发散。这是 p 级数积分的标准结论。"},
  {"id":"m-304","ch":"m-3","tag":"高频","stem":"设 `F(x) = ∫₀^x t² dt`，则 F′(x) =（　）。","opts":["x²","2x","x³/3","x²/3"],"ans":[0],"ex":"变限积分求导：`F′(x) = x²`（直接把上限代入被积函数）。若上限是复合函数如 `∫₀^(x²) t²dt`，则 `F′ = (x²)²·2x = 2x⁵`——**别忘了乘内层导数**。"},
  {"id":"m-305","ch":"m-3","stem":"`∫₀¹ x² dx` 的值为（　）。","opts":["1/2","1/3","1/4","1"],"ans":[1],"ex":"`∫₀¹ x²dx = [x³/3]₀¹ = 1/3`。这是最基础的原函数公式，也常作为定积分几何意义的入门题。"},
  {"id":"m-306","ch":"m-3","tag":"真题风格","stem":"设 `f(x)` 连续，`∫₀^1 f(x)dx = 2`，则 `∫₀^(π/2) f(cos x)·sin x dx` 等于（　）。","opts":["0","1","2","4"],"ans":[2],"ex":"令 `t = cos x`，则 `dt = −sin x dx`，x:0→π/2 对应 t:1→0。原式 = `∫₁⁰ f(t)(−dt) = ∫₀¹ f(t)dt = 2`。换元时**上下限要一起换**，这是最常见的失分点。"},
  {"id":"m-401","ch":"m-4","stem":"已知向量 `a = (1, 2, 3)`、`b = (2, −1, 1)`，则 `a × b` =（　）。","opts":["(5, 5, −5)","(5, −5, −5)","(−5, 5, −5)","(1, 5, −5)"],"ans":[0],"ex":"行列式展开：`i(2·1 − 3·(−1)) − j(1·1 − 3·2) + k(1·(−1) − 2·2) = i(5) − j(−5) + k(−5) = (5, 5, −5)`。"},
  {"id":"m-402","ch":"m-4","stem":"过点 (1, 2, 3) 且以向量 (1, 1, 1) 为法向量的平面方程是（　）。","opts":["x + y + z = 6","x + 2y + 3z = 6","x + y + z = 0","x − y + z = 2"],"ans":[0],"ex":"点法式：`1·(x−1) + 1·(y−2) + 1·(z−3) = 0`，整理得 `x + y + z = 6`。"},
  {"id":"m-403","ch":"m-4","stem":"直线 `(x−1)/1 = (y+1)/2 = z/(−1)` 与平面 `2x + 3y + z = 5` 的位置关系是（　）。","opts":["平行但不相交","垂直","斜交","直线在平面内"],"ans":[2],"ex":"直线方向向量 `s = (1,2,−1)`，平面法向量 `n = (2,3,1)`。`s·n = 2 + 6 − 1 = 7 ≠ 0`，且 s 与 n 不成比例 → **斜交**。若 s·n = 0 则平行或在面内。"},
  {"id":"m-404","ch":"m-4","stem":"方程 `x² + y² = 1` 在空间直角坐标系中表示（　）。","opts":["一个圆","母线平行于 z 轴的圆柱面","一个球面","一个圆锥面"],"ans":[1],"ex":"缺 z 变量 → 沿 z 轴「拉伸」成柱面，即 **母线平行于 z 轴的圆柱面**。规律：三元方程缺哪个变量，就沿哪个坐标轴平推。"},
  {"id":"m-501","ch":"m-5","stem":"设 `z = x²y + y³`，则 `∂z/∂x` 与 `∂z/∂y` 分别为（　）。","opts":["2xy 与 x² + 3y²","2xy 与 3y²","x² 与 x² + 3y²","2x 与 3y²"],"ans":[0],"ex":"对 x 求偏导时把 y 当常数：`∂z/∂x = 2xy`；对 y 求偏导时把 x 当常数：`∂z/∂y = x² + 3y²`。"},
  {"id":"m-502","ch":"m-5","tag":"概念","stem":"函数 `z = f(x, y)` 在点 (x₀, y₀) 处可微的充分条件是（　）。","opts":["两个偏导数存在","两个偏导数连续","函数在该点连续","两个偏导数相等"],"ans":[1],"ex":"偏导数连续 ⇒ 可微 ⇒ 偏导数存在（且连续），但偏导存在推不出可微（反例 `f = xy/(x²+y²)` 在原点）。「可微」比「偏导存在」强，比「偏导连续」弱。"},
  {"id":"m-503","ch":"m-5","tag":"高频","stem":"设 `z = f(u, v)`，其中 `u = x + y`、`v = xy`，则 `∂z/∂x` =（　）。","opts":["f′_u + y·f′_v","f′_u + x·f′_v","f′_u − y·f′_v","x·f′_u + y·f′_v"],"ans":[0],"ex":"链式法则：`∂z/∂x = f′_u·∂u/∂x + f′_v·∂v/∂x = f′_u·1 + f′_v·y`。"},
  {"id":"m-504","ch":"m-5","tag":"真题风格","stem":"函数 `z = x² + y² − 2x − 4y` 的极小值为（　）。","opts":["−5","−3","0","−8"],"ans":[0],"ex":"`z_x = 2x − 2 = 0` → x=1；`z_y = 2y − 4 = 0` → y=2。`A = z_xx = 2`、`B = z_xy = 0`、`C = z_yy = 2`，`AC − B² = 4 > 0` 且 A > 0 → 极小值 `z(1,2) = 1 + 4 − 2 − 8 = −5`。"},
  {"id":"m-505","ch":"m-5","stem":"函数在某点沿某方向的方向导数取得最大值，该最大值等于（　）。","opts":["梯度的模","梯度的某个分量","1","0"],"ans":[0],"ex":"`方向导数 = grad f · e`（方向单位向量），在 e 与梯度同向时取最大值，等于**梯度的模** `|grad f|`。梯度方向即函数增长最快的方向。"},
  {"id":"m-506","ch":"m-5","stem":"求二元函数条件极值常用的方法是（　）。","opts":["直接消元或用拉格朗日乘数法","洛必达法则","格林公式","分部积分"],"ans":[0],"ex":"条件极值 `min f(x,y) s.t. g(x,y)=0`：构造拉格朗日函数 `L = f + λg`，令各偏导为 0 联立求解（或直接消元若约束简单）。"},
  {"id":"m-601","ch":"m-6","stem":"设 D 为矩形 `0 ≤ x ≤ 1, 0 ≤ y ≤ 1`，则 `∫∫_D (x + y) dσ` =（　）。","opts":["1/2","1","3/2","2"],"ans":[1],"ex":"分离积分：`∫₀¹∫₀¹ (x+y)dxdy = ∫₀¹(1/2 + y)dy = 1/2 + 1/2 = 1`。也可由对称性：`∫∫x = ∫∫y = 1/2`。"},
  {"id":"m-602","ch":"m-6","tag":"真题风格","stem":"设 D 为单位圆盘 `x² + y² ≤ 1`，则 `∫∫_D e^(x²+y²) dσ` =（　）。","opts":["π(e − 1)","2π(e − 1)","πe","(e − 1)/2"],"ans":[0],"ex":"极坐标：`dσ = r dr dθ`，`∫₀^(2π)dθ ∫₀¹ e^(r²) r dr = 2π · (1/2)(e − 1) = π(e − 1)`。极坐标下**千万别漏掉雅可比因子 r**。"},
  {"id":"m-603","ch":"m-6","tag":"必背","stem":"格林公式 `∮_L P dx + Q dy = ∫∫_D (∂Q/∂x − ∂P/∂y) dσ` 成立的条件之一是（　）。","opts":["L 必须是不闭曲线","L 是分段光滑的闭曲线，且 D 内 L 只包含奇点","L 取正向（区域在左侧），P、Q 在 D 上有连续偏导","L 必须是直线段"],"ans":[2],"ex":"条件：L 为分段光滑**闭曲线**并取**正方向**，D 为 L 所围区域，P、Q 在 D 上有一阶连续偏导数。若 L 内部含奇点（如原点），要先挖洞再套用。"},
  {"id":"m-604","ch":"m-6","stem":"`∫_L P dx + Q dy` 在单连通区域 D 内与路径无关的充要条件是（　）。","opts":["P = Q","∂P/∂y = ∂Q/∂x","∂P/∂x = ∂Q/∂y","P、Q 都连续"],"ans":[1],"ex":"`∂P/∂y = ∂Q/∂x`（区域单连通）→ 存在势函数 u 使 `du = Pdx + Qdy`，积分只与起止点有关。注意是交叉偏导相等，**不要写反**。"},
  {"id":"m-605","ch":"m-6","stem":"高斯公式把对坐标的曲面积分转化为（　）。","opts":["对弧长的曲线积分","二重积分","三重积分","定积分"],"ans":[2],"ex":"`∬_Σ P dydz + Q dzdx + R dxdy = ∭_Ω (∂P/∂x + ∂Q/∂y + ∂R/∂z) dV`。Σ 取外侧时为正，内侧为负；闭合面才可直接用，开曲面要补面。"},
  {"id":"m-701","ch":"m-7","tag":"必背","stem":"级数 `Σ 1/n^p`（p 级数）收敛的充要条件是（　）。","opts":["p > 0","p ≥ 1","p > 1","p < 1"],"ans":[2],"ex":"`Σ 1/n^p` 在 **p > 1** 时收敛，p ≤ 1 时发散。特别注意 p = 1 的调和级数 `Σ1/n` **发散**——这是最容易掉的坑。"},
  {"id":"m-702","ch":"m-7","stem":"级数 `Σ (−1)^n / n` 的收敛性为（　）。","opts":["绝对收敛","条件收敛","发散","收敛性无法判断"],"ans":[1],"ex":"取绝对值后为调和级数 `Σ1/n`，发散；但本身满足莱布尼茨条件（单调递减趋于 0），交错级数收敛 → **条件收敛**。"},
  {"id":"m-703","ch":"m-7","stem":"幂级数 `Σ xⁿ` 的收敛半径与收敛域分别是（　）。","opts":["R=1；(−1, 1)","R=1；[−1, 1]","R=1；(−1, 1]","R=∞；(−∞, ∞)"],"ans":[0],"ex":"比值法：`lim |a_(n+1)/a_n| = 1` → R = 1。端点上 x=1 得 `Σ1` 发散，x=−1 得 `Σ(−1)ⁿ` 发散，故收敛域为开区间 **(−1, 1)**。"},
  {"id":"m-704","ch":"m-7","tag":"必背","stem":"`e^x` 的麦克劳林展开式为（　）。","opts":["Σ xⁿ/n!","Σ (−1)ⁿ xⁿ/n!","Σ xⁿ","Σ (−1)ⁿ x^(2n)/(2n)!"],"ans":[0],"ex":"`e^x = Σ(n=0→∞) xⁿ/n!`，收敛半径 ∞。常见展开要背：`sin x = Σ(−1)ⁿx^(2n+1)/(2n+1)!`、`cos x = Σ(−1)ⁿx^(2n)/(2n)!`、`ln(1+x) = Σ(−1)^(n−1)xⁿ/n`（|x|<1）。"},
  {"id":"m-705","ch":"m-7","stem":"判别说：若 `lim(n→∞) a_(n+1)/a_n = ρ`，则当（　）时正项级数 `Σa_n` 收敛。","opts":["ρ > 1","ρ = 1","ρ < 1","ρ = 0 才收敛"],"ans":[2],"ex":"比值判别法（达朗贝尔）：**ρ < 1 收敛，ρ > 1 发散，ρ = 1 失效**（此时需用其他方法，如比较判别法）。"},
  {"id":"m-801","ch":"m-8","stem":"微分方程 `y′ = 2xy` 的通解是（　）。","opts":["y = Ce^(x²)","y = Ce^(2x)","y = 2x + C","y = Ce^(−x²)"],"ans":[0],"ex":"可分离变量：`dy/y = 2x dx` → `ln|y| = x² + C₁` → `y = Ce^(x²)`。这是最常见的可分离类型。"},
  {"id":"m-802","ch":"m-8","tag":"真题风格","stem":"微分方程 `y′ + y = e^x` 的通解是（　）。","opts":["y = (1/2)e^x + Ce^(−x)","y = e^x + Ce^(−x)","y = (1/2)e^x + Ce^x","y = 2e^x + Ce^(−x)"],"ans":[0],"ex":"一阶线性通解公式：`y = e^(−∫P dx)[∫Q·e^(∫P dx)dx + C]`。这里 P=1、Q=e^x，`∫Pdx = x`，故 `y = e^(−x)[∫e^x·e^x dx + C] = e^(−x)[e^(2x)/2 + C] = (1/2)e^x + Ce^(−x)`。"},
  {"id":"m-803","ch":"m-8","stem":"微分方程 `y″ − 3y′ + 2y = 0` 的通解是（　）。","opts":["y = C₁e^x + C₂e^(2x)","y = C₁e^(−x) + C₂e^(−2x)","y = (C₁ + C₂x)e^x","y = C₁cos x + C₂sin x"],"ans":[0],"ex":"特征方程 `r² − 3r + 2 = 0` → r = 1, 2（两相异实根），故通解 `y = C₁e^x + C₂e^(2x)`。"},
  {"id":"m-804","ch":"m-8","stem":"微分方程 `y″ + y = 0` 的通解是（　）。","opts":["y = C₁e^x + C₂e^(−x)","y = C₁cos x + C₂sin x","y = C₁ + C₂x","y = e^x(C₁cos x + C₂sin x)"],"ans":[1],"ex":"特征方程 `r² + 1 = 0` → r = ±i（一对共轭纯虚根），故通解 `y = C₁cos x + C₂sin x`。"},
  {"id":"m-805","ch":"m-8","stem":"微分方程 `y″ − 2y′ + y = 0` 的通解是（　）。","opts":["y = C₁e^x + C₂e^(−x)","y = (C₁ + C₂x)e^x","y = C₁e^x + C₂e^(2x)","y = C₁e^x + C₂"],"ans":[1],"ex":"特征方程 `r² − 2r + 1 = (r−1)² = 0` → **二重根** r = 1，故通解 `y = (C₁ + C₂x)e^x`。重根时要乘一个 x。"},
  {"id":"m-806","ch":"m-8","stem":"方程 `y″ = x` 满足 `y(0) = 0`、`y′(0) = 0` 的特解是（　）。","opts":["y = x³/6","y = x²/2","y = x³/3","y = x³/6 + x"],"ans":[0],"ex":"可降阶（缺 y）：两次积分 `y″ = x` → `y′ = x²/2 + C₁`；由 y′(0)=0 得 C₁=0 → `y = x³/6 + C₂`；由 y(0)=0 得 C₂=0，故 `y = x³/6`。"},
  {"id":"m-107","ch":"m-1","tag":"技巧","stem":"当 x→0 时，下列无穷小中**阶数最高**的是（　）。","opts":["1 − cos x","x − sin x","x²","x·ln(1 + x)"],"ans":[1],"ex":"逐个定阶：`1 − cos x ~ x²/2`（2 阶）、`x − sin x ~ x³/6`（**3 阶**）、`x²`（2 阶）、`x·ln(1+x) ~ x²`（2 阶）。阶数越高趋于 0 越快，故选 B。"},
  {"id":"m-108","ch":"m-1","stem":"函数 `f(x) = (x² − 1)/(x − 1)` 在 x = 1 处（　）。","opts":["连续","是第一类可去间断点","是第一类跳跃间断点","是第二类间断点"],"ans":[1],"ex":"`lim(x→1) (x²−1)/(x−1) = lim (x+1) = 2`，极限存在但函数在 x=1 无定义，故为**可去间断点**（第一类）。补充定义 f(1)=2 即可使其连续。"},
  {"id":"m-207","ch":"m-2","tag":"计算","stem":"设 `y = e^(2x)`，则其 n 阶导数 `y⁽ⁿ⁾ =`（　）。","opts":["2ⁿ·e^(2x)","e^(2x)","2·e^(2x)","n·2·e^(2x)"],"ans":[0],"ex":"每次求导都多乘一个 2：`y′ = 2e^(2x)`，`y″ = 4e^(2x)`……归纳得 `y⁽ⁿ⁾ = 2ⁿe^(2x)`。同理 `(e^(ax))⁽ⁿ⁾ = aⁿe^(ax)`。"},
  {"id":"m-208","ch":"m-2","stem":"`f(x) = ln(1 + x)` 在 x = 0 处的二阶泰勒多项式（带佩亚诺余项）是（　）。","opts":["x − x²/2","x + x²/2","1 + x","x − x²"],"ans":[0],"ex":"`ln(1+x) = x − x²/2 + x³/3 − …`，故二阶泰勒多项式为 `x − x²/2`。注意常数项为 0（因为 ln1=0）。"},
  {"id":"m-307","ch":"m-3","tag":"性质","stem":"设 f(x) 为奇函数且在 [−a, a] 上连续，则 `∫₋ₐᵃ f(x)dx =`（　）。","opts":["2∫₀ᵃ f(x)dx","0","2a","无法确定"],"ans":[1],"ex":"奇函数在对称区间上的积分为 **0**（正负部分抵消）。偶数倍的是偶函数：`∫₋ₐᵃ = 2∫₀ᵃ`。判断奇偶再看区间是否对称，是快速简化定积分的常用手段。"},
  {"id":"m-308","ch":"m-3","tag":"必背","stem":"反常积分 `∫₀¹ 1/x^p dx` 收敛的充要条件是（　）。","opts":["p > 1","p < 1","p ≥ 1","任意 p"],"ans":[1],"ex":"这是「瑕点在 0」的反常积分，结论与无穷区间**恰好相反**：`∫₀¹ 1/x^p dx` 当 **p < 1** 收敛。记法：`∫₁^∞` 要 p>1，`∫₀¹` 要 p<1。"},
  {"id":"m-405","ch":"m-4","stem":"过点 (1, 0, −1) 且方向向量为 (2, 1, 3) 的直线方程是（　）。","opts":["(x−1)/2 = y/1 = (z+1)/3","(x+1)/2 = y/1 = (z−1)/3","(x−1)/1 = y/2 = (z+1)/1","x/2 = y/1 = z/3"],"ans":[0],"ex":"点向式：`(x−x₀)/l = (y−y₀)/m = (z−z₀)/n`。代入点 (1,0,−1) 与方向 (2,1,3) 得 `(x−1)/2 = (y−0)/1 = (z+1)/3`，注意 z 坐标是 −1，所以是 z+1。"},
  {"id":"m-406","ch":"m-4","tag":"计算","stem":"曲面 `z = x² + y²` 在点 (1, 1, 2) 处的切平面方程是（　）。","opts":["2x + 2y − z = 2","2x + 2y + z = 2","x + y − z = 0","2x − 2y − z = 0"],"ans":[0],"ex":"令 `F = x² + y² − z`，梯度 `(2x, 2y, −1)`，在 (1,1,2) 处为 (2, 2, −1)。切平面：`2(x−1) + 2(y−1) − (z−2) = 0`，整理得 **2x + 2y − z = 2**。"},
  {"id":"m-507","ch":"m-5","stem":"交换积分次序：`∫₀¹ dx ∫₀^x f(x,y) dy` 等于（　）。","opts":["∫₀¹ dy ∫_y^1 f(x,y) dx","∫₀¹ dy ∫₀^y f(x,y) dx","∫₀¹ dy ∫₁^y f(x,y) dx","∫₀¹ dy ∫_x^1 f(x,y) dx"],"ans":[0],"ex":"原区域是 `0≤x≤1, 0≤y≤x`（对角线下方三角形）。改按 y 先走：`0≤y≤1`，对每个 y 有 `y≤x≤1`，故 `∫₀¹ dy ∫_y^1 f dx`。**先画区域图再换序**最稳。"},
  {"id":"m-606","ch":"m-6","stem":"第一类曲线积分 `∫_L ds` 的几何意义是（　）。","opts":["曲线 L 的弧长","曲线 L 与坐标轴围成的面积","曲线 L 的曲率","曲线 L 的弧长微分"],"ans":[0],"ex":"`ds` 是弧长微元，沿曲线积分一遍即得**总弧长**。若被积函数为面密度，则 `∫_L ρ ds` 表示曲线构件的质量（第一类曲线积分的物理意义）。"},
  {"id":"m-706","ch":"m-7","tag":"计算","stem":"在 |x| < 1 时，幂级数 `Σ(n=1→∞) n·x^(n−1)` 的和函数是（　）。","opts":["1/(1−x)","1/(1−x)²","1/(1+x)","x/(1−x)²"],"ans":[1],"ex":"由 `Σxⁿ = 1/(1−x)` 逐项求导：`Σ n·x^(n−1) = (1/(1−x))′ = 1/(1−x)²`。这是「先求和函数再逐项求导」的标准套路。"},
  {"id":"m-707","ch":"m-7","stem":"周期 2π 的函数 f(x) 的傅里叶级数中，常数项系数 a₀ =（　）。","opts":["(1/π)∫₋π^π f(x)dx","(1/2π)∫₋π^π f(x)dx","∫₋π^π f(x)dx","0"],"ans":[0],"ex":"标准形式 `f(x) ~ a₀/2 + Σ(aₙcos nx + bₙsin nx)`，其中 `a₀ = (1/π)∫₋π^π f(x)dx`（注意不同教材把常数项写成 a₀/2 或 a₀，**按题目给的定义式对齐**）。"},
  {"id":"m-807","ch":"m-8","stem":"求解方程 `y″ = f(y, y′)`（方程中不显含 x）时，通常令（　）来降阶。","opts":["y′ = p，且 y″ = p·dp/dy","y′ = p，且 y″ = dp/dx","y = p","直接两次积分"],"ans":[0],"ex":"缺 x 型：令 `p = y′`，把 y 视为自变量，则 `y″ = dp/dx = (dp/dy)(dy/dx) = p·dp/dy`，方程降为一阶。缺 y 型（`y″=f(x,y′)`）则令 `y′=p, y″=dp/dx`。"},
  {"id":"m-808","ch":"m-8","tag":"应用","stem":"一曲线过点 (0, 1)，且曲线上任一点处的切线斜率等于该点横坐标的 2 倍，则该曲线方程是（　）。","opts":["y = x² + 1","y = 2x + 1","y = x²","y = e^(2x)"],"ans":[0],"ex":"条件翻译成微分方程：`y′ = 2x`，积分得 `y = x² + C`；代入 y(0)=1 得 C=1，故 **y = x² + 1**。"}
];

window.DATA.k.math = [
  {"ch":"m-1","t":"等价无穷小（必背表）","tag":"必背","b":"x→0 时：\n- `sin x ~ tan x ~ arcsin x ~ arctan x ~ ln(1+x) ~ e^x − 1 ~ x`\n- `1 − cos x ~ x²/2`\n- `(1+x)^α − 1 ~ αx`\n- `x − sin x ~ x³/6`，`tan x − x ~ x³/3`\n- `x − ln(1+x) ~ x²/2`\n!! 只能在**乘除**中替换，加减中替换会丢阶（如 tan x − sin x 不能各自换掉）。"},
  {"ch":"m-1","t":"求极限的三条路","tag":"方法","b":"1. **等价无穷小替换**：乘除优先，最快\n2. **洛必达**：0/0 或 ∞/∞，注意求导后可能更复杂\n3. **泰勒展开**：出现加减抵消时最可靠（展开到同阶）\n!! 幂指函数 `u^v` 一律先化 `e^(v ln u)` 或取对数。"},
  {"ch":"m-1","t":"间断点分类","tag":"必背","b":"- **第一类**：左右极限都存在\n  - 相等 → 可去间断点\n  - 不等 → 跳跃间断点\n- **第二类**：左右极限至少一个不存在（无穷、振荡）\n!! 判之前先求左右极限，别急着下结论。"},
  {"ch":"m-2","t":"中值定理三件套","tag":"必背","b":"- **罗尔**：闭连续 + 开可导 + 端点相等 ⇒ ∃ξ, f′(ξ)=0\n- **拉格朗日**：闭连续 + 开可导 ⇒ ∃ξ, f(b)−f(a) = f′(ξ)(b−a)\n- **柯西**：两函数都满足条件 ⇒ `[f(b)−f(a)]/[g(b)−g(a)] = f′(ξ)/g′(ξ)`\n!! 证明题里常用「构造辅助函数」把结论化成罗尔定理的形式。"},
  {"ch":"m-2","t":"导数定义与配平","tag":"技巧","b":"`f′(x₀) = lim(h→0) [f(x₀+h) − f(x₀)]/h`\n题目给的增量不是 h 时，**先令 t = 该增量再乘系数**配平。\n例：`lim [f(x₀+2h) − f(x₀)]/h = 2f′(x₀)`。\n!! 出现 `f(x₀+h) − f(x₀−h)` 时要除以 2h 再乘 2。"},
  {"ch":"m-2","t":"极值与拐点判据","tag":"速记","b":"**极值**：f′(x₀)=0（驻点）后看 f″(x₀) 符号：<0 极大、>0 极小。\n**拐点**：f″ 变号的点（f″(x₀)=0 只是必要条件）。\n**单调**：f′ > 0 增；**凹凸**：f″ > 0 凹（开口向上）。\n!! 可导极值点必为驻点，但驻点不一定是极值点。"},
  {"ch":"m-3","t":"积分三大法宝","tag":"方法","b":"1. **换元**：凑微分（`∫f(φ(x))φ′(x)dx`），注意换元后**换上下限**\n2. **分部**：`∫u dv = uv − ∫v du`，口诀「反对幂三指」选 u 的顺序\n3. **对称性**：奇函数在对称区间积分为 0；偶函数翻倍\n!! 定积分换元后**千万别再代回原变量**，直接算新上下限。"},
  {"ch":"m-3","t":"变限积分求导","tag":"必背","b":"`F(x) = ∫_a^(φ(x)) f(t)dt ⇒ F′ = f(φ(x))·φ′(x)`\n上下限都是函数时：`d/dx ∫_(u(x))^(v(x)) f = f(v)v′ − f(u)u′`\n!! 被积函数含 x（如 `∫₀^x x·f(t)dt`）时，先把 x 提到积分号外再求导。"},
  {"ch":"m-3","t":"反常积分判敛","tag":"必背","b":"- `∫₁^∞ 1/x^p dx`：**p > 1 收敛**\n- `∫₀^1 1/x^p dx`：**p < 1 收敛**\n- `∫₂^∞ 1/(x ln^p x) dx`：p > 1 收敛\n!! 两个方向的 p 条件恰好相反，容易记混。"},
  {"ch":"m-4","t":"向量运算三公式","tag":"必背","b":"- 点积 `a·b = |a||b|cosθ = a₁b₁ + a₂b₂ + a₃b₃`\n- 叉积 `|a×b| = |a||b|sinθ`，方向右手定则；`a×b ⊥ a,b`\n- 混合积 `[abc] = (a×b)·c`，其绝对值 = 平行六面体体积\n!! `a×b = 0` ⟺ 两向量平行；`a·b = 0` ⟺ 垂直。"},
  {"ch":"m-4","t":"平面与直线方程","tag":"速记","b":"**平面**：点法式 `A(x−x₀)+B(y−y₀)+C(z−z₀)=0`，法向量 (A,B,C)。\n**直线**：点向式 `(x−x₀)/l = (y−y₀)/m = (z−z₀)/n`，方向向量 (l,m,n)。\n**关系**：直线方向向量 s 与平面法向量 n —— `s·n = 0` 平行/在面内，`s ∥ n` 垂直。\n!! 缺变量的方程是柱面：缺 z → 母线平行 z 轴。"},
  {"ch":"m-5","t":"偏导、可微、连续的关系","tag":"必背","b":"`偏导连续 ⇒ 可微 ⇒ (偏导存在 且 连续)`\n反过来都不成立。\n**全微分**：`dz = z_x dx + z_y dy`。\n!! 判断可微的标准方法：验证 `lim [Δz − z_xΔx − z_yΔy]/ρ = 0`（ρ=√(Δx²+Δy²)）。"},
  {"ch":"m-5","t":"复合与隐函数求导","tag":"方法","b":"**链式法则**：`z = f(u,v), u=u(x,y), v=v(x,y)` ⇒ `z_x = f_u·u_x + f_v·v_x`。\n**隐函数**：`F(x,y,z)=0` ⇒ `z_x = −F_x/F_z`，`z_y = −F_y/F_z`。\n!! 隐函数求导的负号最容易漏。"},
  {"ch":"m-5","t":"无条件极值判据","tag":"公式","b":"驻点处令 `A = z_xx`、`B = z_xy`、`C = z_yy`：\n- `AC − B² > 0` 且 A > 0 → **极小值**\n- `AC − B² > 0` 且 A < 0 → **极大值**\n- `AC − B² < 0` → 非极值（鞍点）\n- `AC − B² = 0` → 失效，需另判\n!! 条件极值用拉格朗日乘数法。"},
  {"ch":"m-6","t":"二重积分计算流程","tag":"方法","b":"1. 画区域图，判断 X 型还是 Y 型\n2. 能分离就先分离：`∫∫ f(x)g(y) = ∫f · ∫g`\n3. 圆形/扇形区域 → **极坐标**（`dσ = r dr dθ`）\n4. 利用对称性（关于坐标轴对称时看被积函数奇偶性）\n!! 极坐标**最常漏 r**；先画图再定上下限。"},
  {"ch":"m-6","t":"三大公式","tag":"必背","b":"- **格林公式**：平面闭曲线 ∮ → 二重积分（`∂Q/∂x − ∂P/∂y`）\n- **高斯公式**：闭合曲面积分 ∬ → 三重积分（散度 `∂P/∂x+∂Q/∂y+∂R/∂z`）\n- **斯托克斯公式**：空间闭曲线 ∮ → 曲面积分（旋度）\n!! 用之前确认：闭合、方向（外侧/正向）、偏导连续。"},
  {"ch":"m-6","t":"曲线积分与路径无关","tag":"速记","b":"单连通区域内：`∫P dx + Q dy` 路径无关 ⟺ `∂P/∂y = ∂Q/∂x`。\n此时存在势函数 u 使 `du = Pdx + Qdy`，积分值 = u(终点) − u(起点)。\n求 u 的方法：偏积分 `u = ∫P dx + φ(y)`，再用 u_y = Q 定 φ。\n!! 若区域非单连通（如挖掉原点），要额外看绕行积分是否为零。"},
  {"ch":"m-7","t":"正项级数判敛四法","tag":"方法","b":"1. **比较判别法**：与 p 级数、几何级数比\n2. **比值法（达朗贝尔）**：`lim a_(n+1)/a_n = ρ`，ρ<1 收敛、ρ>1 发散\n3. **根值法（柯西）**：`lim ⁿ√a_n = ρ`，同上\n4. **积分判别法**：单调递减非负时与反常积分同敛散\n!! ρ = 1 时全部失效，要换方法。"},
  {"ch":"m-7","t":"交错级数与条件收敛","tag":"必背","b":"**莱布尼茨判别法**：`a_n` 单调递减且 → 0 ⇒ `Σ(−1)^(n−1)a_n` 收敛。\n**绝对收敛** ⇒ 收敛；收敛但取绝对值后发散 → **条件收敛**。\n例：`Σ(−1)^n/n` 条件收敛；`Σ(−1)^n/n²` 绝对收敛。\n!! 判敛顺序：先看绝对收敛（更快），不行再用莱布尼茨。"},
  {"ch":"m-7","t":"幂级数必背展开","tag":"必背","b":"- `e^x = Σ xⁿ/n!`（R=∞）\n- `sin x = Σ(−1)ⁿx^(2n+1)/(2n+1)!`（R=∞）\n- `cos x = Σ(−1)ⁿx^(2n)/(2n)!`（R=∞）\n- `1/(1−x) = Σxⁿ`（R=1）\n- `ln(1+x) = Σ(−1)^(n−1)xⁿ/n`（R=1）\n!! 求和函数常用「逐项求导/积分」技巧。"},
  {"ch":"m-8","t":"一阶方程解法","tag":"方法","b":"- **可分离**：`dy/g(y) = f(x)dx`，两边积分\n- **一阶线性** `y′ + P(x)y = Q(x)`：通解 `y = e^(−∫Pdx)[∫Q e^(∫Pdx)dx + C]`\n- **齐次** `y′ = f(y/x)`：令 `u = y/x`\n- **伯努利** `y′ + Py = Qyⁿ`：令 `z = y^(1−n)`\n!! 先判断类型再套公式，别一上来就硬算。"},
  {"ch":"m-8","t":"二阶常系数齐次","tag":"必背","b":"特征方程 `r² + pr + q = 0`：\n- 两相异实根 r₁,r₂ → `y = C₁e^(r₁x) + C₂e^(r₂x)`\n- 二重根 r → `y = (C₁ + C₂x)e^(rx)`\n- 共轭复根 α±βi → `y = e^(αx)(C₁cos βx + C₂sin βx)`\n!! 重根要乘 x；复根要拆成 cos/sin。"},
  {"ch":"m-8","t":"非齐次特解设法","tag":"技巧","b":"右端 `f(x) = e^(λx)P_m(x)` 时，设特解 `y* = x^k e^(λx)Q_m(x)`，\n其中 k 为 λ 作为特征根的重数（0/1/2），`Q_m` 与 P_m 同次数。\n右端含 `sin/cos` 时先化成复指数或直接设 `e^(αx)(A cos βx + B sin βx)`。\n!! 通解 = 齐次通解 + 一个特解。"}
];

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function nl2br(s) { return esc(s).replace(/\n/g, '<br>'); }

/* 轻量标记：**粗体**  `代码`  __高亮__  !!提示  / - 列表 / | 表格 | / 空行分段 */
function rich(s, cls) {
  var lines = String(s == null ? '' : s).split('\n');
  var out = [], listOpen = false;
  function closeList() { if (listOpen) { out.push('</ul>'); listOpen = false; } }
  function inline(t) {
    t = esc(t);
    t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    t = t.replace(/__([^_]+)__/g, '<span class="hl">$1</span>');
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    return t;
  }
  /* 表格行：以 | 开头、且至少有两个 | */
  function isRow(t) { return t.charAt(0) === '|' && t.lastIndexOf('|') > 0; }
  /* 分隔行：|---|---| 或 | :--- | ---: | */
  function isSep(t) {
    return isRow(t) && t.replace(/[|\s:-]/g, '') === '' && t.indexOf('-') >= 0;
  }
  function cells(t) {
    return t.replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (x) { return x.trim(); });
  }
  function table(rows) {
    var head = null, body = rows;
    if (rows.length > 1 && isSep(rows[1])) { head = cells(rows[0]); body = rows.slice(2); }
    var h = '<div class="kp-table-wrap"><table class="kp-table">';
    if (head) {
      h += '<thead><tr>' + head.map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') + '</tr></thead>';
    }
    h += '<tbody>' + body.map(function (r) {
      return '<tr>' + cells(r).map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
    return h;
  }
  var i = 0;
  while (i < lines.length) {
    var t = lines[i].trim();
    if (!t) { closeList(); i++; continue; }
    if (t.indexOf('!!') === 0) {
      closeList(); out.push('<span class="tip">' + inline(t.slice(2).trim()) + '</span>'); i++; continue;
    }
    if (t.indexOf('- ') === 0) {
      if (!listOpen) { out.push('<ul>'); listOpen = true; }
      out.push('<li>' + inline(t.slice(2)) + '</li>'); i++; continue;
    }
    if (isRow(t)) {
      closeList();
      var rows = [];
      while (i < lines.length && isRow(lines[i].trim())) { rows.push(lines[i].trim()); i++; }
      out.push(table(rows));
      continue;
    }
    closeList();
    out.push(inline(t));
    i++;
  }
  closeList();
  return cls ? '<div class="' + cls + '">' + out.join('') + '</div>' : out.join('');
}

  var s = Math.max(0, Math.round(ms / 1000));

}

}
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

/* ---------------- 题目详解（从错题本跳转：本题 + 同类题 + 相关知识点） ---------------- */
var DQ = { picks: {}, locked: {} };
function miniQCard(x) {
  var badge = ST.wrong[x.id]
    ? '<span class="pill" style="background:var(--red-soft);color:var(--red);font-size:10px">错过</span>'
    : (ST.done && ST.done[x.id]
      ? '<span class="pill" style="background:var(--green-soft);color:var(--green);font-size:10px">做过</span>'
      : '<span class="pill" style="background:var(--line-2);color:var(--ink-3);font-size:10px">未做</span>');
  var t = plainText(x.stem);
  if (t.length > 56) t = t.slice(0, 56) + '…';
  return '<button class="row miniq" data-act="go" data-h="/q/' + x.id + '">' +
    '<span class="tx"><b>' + esc(t) + '</b></span>' +
    '<span class="rt">' + badge + ic('chev', 15) + '</span></button>';
}

function djudge(qid) {
  var q = QINDEX[qid];
  if (!q || DQ.locked[qid]) return;
  var picks = DQ.picks[qid] || [];
  if (!picks.length) { toast('先选一个答案'); return; }
  DQ.locked[qid] = true;
  var ok = sameSet(picks, q.ans || []);
  ST.done = ST.done || {};
  ST.done[q.id] = 1;
  recordAnswer(q, ok, picks);
  haptic(ok ? 6 : 16);
  render();
}

function renderQuestionDetail(qid) {
  var q = QINDEX[qid];
  if (!q) {
    return '<div class="page">' + navBar('题目详解') +
      '<div class="empty"><span class="em">' + ic('info', 30) + '</span><b>找不到这道题</b><span>它可能已被移出错题本。</span></div></div>';
  }
  var s = SUB[q.sid] || SUB.all;
  var picks = DQ.picks[qid] || [];
  var locked = !!DQ.locked[qid];
  var multi = (q.ans || []).length > 1;
  var w = ST.wrong[qid];

  var h = '<div class="page no-tab">' +
    navBar('题目详解', { sub: subjShort(q) + ' · ' + chName(q.sid, q.ch) });
  h += '<div class="q-tags">' +
    '<span class="pill" style="background:' + s.soft + ';color:' + s.color + '">' + esc(s.name) + '</span>' +
    '<span class="pill" style="background:var(--line-2);color:var(--ink-2)">' + (multi ? '多选题' : '单选题') + '</span>' +
    (q.tag ? '<span class="pill" style="background:var(--orange-soft);color:#B45309">' + esc(q.tag) + '</span>' : '') +
    (w ? '<span class="pill" style="background:var(--red-soft);color:var(--red)">错 ' + w.c + ' 次</span>' : '') +
    '</div>';
  h += '<div class="q-stem">' + rich(q.stem) + '</div>';

  h += '<div class="opts">' + (q.opts || []).map(function (op, k) {
    var cls = 'opt';
    if (locked) {
      if ((q.ans || []).indexOf(k) >= 0) cls += ' ok';
      else if (picks.indexOf(k) >= 0) cls += ' bad';
    } else if (picks.indexOf(k) >= 0) cls += ' sel';
    return '<button class="' + cls + '" data-act="dpick" data-k="' + k + '" data-qid="' + qid + '"' +
      (locked ? ' disabled' : '') + '>' +
      '<span class="k">' + 'ABCDEFGH'[k] + '</span><span class="v">' + rich(op) + '</span></button>';
  }).join('') + '</div>';

  if (!locked) {
    h += '<div class="actbar" style="position:static;background:none;padding:14px 0 0;margin:0">' +
      '<button class="btn primary" data-act="dsubmit" data-qid="' + qid + '"' + (picks.length ? '' : ' disabled') + '>' +
      (multi ? '提交答案' : '确认选择') + '</button></div>';
  } else {
    var ok = sameSet(picks, q.ans || []);
    h += '<div class="verdict ' + (ok ? 'ok' : 'bad') + '">' + ic(ok ? 'check' : 'x', 17) +
      (ok ? '回答正确' : '回答错误，正确答案 ' + letters(q.ans)) + '</div>';
    if (q.ex) {
      h += '<div class="explain"><div class="explain-h">' + ic('zap', 16) + '解析</div>' +
        '<div class="explain-b">' + rich(q.ex) + '</div></div>';
    }
    h += '<div class="actbar" style="position:static;background:none;padding:14px 0 0;margin:0">' +
      '<button class="btn ghost" data-act="dreset" data-qid="' + qid + '">' + ic('refresh', 16) + '再做一次</button>' +
      (w ? '<button class="btn ghost" data-act="rmwrong" data-id="' + qid + '">' + ic('check', 16) + '已掌握</button>' : '') +
      '</div>';
  }

  var same = qOf(q.sid).filter(function (x) { return x.ch === q.ch && x.id !== q.id; }).slice(0, 6);
  if (same.length) {
    h += '<div class="sec-title">同类题 <span class="sub">' + esc(chName(q.sid, q.ch)) + ' · ' + same.length + ' 道</span></div>';
    h += '<div class="card">' + same.map(miniQCard).join('') + '</div>';
  }

  var cards = cardsOf(q.sid).filter(function (c) { return c.ch === q.ch; });
  if (cards.length) {
    h += '<div class="sec-title">相关知识点 <span class="sub">' + cards.length + ' 张卡片</span></div>';
    h += cards.map(function (c) { return kpCard(c, s); }).join('');
  }
  h += '<div style="height:16px"></div></div>';
  return h;
}

  var h = '<div class="page">' + navBar('我的收藏', { sub: ids.length + ' 张卡片' });
  if (!ids.length) {
    h += '<div class="empty"><span class="em">' + ic('star', 30) + '</span><b>还没有收藏</b><span>在速背卡片右上角点一下星星，就能把重点收进来。</span></div>';
  } else {
    var all = [];
    (D.subjectOrder || []).forEach(function (sid) {
      cardsOf(sid).forEach(function (c) { if (ST.fav[c.id]) all.push({ c: c, s: SUB[sid] }); });
    });
    h += all.map(function (x) { return kpCard(x.c, x.s); }).join('');
  }
  h += '<div style="height:12px"></div></div>';
  return h;
}

/* ---------------- 我的 ---------------- */
function renderMe() {
  var total = ST.stats.total, right = ST.stats.right;
  var acc = total ? Math.round(right / total * 100) : 0;
  var days = Object.keys(ST.stats.days || {}).length;
  var h = '<div class="page">' + navBar('我的', { sub: '学习数据与设置' });
  h += '<div class="me-head"><div class="avatar">' + ic('user', 26) + '</div>' +
    '<div><b>研途 408</b><span>' + (total ? '累计练习 ' + total + ' 题' : '还没有开始，先刷一组') + '</span></div></div>';
  h += '<div class="stat-grid" style="margin-bottom:10px">' +
    '<div class="stat"><span class="lb">' + ic('edit', 13) + '累计答题</span><b>' + total + '<i>题</i></b></div>' +
    '<div class="stat"><span class="lb">' + ic('target', 13) + '平均正确率</span><b>' + acc + '<i>%</i></b></div>' +
    '<div class="stat"><span class="lb">' + ic('x', 13) + '错题待巩固</span><b>' + Object.keys(ST.wrong).length + '<i>题</i></b></div>' +
    '<div class="stat"><span class="lb">' + ic('clock', 13) + '有记录天数</span><b>' + days + '<i>天</i></b></div>' +
    '</div>';

  h += '<div class="sec-title">各科进度</div><div class="card" style="padding:14px">';
  h += (D.subjectOrder || []).map(function (sid) {
    var s = SUB[sid], qs = qOf(sid);
    var done = qs.filter(function (q) { return ST.done && ST.done[q.id]; }).length;
    var p = qs.length ? Math.round(done / qs.length * 100) : 0;
    return '<div style="margin-bottom:12px"><div style="display:flex;font-size:12.5px;margin-bottom:5px">' +
      '<span style="flex:1;font-weight:560">' + esc(s.name) + '</span>' +
      '<span style="color:var(--ink-3);font-variant-numeric:tabular-nums">' + done + '/' + qs.length + '</span></div>' +
      '<div class="bar"><i style="width:' + p + '%;background:' + s.color + '"></i></div></div>';
  }).join('');
  h += '</div>';

  h += '<div class="sec-title">设置</div><div class="card">' +
    '<button class="row" data-act="theme"><span class="em" style="background:var(--line-2);color:var(--ink-2)">' + ic(isDark() ? 'moon' : 'sun', 18) + '</span>' +
    '<span class="tx"><b>外观主题</b><span>' + (ST.theme === 'dark' ? '深色' : ST.theme === 'light' ? '浅色' : '跟随系统') + '</span></span>' +
    '<span class="rt">' + ic('chev', 16) + '</span></button>' +
    '<button class="row" data-act="go" data-h="/wrong"><span class="em" style="background:var(--red-soft);color:var(--red)">' + ic('x', 18) + '</span>' +
    '<span class="tx"><b>错题本</b><span>' + Object.keys(ST.wrong).length + ' 道</span></span><span class="rt">' + ic('chev', 16) + '</span></button>' +
    '<button class="row" data-act="go" data-h="/fav"><span class="em" style="background:#FFF7E6;color:#FFB020">' + ic('star', 18) + '</span>' +
    '<span class="tx"><b>我的收藏</b><span>' + Object.keys(ST.fav).length + ' 张卡片</span></span><span class="rt">' + ic('chev', 16) + '</span></button>' +
    '</div>';

  h += '<div class="sec-title">关于</div><div class="card" style="padding:14px">' +
    '<div style="font-size:12.5px;line-height:1.85;color:var(--ink-2)">' +
    '<b style="color:var(--ink)">研途 408 · v' + esc(APP_VER) + '</b><br>' +
    '题库按 408 统考真题与数学一历年真题的考点与难度整理，覆盖数据结构、计算机组成原理、操作系统、计算机网络与高等数学（一）。<br>' +
    '所有内容与答题记录都存在本机，不联网、不上传。</div>' +
    '<button class="btn ghost" style="margin-top:14px;width:100%" data-act="cleardata">' + ic('trash', 16) + '清除全部学习记录</button>' +
    '</div>';
  h += '<div style="height:12px"></div></div>';
  h += tabBar('me');
  return h;
}

/* ---------------- 渲染后处理 ---------------- */
var clockTimer = null;
function afterRender(r) {
  if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
  if (r.page === 'quiz' && QZ) {
    clockTimer = setInterval(function () {
      var el = document.getElementById('qclock');
      if (el) el.textContent = fmtTime(Date.now() - QZ.t0);
    }, 1000);
  }
  var kw = document.getElementById('kw');
  if (kw) {
    kw.addEventListener('input', function () {
      SEARCH.kw = this.value.trim();
      var box = document.getElementById('kplist');
      if (box) box.innerHTML = kpListInner(SUB[SEARCH.sid] || SUB.all);
      var sub = document.querySelector('.nav-title small');
      if (sub) sub.textContent = (SUB[SEARCH.sid] ? SUB[SEARCH.sid].name : '') + ' · ' + filterCards().length + ' 张';
    });
  }
}

/* ---------------- 事件 ---------------- */
function findAct(el) {
  while (el && el !== document.body) {
    if (el.getAttribute && el.getAttribute('data-act')) return el;
    el = el.parentElement;
  }
  return null;
}
function actHandlers(el) {
  var act = el.getAttribute('data-act');
  var ds = el.dataset || {};
  switch (act) {
    case 'go': SEARCH.kw = ''; go(ds.h); return;
    case 'back': back(); return;
    case 'theme': {
      var order = [null, 'light', 'dark'];
      var i = order.indexOf(ST.theme);
      ST.theme = order[(i + 1) % 3];
      saveST(); applyTheme(); toast(ST.theme === 'dark' ? '深色模式' : ST.theme === 'light' ? '浅色模式' : '跟随系统'); render(); return;
    }
    case 'start': startQuiz(ds.sid, ds.ch); return;
    case 'pick': {
      if (!QZ) return;
      var q = QZ.list[QZ.idx];
      if (QZ.locked[q.id]) return;
      var k = +ds.k, multi = (q.ans || []).length > 1;
      var pk = QZ.picks[q.id] || [];
      if (multi) {
        var pos = pk.indexOf(k);
        if (pos >= 0) pk.splice(pos, 1); else pk.push(k);
        QZ.picks[q.id] = pk.sort();
        render();
      } else {
        QZ.picks[q.id] = [k];
        judge();
      }
      return;
    }
    case 'submit': judge(); return;
    case 'next': {
      if (QZ.idx >= QZ.list.length - 1) { finishQuiz(); return; }
      QZ.idx++; render(); return;
    }
    case 'prev': { if (QZ.idx > 0) QZ.idx--; render(); return; }
    case 'jump': {
      closeSheet();
      var ii = +ds.i;
      if (QZ && ii >= 0 && ii < QZ.list.length) { QZ.idx = ii; render(); }
      return;
    }
    case 'finish': closeSheet(); if (QZ) finishQuiz(); return;
    case 'card': openSheet(renderSheetCard()); return;
    case 'closesheet': closeSheet(); return;
    case 'redo': {
      if (!RESULT || !RESULT.wrong.length) return;
      QZ = { sid: RESULT.sid, ch: 'redo', list: RESULT.wrong.slice(), idx: 0, picks: {}, locked: {}, t0: Date.now(), topic: '错题重练' };
      go('/quiz/' + RESULT.sid); return;
    }
    case 'again': { if (RESULT) { startQuiz(RESULT.sid, 'all'); } return; }
    case 'fav': {
      var id = ds.id;
      if (ST.fav[id]) delete ST.fav[id]; else ST.fav[id] = Date.now();
      saveST(); haptic(6);
      toast(ST.fav[id] ? '已收藏' : '已取消收藏');
      // 只更新图标，避免整页重绘导致滚动跳动
      var on = !!ST.fav[id];
      el.classList.toggle('on', on);
      return;
    }
    case 'flip': startFlip(); return;
    case 'fnext': {
      if (!FLIP) return;
      if (FLIP.i >= FLIP.list.length - 1) { FLIP.list = shuffle(FLIP.list); FLIP.i = 0; toast('重新打乱'); }
      else FLIP.i++;
      render(); return;
    }
    case 'fprev': { if (FLIP && FLIP.i > 0) { FLIP.i--; render(); } return; }
    case 'shuffle': { if (FLIP) { FLIP.list = shuffle(FLIP.list); FLIP.i = 0; render(); } return; }
    case 'dpick': {
      var dqq = QINDEX[ds.qid];
      if (!dqq || DQ.locked[ds.qid]) return;
      var dk = +ds.k, dmulti = (dqq.ans || []).length > 1;
      var dp = DQ.picks[ds.qid] || [];
      if (dmulti) {
        var dpos = dp.indexOf(dk);
        if (dpos >= 0) dp.splice(dpos, 1); else dp.push(dk);
        DQ.picks[ds.qid] = dp.sort();
        render();
      } else {
        DQ.picks[ds.qid] = [dk];
        djudge(ds.qid);
      }
      return;
    }
    case 'dsubmit': djudge(ds.qid); return;
    case 'dreset': { DQ.picks[ds.qid] = []; DQ.locked[ds.qid] = false; render(); return; }
    case 'rmwrong': { delete ST.wrong[ds.id]; saveST(); render(); return; }
    case 'clearwrong': {
      if (Object.keys(ST.wrong).length && confirm('清空全部错题记录？')) { ST.wrong = {}; saveST(); render(); }
      return;
    }
    case 'cleardata': {
      if (confirm('清除全部学习记录（答题、错题、收藏）？此操作不可撤销。')) {
        localStorage.removeItem(KEY); ST = loadST(); saveST(); toast('已清除'); render();
      }
      return;
    }
  }
}

function judge() {
  if (!QZ) return;
  var q = QZ.list[QZ.idx];
  if (QZ.locked[q.id]) return;
  var picks = QZ.picks[q.id] || [];
  if (!picks.length) { toast('先选一个答案'); return; }
  QZ.locked[q.id] = true;
  var ok = sameSet(picks, q.ans || []);
  ST.done = ST.done || {};
  ST.done[q.id] = 1;
  recordAnswer(q, ok, picks);
  haptic(ok ? 6 : 16);
  render();
}

/* ---------------- 主题 ---------------- */
function sysDark() {
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function isDark() {
  if (ST.theme === 'dark') return true;
  if (ST.theme === 'light') return false;
  return sysDark();
}
function applyTheme() {
  var t = ST.theme || (sysDark() ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', t);
}
function watchSystemTheme() {
  if (!window.matchMedia) return;
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  var onChange = function () { if (!ST.theme) { applyTheme(); render(); } };
  if (mq.addEventListener) mq.addEventListener('change', onChange);
  else if (mq.addListener) mq.addListener(onChange);
}

/* ---------------- 启动 ---------------- */
function init() {
  buildIndex();
  // 补全卡片 id
  Object.keys(CLIST).forEach(function (sid) {
    CLIST[sid].forEach(function (c, i) {
      if (!c.id) c.id = sid + '-' + (i + 1);
      if (!c.sid) c.sid = sid;
    });
  });
  applyTheme();
  watchSystemTheme();
  // 支持从 hash 直接进入
  var h = (location.hash || '').replace(/^#/, '');
  if (h && h.length > 1) {
    STACK = [h.startsWith('/') ? h : '/' + h];
    try { history.replaceState(null, '', '#' + STACK[0]); } catch (e) {}
  }
  document.addEventListener('click', function (e) {
    var el = findAct(e.target);
    if (!el) {
      if (e.target && e.target.id === 'sheet') closeSheet();
      return;
    }
    actHandlers(el);
  });
  // 安卓物理返回键（WebView 通过 JS 调用）
  render();
}

window.__nav = function (h) { go(h); };
window.__startQuiz = function (sid, ch) { startQuiz(sid, ch || 'all'); };

init();
})();


</script>
