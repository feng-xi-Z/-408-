<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2B6DE5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>研途 408 · 刷题速背</title>
<style>
:root{
  --brand:#2B6DE5; --brand-2:#5B8DF7; --brand-soft:#EAF1FE; --brand-ink:#1B4FB0;
  --orange:#FF7A45; --orange-soft:#FFF1EA;
  --green:#0FAF83; --green-soft:#E6F7F1;
  --red:#F0463C; --red-soft:#FDEDEC;
  --purple:#7C5CE0; --purple-soft:#F0ECFD;
  --teal:#0E9AA7; --teal-soft:#E3F6F8;
  --ink:#14161B; --ink-2:#5B616B; --ink-3:#9BA1AA; --ink-4:#C3C8CF;
  --line:#ECEEF2; --line-2:#F4F5F7;
  --bg:#F4F5F7; --card:#FFFFFF; --card-2:#FAFBFC;
  --radius:14px; --radius-sm:10px; --radius-lg:20px;
  --shadow:0 1px 2px rgba(20,22,27,.04), 0 4px 16px rgba(20,22,27,.05);
  --shadow-up:0 -2px 14px rgba(20,22,27,.07);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --h-nav:48px;
}
[data-theme="dark"]{
  --brand:#5B8DF7; --brand-2:#7DA6FF; --brand-soft:#182236; --brand-ink:#A8C4FF;
  --orange:#FF9166; --orange-soft:#2E221C;
  --green:#2BC79A; --green-soft:#142A24;
  --red:#FF6B60; --red-soft:#2E1D1C;
  --purple:#A18CF5; --purple-soft:#221D33;
  --teal:#3FBFCB; --teal-soft:#152A2D;
  --ink:#EDEFF3; --ink-2:#A8AFBA; --ink-3:#6F7783; --ink-4:#4A515B;
  --line:#262A31; --line-2:#1E2228;
  --bg:#101215; --card:#191C21; --card-2:#1F2329;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
  --shadow-up:0 -2px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  font-size:15px; line-height:1.55;
}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative;}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
input,textarea{font-family:inherit;font-size:inherit;color:inherit;}
svg{display:block;}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;}

/* ============ 顶栏 ============ */
.nav{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:6px;
  height:calc(var(--h-nav) + var(--safe-t)); padding:var(--safe-t) 8px 0;
  background:var(--card);
  background:color-mix(in srgb, var(--card) 86%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid transparent; transition:border-color .2s;
}
.nav.solid{border-bottom-color:var(--line);}
.nav-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink);}
.nav-btn:active{background:var(--line-2);}
.nav-title{flex:1;min-width:0;font-size:16.5px;font-weight:650;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-title small{display:block;font-size:11px;font-weight:500;color:var(--ink-3);letter-spacing:0;margin-top:-2px;}
.nav-right{display:flex;gap:2px;align-items:center;}

/* ============ 页面容器 ============ */
.page{flex:1;padding:12px 14px calc(84px + var(--safe-b));animation:pageIn .22s ease both;}
.page.no-tab{padding-bottom:calc(24px + var(--safe-b));}
@keyframes pageIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ============ 通用卡片 ============ */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.sec-title{display:flex;align-items:baseline;gap:8px;margin:18px 2px 10px;font-size:14.5px;font-weight:650;}
.sec-title .sub{font-size:11.5px;font-weight:500;color:var(--ink-3);}
.sec-title .more{margin-left:auto;font-size:12px;font-weight:500;color:var(--ink-3);}
.muted{color:var(--ink-3);}
.divider{height:1px;background:var(--line-2);margin:0;}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;line-height:1.6;}

/* ============ 首页 Hero ============ */
.hero{position:relative;border-radius:var(--radius-lg);padding:18px 18px 16px;color:#fff;overflow:hidden;
  background:linear-gradient(135deg,#3B7BF0 0%,#2B6DE5 46%,#1E56C4 100%);
  box-shadow:0 8px 24px rgba(43,109,229,.28);}
.hero::after{content:"";position:absolute;right:-46px;top:-64px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.30), rgba(255,255,255,0) 66%);}
.hero::before{content:"";position:absolute;right:24px;bottom:-70px;width:150px;height:150px;border-radius:50%;
  border:26px solid rgba(255,255,255,.09);}
.hero-top{display:flex;align-items:center;gap:8px;font-size:12.5px;opacity:.92;position:relative;}
.hero-title{font-size:21px;font-weight:700;letter-spacing:.3px;margin:8px 0 3px;position:relative;}
.hero-desc{font-size:12.5px;opacity:.88;position:relative;}
.hero-stats{display:flex;gap:0;margin-top:16px;position:relative;
  background:rgba(255,255,255,.14);border-radius:12px;backdrop-filter:blur(4px);}
.hero-stats div{flex:1;text-align:center;padding:9px 4px;position:relative;}
.hero-stats div + div::before{content:"";position:absolute;left:0;top:22%;height:56%;width:1px;background:rgba(255,255,255,.22);}
.hero-stats b{display:block;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3;}
.hero-stats span{font-size:10.5px;opacity:.85;}

/* ============ 双入口 ============ */
.entries{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px;}
.entry{position:relative;display:block;text-align:left;padding:15px 14px 14px;border-radius:var(--radius);
  background:var(--card);box-shadow:var(--shadow);overflow:hidden;border:1px solid transparent;transition:transform .12s;}
.entry:active{transform:scale(.975);}
.entry .em{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin-bottom:10px;}
.entry h3{margin:0;font-size:15.5px;font-weight:650;letter-spacing:.2px;}
.entry p{margin:3px 0 0;font-size:11.5px;color:var(--ink-3);line-height:1.45;}
.entry .badge{position:absolute;right:12px;top:12px;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:8px;}
.entry::after{content:"";position:absolute;right:-28px;bottom:-34px;width:92px;height:92px;border-radius:50%;
  background:currentColor;opacity:.05;}

/* ============ 科目网格 ============ */
.grid-sub{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.subj{display:flex;align-items:center;gap:11px;padding:12px;border-radius:var(--radius);
  background:var(--card);box-shadow:var(--shadow);text-align:left;transition:transform .12s;}
.subj:active{transform:scale(.975);}
.subj .em{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;}
.subj .tx{min-width:0;flex:1;}
.subj .tx b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.subj .tx span{display:block;font-size:11px;color:var(--ink-3);margin-top:1px;}
.subj.wide{grid-column:1/-1;}
.subj.wide .tx b{font-size:14.5px;}

/* ============ 列表行 ============ */
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);text-align:left;width:100%;}
.row + .row{border-top:1px solid var(--line-2);}
.row:active{background:var(--card-2);}
.row .em{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;}
.row .tx{flex:1;min-width:0;}
.row .tx b{display:block;font-size:14px;font-weight:560;}
.row .tx span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.4;}
.row .rt{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px;flex:none;}
.chev{width:16px;height:16px;stroke:var(--ink-4);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;}

/* ============ 进度条 ============ */
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .4s cubic-bezier(.2,.7,.3,1);}

/* ============ 章节行（练习详情） ============ */
.ch-row{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);width:100%;text-align:left;}
.ch-row + .ch-row{border-top:1px solid var(--line-2);}
.ch-row:active{background:var(--card-2);}
.ch-row .num{width:26px;height:26px;border-radius:8px;background:var(--line-2);color:var(--ink-2);
  display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none;font-variant-numeric:tabular-nums;}
.ch-row .tx{flex:1;min-width:0;}
.ch-row .tx b{display:block;font-size:14px;font-weight:560;}
.ch-row .meta{display:flex;align-items:center;gap:8px;margin-top:6px;}
.ch-row .meta .bar{flex:1;height:4px;}
.ch-row .meta span{font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none;}

/* ============ 答题页 ============ */
.quiz-head{padding:4px 2px 12px;}
.quiz-prog{display:flex;align-items:center;gap:10px;}
.quiz-prog .cnt{font-size:13px;font-weight:650;font-variant-numeric:tabular-nums;flex:none;}
.quiz-prog .cnt em{font-style:normal;color:var(--brand);}
.quiz-prog .bar{flex:1;}
.quiz-prog .tm{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none;}
.q-tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 8px;}
.q-stem{font-size:16px;line-height:1.7;font-weight:500;letter-spacing:.2px;margin:6px 0 4px;
  word-break:break-word;}
.q-stem .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;
  background:var(--line-2);padding:1px 5px;border-radius:5px;}
.opts{margin-top:14px;display:flex;flex-direction:column;gap:9px;}
.opt{display:flex;gap:11px;align-items:flex-start;padding:12px 13px;border-radius:12px;background:var(--card);
  border:1.5px solid var(--line);text-align:left;transition:border-color .15s,background .15s;width:100%;}
.opt:active{background:var(--card-2);}
.opt .k{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink-4);color:var(--ink-2);
  display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;margin-top:1px;transition:all .15s;}
.opt .v{flex:1;font-size:14.5px;line-height:1.6;padding-top:1px;}
.opt.sel{border-color:var(--brand);background:var(--brand-soft);}
.opt.sel .k{background:var(--brand);border-color:var(--brand);color:#fff;}
.opt.ok{border-color:var(--green);background:var(--green-soft);}
.opt.ok .k{background:var(--green);border-color:var(--green);color:#fff;}
.opt.bad{border-color:var(--red);background:var(--red-soft);}
.opt.bad .k{background:var(--red);border-color:var(--red);color:#fff;}
.opt:disabled{opacity:1;}

.explain{margin-top:16px;border-radius:13px;border:1px solid var(--line);background:var(--card);overflow:hidden;
  animation:pageIn .26s ease both;}
.explain-h{display:flex;align-items:center;gap:7px;padding:11px 14px;font-size:13px;font-weight:650;
  background:var(--card-2);border-bottom:1px solid var(--line);}
.explain-b{padding:13px 14px;font-size:13.5px;line-height:1.75;color:var(--ink-2);word-break:break-word;}
.explain-b b{color:var(--ink);font-weight:650;}

.verdict{display:flex;align-items:center;gap:8px;padding:11px 13px;border-radius:12px;font-size:13.5px;font-weight:600;margin-top:14px;}
.verdict.ok{background:var(--green-soft);color:var(--green);}
.verdict.bad{background:var(--red-soft);color:var(--red);}

/* 底部操作条 */
.actbar{position:sticky;bottom:0;z-index:40;margin-top:18px;padding:10px 0 calc(10px + var(--safe-b));
  display:flex;gap:10px;background:linear-gradient(to top,var(--bg) 62%,transparent);}
.btn{flex:1;height:46px;border-radius:13px;font-size:15px;font-weight:620;display:flex;align-items:center;
  justify-content:center;gap:6px;transition:transform .12s,opacity .15s;}
.btn:active{transform:scale(.98);}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(43,109,229,.28);}
.btn.ghost{background:var(--card);color:var(--ink-2);box-shadow:var(--shadow);flex:0 0 auto;padding:0 18px;}
.btn.done{background:var(--green);color:#fff;}
.btn:disabled{opacity:.42;box-shadow:none;}

/* ============ 结果页 ============ */
.result-hero{border-radius:var(--radius-lg);padding:22px 18px;text-align:center;color:#fff;
  background:linear-gradient(135deg,#12B886,#0FAF83);box-shadow:0 8px 24px rgba(15,175,131,.26);}
.result-hero.low{background:linear-gradient(135deg,#FF8A5B,#F0463C);box-shadow:0 8px 24px rgba(240,70,60,.24);}
.result-hero.mid{background:linear-gradient(135deg,#5B8DF7,#2B6DE5);box-shadow:0 8px 24px rgba(43,109,229,.24);}
.ring{width:120px;height:120px;margin:2px auto 10px;position:relative;}
.ring svg{transform:rotate(-90deg);width:120px;height:120px;}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring .val b{font-size:29px;font-weight:750;line-height:1;font-variant-numeric:tabular-nums;}
.ring .val span{font-size:10.5px;opacity:.85;margin-top:3px;}
.res-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:var(--radius);overflow:hidden;margin-top:14px;}
.res-stats div{background:var(--card);padding:13px 6px;text-align:center;}
.res-stats b{display:block;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;}
.res-stats span{font-size:11px;color:var(--ink-3);}

/* 错题回顾卡 */
.qcard{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);}
.qcard .h{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:11.5px;color:var(--ink-3);}
.qcard .h .idx{width:22px;height:22px;border-radius:7px;background:var(--line-2);display:grid;place-items:center;
  font-weight:700;font-size:11px;color:var(--ink-2);}
.qcard .s{font-size:14px;line-height:1.65;margin-bottom:9px;}
.qcard .ans{font-size:12.5px;line-height:1.7;color:var(--ink-2);background:var(--card-2);border-radius:10px;padding:9px 11px;}
.qcard .ans i{font-style:normal;font-weight:650;}

/* ============ 速背卡片 ============ */
.kp-toolbar{display:flex;gap:8px;margin-bottom:12px;}
.search{flex:1;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;
  background:var(--card);box-shadow:var(--shadow);color:var(--ink-3);}
.search input{flex:1;border:0;background:none;outline:none;font-size:14px;color:var(--ink);min-width:0;}
.search input::placeholder{color:var(--ink-4);}

.kp{background:var(--card);border-radius:var(--radius);margin-bottom:11px;box-shadow:var(--shadow);
  overflow:hidden;border-left:3px solid var(--brand);}
.kp-h{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;}
.kp-h h3{margin:0;font-size:14.5px;font-weight:650;flex:1;letter-spacing:.2px;}
.kp-h .star{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--ink-4);}
.kp-h .star.on{color:#FFB020;background:#FFF7E6;}
.kp-b{padding:0 14px 14px;font-size:13.5px;line-height:1.8;color:var(--ink-2);}
.kp-b b{color:var(--ink);font-weight:650;}
.kp-b .hl{color:var(--brand-ink);font-weight:600;}
.kp-b ul{margin:6px 0;padding-left:18px;}
.kp-b li{margin:4px 0;}
.kp-b code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--line-2);
  padding:1px 5px;border-radius:5px;color:var(--ink);}
.kp-b .tip{display:block;margin-top:8px;padding:8px 11px;border-radius:10px;background:var(--orange-soft);
  color:#B45309;font-size:12.5px;line-height:1.65;}
[data-theme="dark"] .kp-b .tip{color:#FFB27A;}

/* 翻卡模式 */
.flipwrap{padding:6px 0 0;display:flex;flex-direction:column;align-items:center;}
.flipcard{width:100%;min-height:260px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);
  padding:20px;display:flex;flex-direction:column;position:relative;}
.flipcard .tagm{font-size:11px;font-weight:650;padding:2px 9px;border-radius:99px;
  background:var(--brand-soft);color:var(--brand-ink);align-self:flex-start;margin-bottom:12px;}
.flipcard h2{font-size:18px;margin:0 0 14px;font-weight:700;letter-spacing:.2px;}
.flipcard .body{font-size:14.5px;line-height:1.85;color:var(--ink-2);flex:1;}
.flipcard .body b{color:var(--ink);}
.flipcard .body .hl{color:var(--brand-ink);font-weight:600;}
.flipcard .body .tip{display:block;margin-top:10px;padding:9px 11px;border-radius:10px;background:var(--orange-soft);color:#B45309;font-size:13px;}
.flipnav{display:flex;gap:10px;width:100%;margin-top:16px;}
.flipnav .btn{height:48px;}
.tapany{position:absolute;inset:0;border-radius:20px;}

/* ============ 底部导航 ============ */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
  padding-bottom:var(--safe-b);background:var(--card);
  background:color-mix(in srgb,var(--card) 92%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line);}
.tabbar .in{display:flex;width:100%;max-width:560px;margin:0 auto;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 8px;
  color:var(--ink-3);font-size:10.5px;font-weight:560;transition:color .15s;}
.tab.on{color:var(--brand);}
.tab .ic{width:22px;height:22px;stroke-width:1.7;}

/* ============ 空状态 ============ */
.empty{padding:52px 24px;text-align:center;color:var(--ink-3);}
.empty .em{width:64px;height:64px;border-radius:22px;background:var(--line-2);display:grid;place-items:center;
  margin:0 auto 14px;color:var(--ink-4);}
.empty b{display:block;font-size:14.5px;color:var(--ink-2);font-weight:600;margin-bottom:5px;}
.empty span{font-size:12.5px;line-height:1.6;}

/* ============ toast ============ */
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);z-index:200;
  background:rgba(20,22,27,.9);color:#fff;padding:9px 16px;border-radius:11px;font-size:13px;
  opacity:0;pointer-events:none;transition:all .22s;max-width:78%;text-align:center;line-height:1.5;}
.toast.on{opacity:1;transform:translate(-50%,0);}

/* ============ 统计小卡 ============ */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.stat{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);}
.stat .lb{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:5px;}
.stat b{display:block;font-size:24px;font-weight:730;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.5px;}
.stat b i{font-style:normal;font-size:13px;font-weight:600;color:var(--ink-3);margin-left:2px;}

/* 分段控件 */
.seg{display:flex;background:var(--line-2);border-radius:11px;padding:3px;gap:3px;}
.seg button{flex:1;height:32px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink-3);transition:all .15s;}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);}

/* ============ 底部抽屉 ============ */
.sheet-mask{position:fixed;inset:0;z-index:300;background:rgba(10,12,16,.42);opacity:0;
  transition:opacity .2s;display:flex;align-items:flex-end;justify-content:center;}
.sheet-mask.on{opacity:1;}
.sheet{width:100%;max-width:560px;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(16px + var(--safe-b));

.sheet-mask.on .sheet{transform:none;opacity:1;}

/* 答题卡网格 */
.jumpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px;margin:14px 0 4px;

.jg{height:42px;border-radius:11px;background:var(--line-2);color:var(--ink-2);font-size:13.5px;

.jg.has{background:var(--brand-soft);color:var(--brand-ink);}
.jg.ok{background:var(--green);color:#fff;}
.jg.bad{background:var(--red);color:#fff;}
.jg.cur{box-shadow:0 0 0 2.5px var(--ink);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);padding:8px 2px 0;}
.legend .dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle;}

/* ============ 速背小卡头 ============ */
.mini-hero{border-radius:var(--radius);padding:14px 16px;}
.mini-hero p{margin:8px 0 0;font-size:12.5px;line-height:1.65;opacity:.95;}
.mh-nums{display:flex;gap:18px;margin-top:12px;font-size:11.5px;opacity:.9;}
.mh-nums b{font-size:16px;font-weight:700;}

/* ============ 我的页头 ============ */
.me-head{display:flex;align-items:center;gap:13px;padding:6px 2px 16px;}
.avatar{width:54px;height:54px;border-radius:18px;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;flex:none;}
.me-head b{display:block;font-size:17px;font-weight:700;letter-spacing:.3px;}
.me-head span{display:block;font-size:12px;color:var(--ink-3);margin-top:3px;}

/* ============ 错题本 / 题目详解 ============ */
.hint-bar{display:flex;align-items:center;gap:6px;padding:9px 12px;margin:2px 0 6px;border-radius:10px;
  background:var(--brand-soft);color:var(--brand-ink);font-size:11.5px;line-height:1.5;}
.qcard.tap{cursor:pointer;}
.qcard.tap:active{transform:scale(.985);}
.tap-hint{display:flex;align-items:center;gap:1px;margin-left:auto;font-size:11px;color:var(--ink-4);}
.qcard .xdel{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  color:var(--ink-4);flex:none;margin-left:4px;}
.qcard .xdel:active{background:var(--line-2);}
.ansopts{display:flex;flex-direction:column;gap:6px;margin:10px 0 2px;}
.ansopt{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-radius:9px;
  background:var(--card-2);font-size:13px;line-height:1.6;}
.ansopt .k{width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--ink-2);
  display:grid;place-items:center;font-size:11px;font-weight:650;flex:none;margin-top:1px;}
.ansopt .v{flex:1;word-break:break-word;}
.ansopt.ok{background:var(--green-soft);}
.ansopt.ok .k{background:var(--green);color:#fff;}
.ansopt.bad{background:var(--red-soft);}
.ansopt.bad .k{background:var(--red);color:#fff;}
.qex{margin-top:8px;padding:9px 11px;border-radius:10px;background:var(--card-2);
  font-size:12.5px;line-height:1.7;color:var(--ink-2);}
.miniq .tx b{font-weight:500;font-size:13px;line-height:1.5;white-space:normal;display:block;}

/* 结果页的两排导航按钮 */
.rowbtns{display:flex;gap:10px;margin-top:10px;}
.rowbtns .btn{flex:1;height:42px;font-size:13.5px;}

/* ============ 速背卡片内的表格 ============ */
.kp-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:9px 0 4px;}
.kp-table{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.55;}
.kp-table th,.kp-table td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top;}
.kp-table th{background:var(--card-2);font-weight:650;color:var(--ink);white-space:nowrap;}
.kp-table td{color:var(--ink-2);}
.kp-table tbody td:first-child{white-space:nowrap;color:var(--ink);font-weight:550;}
.kp-table code{font-size:11.5px;}

  {"id":"ds-305","ch":"ds-3","stem":"元素 1、2、3、4 依次入栈（入栈过程中允许出栈），下列出栈序列中不可能出现的是（　）。","opts":["1,2,3,4","2,3,4,1","3,2,1,4","4,1,2,3"],"ans":[3],"ex":"序列中出现 4 先出栈，说明 1、2、3、4 已全部入栈，此时栈内自底向上为 1、2、3，出栈只能按 3、2、1 的顺序进行，所以 4 之后不可能紧接 1。其余三项都能通过控制入出栈时机实现。"},
  {"id":"ds-401","ch":"ds-4","tag":"高频","stem":"模式串 P = \"ababaa\" 的 next 数组（下标从 1 开始，next[1]=0）为（　）。","opts":["0 1 1 2 3 4","0 1 1 2 3 1","0 1 2 3 4 5","0 1 1 2 4 1"],"ans":[0],"ex":"next[j] 为模式串 P[1..j-1] 的最长相等前后缀长度 +1。逐位：P1 无前缀→0；P2(a)→1；P3(ab)→1；P4(aba)→2；P5(abab)→3；P6(ababa)→4。故 0,1,1,2,3,4。"},
  {"id":"ds-402","ch":"ds-4","stem":"KMP 算法匹配过程中，主串指针与模式串指针的移动方式是（　）。","opts":["主串指针回溯，模式串指针前移","主串指针不回溯，失配时模式串按 next 右滑","两者都回溯","两者都不回溯，靠预处理跳表"],"ans":[1],"ex":"KMP 的核心：失配时主串指针 i 不回退，模式串指针 j 回退到 next[j]（即右滑对齐到最长相等前后缀处），总时间 O(m+n)。"},
  {"id":"ds-403","ch":"ds-4","stem":"串是一种特殊的线性表，其特殊性主要体现在（　）。","opts":["数据元素个数有限","数据元素本身是单个字符","可以顺序存储或链式存储","串的长度可以为 0"],"ans":[1],"ex":"串是元素为字符的线性表，这一点区别于一般线性表。空串（长度 0）与空格串（只含空格）不同，但「长度可为 0」并非串独有的性质。"},
  {"id":"ds-404","ch":"ds-4","tag":"易错","stem":"使用 nextval 数组相比 next 数组改进的是（　）。","opts":["减少模式串预处理时间","降低空间复杂度","避免失配时与同一字符重复比较","使其支持通配符"],"ans":[2],"ex":"若 P[j] 与 P[next[j]] 相同，按 next 回退会拿同一字符再比一次必然再失配，nextval 直接跳过这类无效回退。"},
  {"id":"ds-501","ch":"ds-5","tag":"必背","stem":"一棵二叉树中有 20 个度为 1 的结点、10 个叶子结点，则该二叉树的结点总数为（　）。","opts":["39","40","41","无法确定"],"ans":[0],"ex":"设度为 0、1、2 的结点数分别为 n0、n1、n2。已知 n0=10、n1=20；由 n0 = n2 + 1 得 n2 = 9。于是总数 = 10 + 20 + 9 = 39。"},
  {"id":"ds-502","ch":"ds-5","stem":"具有 n 个结点的完全二叉树，其高度为（　）。","opts":["⌈log₂n⌉","⌈log₂(n+1)⌉","⌊log₂n⌋","log₂n"],"ans":[1],"ex":"高度 h 满足 `2^(h-1) ≤ n ≤ 2^h − 1`，解得 `h = ⌈log₂(n+1)⌉`。取 n=4 验证：⌈log₂5⌉=3，而 ⌈log₂4⌉=2、⌊log₂4⌋=2 都不对。注意 ⌊log₂n⌋+1 与它在完全二叉树上恒等（所以不设为干扰项），答题时按题目给的公式选。"},
  {"id":"ds-503","ch":"ds-5","tag":"高频","stem":"已知二叉树前序序列 ABDECF、中序序列 DBEACF，其后序序列为（　）。","opts":["DEBFCA","DEBCFA","EDBFCA","DEBFAC"],"ans":[0],"ex":"前序首 A 为根，中序中 A 左侧 DBE 为左子树、右侧 CF 为右子树。左子树前序 BDE、中序 DBE → 根 B，左 D、右 E；右子树前序 CF、中序 CF → C 为根、F 右孩子。后序 = 左右根 = DEB FCA → DEBFCA。"},
  {"id":"ds-504","ch":"ds-5","stem":"对权值集合 {2,3,4,5,6} 构造哈夫曼树，其带权路径长度 WPL 为（　）。","opts":["45","42","40","36"],"ans":[0],"ex":"合并过程：2+3=5 → {4,5,5,6}；4+5=9 → {5,6,9}；5+6=11 → {9,11}；9+11=20。WPL 等于各次合并所得新结点权值之和：5+9+11+20 = 45。"},
  {"id":"ds-505","ch":"ds-5","stem":"n 个结点的二叉树采用二叉链表存储，其空指针域个数为（　）。","opts":["n-1","n","n+1","2n-1"],"ans":[2],"ex":"每个结点 2 个指针域，共 2n 个；非空指针域为 n-1 条边，故空指针域 = 2n-(n-1) = n+1。线索化就是利用这 n+1 个空指针。"},
  {"id":"ds-506","ch":"ds-5","tag":"易错","stem":"中序线索二叉树中，结点 p 的后继是（　）。","opts":["p 的右孩子","p 的父结点","若 p 有右孩子，则为其右子树中最左下的结点；否则为线索指向的结点","p 的左孩子"],"ans":[2],"ex":"中序线索的后继判断分两种：有右孩子 → 右子树最左下；无右孩子 → 直接取 rtag 线索（rtag=1 时 rchild 指后继）。"},
  {"id":"ds-601","ch":"ds-6","stem":"含 n 个顶点、e 条边的无向图采用邻接矩阵存储，其空间复杂度为（　）。","opts":["O(n)","O(e)","O(n²)","O(n+e)"],"ans":[2],"ex":"邻接矩阵固定 n×n，与边数无关，适合稠密图；邻接表空间 O(n+e)，适合稀疏图。"},
  {"id":"ds-602","ch":"ds-6","tag":"高频","stem":"Prim 算法与 Kruskal 算法的时间复杂度分别为（　）。","opts":["O(n²) 与 O(e log e)","O(e log e) 与 O(n²)","都是 O(n²)","都是 O(e log e)"],"ans":[0],"ex":"Prim 靠「最近顶点」数组，时间 O(n²)，与边数无关，适合稠密图；Kruskal 靠边排序 + 并查集，O(e log e)，适合稀疏图。"},
  {"id":"ds-603","ch":"ds-6","tag":"易错","stem":"下列算法中，不能处理带负权边的最短路径问题的是（　）。","opts":["Floyd","Bellman-Ford","Dijkstra","SPFA"],"ans":[2],"ex":"Dijkstra 基于贪心「已确定顶点不会被更新」，负权会破坏该性质。Floyd、Bellman-Ford、SPFA 都能处理负权（但不能有负环）。"},
  {"id":"ds-604","ch":"ds-6","stem":"对有向图进行拓扑排序，若排序过程中出现（　），说明图中存在环。","opts":["某个顶点入度为 0","队列中同时有多个顶点","所有顶点输出完毕仍有顶点入度不为 0","存在多个拓扑序列"],"ans":[2],"ex":"拓扑排序输出顶点数小于 n，即说明剩下的顶点互相依赖，必存在有向环。多个拓扑序列是正常现象。"},
  {"id":"ds-605","ch":"ds-6","stem":"关键路径是 AOE 网中（　）。","opts":["从源点到汇点边数最多的路径","从源点到汇点长度最长的路径","由关键活动构成的唯一路径","从源点到汇点长度最短的路径"],"ans":[1],"ex":"关键路径是**最长**路径（决定工程最短工期），可能不唯一；其上活动的时间余量均为 0。"},
  {"id":"ds-701","ch":"ds-7","tag":"高频","stem":"对有序表进行折半查找，其判定树的高度为 h 时，最多可容纳的元素个数为（　）。","opts":["2^h","2^h-1","2^(h-1)","2^(h-1)-1"],"ans":[1],"ex":"折半查找判定树是平衡的二叉树，h 层满二叉树共 2^h-1 个结点。n 个元素的判定树高度 ⌈log₂(n+1)⌉。"},
  {"id":"ds-702","ch":"ds-7","stem":"m 阶 B 树的非根结点中，关键字个数 k 满足（　）。","opts":["1 ≤ k ≤ m-1","⌈m/2⌉-1 ≤ k ≤ m-1","⌈m/2⌉ ≤ k ≤ m","0 ≤ k ≤ m"],"ans":[1],"ex":"m 阶 B 树：非根结点关键字数 k 满足 ⌈m/2⌉-1 ≤ k ≤ m-1；根结点 1 ≤ k ≤ m-1。结点孩子数 = k+1。"},
  {"id":"ds-703","ch":"ds-7","stem":"散列表的装填因子 α 定义为（　），α 越大则（　）。","opts":["α = 表长/记录数；冲突越少","α = 记录数/表长；冲突越多","α = 冲突数/记录数；ASL 越小","α = 记录数/关键字数；与冲突无关"],"ans":[1],"ex":"α = n/m（已存记录数 / 散列地址空间大小）。α 越大表越满，冲突越多，平均查找长度越长。"},
  {"id":"ds-704","ch":"ds-7","stem":"对二叉排序树进行（　）遍历，可以得到关键字的有序序列。","opts":["前序","中序","后序","层序"],"ans":[1],"ex":"BST 性质：左子树 < 根 < 右子树，中序遍历（左根右）即得递增序列，这也是判断 BST 是否合法的常用方法。"},
  {"id":"ds-705","ch":"ds-7","tag":"易错","stem":"采用开放定址法处理冲突的散列表，其平均查找长度主要取决于（　）。","opts":["关键字的总个数 n","散列表的长度 m","装填因子 α 与冲突处理方法","关键字的取值分布"],"ans":[2],"ex":"ASL 只与装填因子 α = n/m 和冲突处理方法有关，而与 n、m 的绝对大小无关——这正是散列表「以空间换时间」的理论依据。"},
  {"id":"ds-801","ch":"ds-8","tag":"必背","stem":"下列排序算法中，时间复杂度为 O(n log n) 且空间复杂度为 O(1) 的是（　）。","opts":["归并排序","快速排序","堆排序","基数排序"],"ans":[2],"ex":"堆排序原地进行，辅助空间 O(1)。快排平均 O(n log n) 但空间 O(log n)（栈）；归并 O(n) 空间；基数 O(n+r)。"},
  {"id":"ds-802","ch":"ds-8","tag":"易错","stem":"下列排序算法中，不稳定的是（　）。\nⅠ.希尔排序　Ⅱ.快速排序　Ⅲ.堆排序　Ⅳ.归并排序","opts":["仅 Ⅰ、Ⅱ","仅 Ⅰ、Ⅱ、Ⅲ","仅 Ⅱ、Ⅲ、Ⅳ","Ⅰ、Ⅱ、Ⅲ、Ⅳ"],"ans":[1],"ex":"不稳定的有：希尔、快排、堆排、直接选择。稳定的有：插入、冒泡、归并、基数。"},
  {"id":"ds-803","ch":"ds-8","stem":"对序列 {49,38,65,97,76,13,27,49} 按首元素 49 为基准进行一趟快速排序（挖坑填数法），结果是（　）。","opts":["{13,27,38,49,49,76,97,65}","{27,38,13,49,97,76,65,49}","{27,13,38,49,97,76,49,65}","{49,38,27,13,49,65,76,97}"],"ans":[1],"ex":"挖坑法：右端找 <49 的 27 填到左坑 → 左端找 >49 的 65 填到右坑 → 右端找 <49 的 13 填到左坑 → 左端找 >49 的 97 填到右坑 → 两指针相遇于位置 3，填入基准 49。结果 {27,38,13,49,97,76,65,49}，且左侧全部 ≤49、右侧全部 ≥49、基准已就位。"},
  {"id":"ds-804","ch":"ds-8","stem":"向小根堆中插入元素后需进行的调整是（　）。","opts":["从根向下调整（下滤）","从插入位置向上调整（上浮）","无需调整","重新建堆"],"ans":[1],"ex":"插入在堆尾，然后与父结点比较逐层上浮；删除堆顶才是把堆尾结点移到根再下滤。建堆则从 ⌊n/2⌋ 开始逐个下滤。"},
  {"id":"ds-805","ch":"ds-8","stem":"对 20000 个记录做外部排序，内存一次最多容纳 1000 个记录，采用 10 路归并，则归并趟数为（　）。","opts":["1","2","3","4"],"ans":[1],"ex":"初始归并段数 r = ⌈20000/1000⌉ = 20 段。归并趟数 S = ⌈log₁₀ 20⌉ = 2（10 路第一趟合并出 2 段，第二趟合并为 1 段）。"},
  {"id":"ds-806","ch":"ds-8","stem":"下列排序算法中，每趟结束时都能确定一个元素最终位置的是（　）。","opts":["直接插入排序","希尔排序","冒泡排序","归并排序"],"ans":[2],"ex":"冒泡每趟把最大（小）元素「冒」到末端并固定位置；快排每趟固定基准；选择排序每趟选出极值。插入、希尔、归并都不固定位置。"},
  {"id":"ds-106","ch":"ds-1","tag":"概念","stem":"数据的逻辑结构通常划分为（　）。","opts":["线性结构和非线性结构","顺序结构和链式结构","静态结构和动态结构","紧凑结构和非紧凑结构"],"ans":[0],"ex":"逻辑结构按元素间关系分四类：集合、线性、树形、图状，后三者常统称非线性。顺序/链式是**存储结构**的划分，别混。"},
  {"id":"ds-206","ch":"ds-2","stem":"若对线性表最常用的操作是「取第 i 个元素」和「查找值为 x 的元素」，则采用（　）最省时间。","opts":["单链表","双链表","顺序表","循环链表"],"ans":[2],"ex":"取第 i 个元素：顺序表 O(1)，链表 O(n)。按值查找：两者都要 O(n)，但顺序表内存连续、常数因子更小。综合看顺序表更优。"},
  {"id":"ds-207","ch":"ds-2","tag":"易错","stem":"静态链表用数组模拟链表，其**不具备**的特性是（　）。","opts":["插入删除不必移动元素","容量可按需动态增长","不需要语言提供指针类型","适合不支持指针的编程环境"],"ans":[1],"ex":"静态链表预先分配一个固定大小的数组，用游标代替指针——**容量是固定的，不能动态增长**。这正是它与真正链表的差距。"},
  {"id":"ds-306","ch":"ds-3","tag":"计算","stem":"循环队列用数组 A[0..m−1] 存放，front 指向队头元素、rear 指向队尾元素的**下一位置**，则当前队列长度为（　）。","opts":["(rear − front + m) % m","(front − rear + m) % m","rear − front","(rear − front + 1) % m"],"ans":[0],"ex":"rear 在 front 之后（沿环形）时长度为正：(rear − front + m) % m。加 m 再取模是为了处理 rear < front 的绕回情况。"},
  {"id":"ds-307","ch":"ds-3","stem":"下列应用场景中，**不需要**使用栈的是（　）。","opts":["表达式求值","递归过程的实现","括号匹配检查","打印机任务排队"],"ans":[3],"ex":"打印任务按到达顺序处理，是先进先出 → **队列**。表达式求值、括号匹配、递归调用都依赖后进先出。"},
  {"id":"ds-405","ch":"ds-4","tag":"计算","stem":"主串长 n、模式串长 m（n ≥ m），朴素模式匹配在最坏情况下的比较次数约为（　）。","opts":["n","n + m","(n − m + 1) × m","n + m − 1"],"ans":[2],"ex":"每个起始位置最坏比较 m 次，共 n−m+1 个起始位置，故约 `(n−m+1)·m`，量级 O(nm)。KMP 把它降到 O(n+m)。"},
  {"id":"ds-507","ch":"ds-5","stem":"对含 n 个结点的完全二叉树按层序从 1 开始编号，编号为 i 的结点（i > 1）的父结点编号是（　）。","opts":["⌊i/2⌋","i/2","2i","2i + 1"],"ans":[0],"ex":"完全二叉树的下标关系：父 `⌊i/2⌋`，左孩子 `2i`，右孩子 `2i+1`（均需在 1..n 范围内）。这是堆的数组实现基础。"},
  {"id":"ds-508","ch":"ds-5","stem":"把森林转换成二叉树后，该二叉树的根结点是（　）。","opts":["森林中第一棵树根结点的右孩子","森林中第一棵树的根结点","森林中最右边那棵树的根结点","虚拟构造出来的结点"],"ans":[1],"ex":"转换规则「左孩子右兄弟」：第一棵树的根成为二叉树的根，各树的根通过右指针串成一条链（兄弟关系）。"},
  {"id":"ds-606","ch":"ds-6","tag":"计算","stem":"含 n 个顶点、e 条边的**无向图**用邻接表存储，边结点（表结点）的总数为（　）。","opts":["e","2e","n + e","n + 2e"],"ans":[1],"ex":"无向图每条边 (u,v) 在 u 的表里存一次、v 的表里再存一次，故 **2e** 个边结点。有向图邻接表则是 e 个（出边）。"},
  {"id":"ds-607","ch":"ds-6","stem":"采用**邻接表**存储的图做 DFS 遍历，时间复杂度为（　）。","opts":["O(n)","O(e)","O(n + e)","O(n²)"],"ans":[2],"ex":"每个顶点访问一次、每条边（含对称边）检查一次 → O(n+e)。若用邻接矩阵则是 O(n²)。"},
  {"id":"ds-706","ch":"ds-7","tag":"必背","stem":"平衡二叉树（AVL 树）中任一结点的平衡因子只能取（　）。","opts":["0","−1、0、1","−2 到 2","任意整数"],"ans":[1],"ex":"平衡因子 = 左子树高 − 右子树高，AVL 要求 |BF| ≤ 1，故只能是 −1、0、1。插入/删除后失衡要通过 LL/RR/LR/RL 旋转恢复。"},
  {"id":"ds-707","ch":"ds-7","stem":"关于 B+ 树，下列说法正确的是（　）。","opts":["所有关键字都出现在叶子结点，非叶结点只作索引","非叶结点也存放完整记录","叶子结点之间没有联系","B+ 树不支持范围查询"],"ans":[0],"ex":"B+ 树的非叶结点只存索引（键值），全部记录在叶子层，且叶子用指针连成链表 → **范围查询极快**。这正是数据库索引偏爱 B+ 树的原因。"},
  {"id":"ds-807","ch":"ds-8","tag":"计算","stem":"基数排序的时间复杂度为（　），其中 d 为关键字位数、r 为基数。","opts":["O(n)","O(n log n)","O(d(n + r))","O(n²)"],"ans":[2],"ex":"每一趟分配 O(n)、收集 O(r)，共 d 趟 → `O(d(n+r))`。当 d 与 r 为常数时接近线性，但它需要 O(n+r) 的辅助空间，且**稳定**。"},
  {"id":"ds-808","ch":"ds-8","stem":"归并排序的空间复杂度为（　）。","opts":["O(1)","O(log n)","O(n)","O(n log n)"],"ans":[2],"ex":"归并需要与原数组等长的辅助数组存放合并结果，故 O(n)。快排只需递归栈 O(log n)，堆排是 O(1)。"}
];

window.DATA.k.ds = [
  {"ch":"ds-1","t":"逻辑结构 vs 存储结构","tag":"必背","b":"**逻辑结构**：数据元素之间的逻辑关系，分集合、线性、树形、图状四类。\n**存储结构**：逻辑结构在计算机中的表示，分顺序、链式、索引、散列。\n!! 二者是**多对一**：同一逻辑结构可有多种存储实现；顺序存储也能表示非线性结构（数组存完全二叉树、邻接矩阵）。"},
  {"ch":"ds-1","t":"算法五个特性","tag":"必背","b":"- **有穷性**：有限步后结束\n- **确定性**：每一步含义唯一、无二义\n- **可行性**：每步都能由基本运算实现\n- **输入**：零个或多个\n- **输出**：一个或多个\n!! 常考「算法与程序的区别」：程序可以不终止（如操作系统），算法必须有穷。"},
  {"ch":"ds-1","t":"复杂度速判口诀","tag":"速记","b":"循环变量每次 **×2 / ÷2** → `O(log n)`\n循环变量 **+1 到 n** → `O(n)`\n两层嵌套、内层跑 n 次 → `O(n²)`\n分治每次减半、合并 O(n) → `O(n log n)`\n!! 递归空间复杂度 = **递归深度**，不是调用次数；尾递归可优化为 O(1)。"},
  {"ch":"ds-2","t":"顺序表 vs 链表","tag":"对照","b":"- 顺序表：随机访问 O(1)，插入删除 O(n)，需预分配连续空间\n- 链表：插入删除 O(1)（已知位置），查找 O(n)，结点额外指针开销\n!! 结论：**查多改少用顺序，改多查少用链表**。"},
  {"ch":"ds-2","t":"插入删除移动次数（必背数字）","tag":"必背","b":"顺序表插入：平均移动 `n/2`，最好 0，最坏 n\n顺序表删除：平均移动 `(n-1)/2`，最好 0，最坏 n-1\n!! 插入位置共 **n+1** 个，删除位置共 **n** 个——分母不同，别记混。"},
  {"ch":"ds-2","t":"单链表三个常用技巧","tag":"速记","b":"- **头插法建表**：得到逆序；尾插法得正序\n- **就地逆置**：遍历 + 头插，O(1) 空间\n- **快慢指针**：找中点、判环、找倒数第 k 个\n!! 删除结点 p 本身：可把 p->next 的数据拷贝到 p 再删后继（O(1)，但不能是尾结点）。"},
  {"ch":"ds-2","t":"循环链表与双向链表","tag":"易错","b":"循环单链表判空：`L->next == L`；尾部 next 指回头结点。\n双向链表删除 p：`p->prior->next = p->next; p->next->prior = p->prior;`\n!! 双向循环链表判空：`L->next == L && L->prior == L`。"},
  {"ch":"ds-3","t":"循环队列（必考公式）","tag":"必背","b":"队空：`front == rear`\n队满：`(rear+1)%MaxSize == front`（牺牲一个单元）\n长度：`(rear-front+MaxSize)%MaxSize`\n入队：`rear=(rear+1)%MaxSize`；出队：`front=(front+1)%MaxSize`\n!! 若用「计数器 size」或「tag 标志」区分，则可不牺牲单元。"},
  {"ch":"ds-3","t":"出栈序列合法性","tag":"技巧","b":"判断方法：按出栈序列模拟，若某元素要出栈，则它前面的元素必须已入栈且尚未出栈。\n卡特兰数：n 个元素入栈共有 `C(2n,n)/(n+1)` 种合法出栈序列。\n!! 常见错解：只看「有没有逆序对」——逆序对存在并不代表非法。"},
  {"ch":"ds-3","t":"表达式转换","tag":"速记","b":"- 中缀 → 后缀：遇操作数直接输出；遇运算符与栈顶比较优先级，低则弹栈；遇 `(` 入栈，`)` 弹到 `(`\n- 后缀求值：遇操作数入栈，遇运算符弹出两个运算\n!! **前缀**是「运算符在前」，从右往左扫描与后缀对称。"},
  {"ch":"ds-3","t":"特殊矩阵压缩地址","tag":"公式","b":"对称矩阵（只存下三角，0 起算，行优先）：`k = i(i-1)/2 + j`（i≥j）\n上三角元素对称取 `a[j][i]`：交换 i、j\n三对角矩阵：`k = 2i + j`\n!! 一定先确认题目**下标从 0 还是 1 开始**、**行还是列优先**。"},
  {"ch":"ds-4","t":"KMP 的 next 手算","tag":"必背","b":"next[j] = 模式串 `P[1..j-1]` 中**最长相等前后缀**的长度 + 1；`next[1]=0`。\n算例 `P=ababaa`：\n- P1 → 0；P2(a) → 1；P3(ab) → 1\n- P4(aba) → 2；P5(abab) → 3；P6(ababa) → 4\n!! 若题目 next[1]=-1（从 0 开始），全部值减 1，**先对齐题目约定**。"},
  {"ch":"ds-4","t":"nextval 的意义","tag":"进阶","b":"若 `P[j] == P[next[j]]`，则 `nextval[j] = nextval[next[j]]`，否则 `nextval[j] = next[j]`。\n作用：跳过必然再次失配的回退，减少比较次数（预处理不变）。\n!! KMP 总时间 `O(m+n)`，朴素匹配最坏 `O(mn)`。"},
  {"ch":"ds-5","t":"二叉树五个性质（必背）","tag":"必背","b":"1. 第 i 层至多 `2^(i-1)` 个结点\n2. 高度 h 的二叉树至多 `2^h - 1` 个结点\n3. 叶子与度为 2 的关系：`n0 = n2 + 1`\n4. n 个结点完全二叉树高度 `⌈log₂(n+1)⌉`\n5. n 结点二叉链表空指针域 `n+1` 个\n!! 第 5 条是线索化的理论基础。"},
  {"ch":"ds-5","t":"由遍历序列还原二叉树","tag":"技巧","b":"**必须含中序**才能唯一确定。\n前序 + 中序：前序首元素为根 → 在中序中定位 → 左段为左子树、右段为右子树 → 递归。\n后序 + 中序同理（后序末元素为根）。\n!! 前序 + 后序**不能**唯一确定（无法区分单孩子的左右）。"},
  {"ch":"ds-5","t":"哈夫曼树与编码","tag":"必背","b":"构造：每次取两个最小权值合并，新结点权值为二者之和，放回集合。\n`WPL = Σ(叶子权值 × 路径长度)`，也等于**所有合并值之和**（更快）。\n哈夫曼编码是**前缀码**，无二义；树中不存在度为 1 的结点。\n!! 哈夫曼树不唯一，但 WPL 唯一。"},
  {"ch":"ds-5","t":"线索二叉树","tag":"易错","b":"`ltag=0` 表示 lchild 指左孩子，`ltag=1` 表示指前驱；rtag 同理指后继。\n中序线索找后继：有右孩子 → **右子树最左下**；无右孩子 → 直接取 rchild 线索。\n!! 线索化用的正是 n+1 个空指针域，不额外占空间。"},
  {"ch":"ds-5","t":"并查集","tag":"速记","b":"三个操作：初始化、查找（Find 带**路径压缩**）、合并（Union 按**秩/大小**合并）。\n优化后单次操作近似 `O(α(n))`，α 为反阿克曼函数，可视为常数。\n!! 常与 Kruskal 算法配合判环。"},
  {"ch":"ds-6","t":"图的存储结构选择","tag":"对照","b":"- 邻接矩阵：空间 `O(n²)`，判两点是否相邻 O(1)，适合**稠密图**\n- 邻接表：空间 `O(n+e)`，遍历某点邻居快，适合**稀疏图**\n- 十字链表：有向图的链式存储（出边 + 入边）\n- 邻接多重表：无向图的链式存储（每条边一个结点）\n!! 无向图邻接矩阵对称，可只存三角节省一半空间。"},
  {"ch":"ds-6","t":"最小生成树：Prim vs Kruskal","tag":"对照","b":"**Prim**：从一点出发，每次选「离已选集合最近的顶点」，`O(n²)`，稠密图优。\n**Kruskal**：边按权排序，每次选不构成环的最小边（并查集判环），`O(e log e)`，稀疏图优。\n!! 两者都属贪心；当所有边权互不相同时，MST **唯一**。"},
  {"ch":"ds-6","t":"最短路径三算法","tag":"必背","b":"- **Dijkstra**：单源，`O(n²)`，**不能有负权**\n- **Floyd**：多源（全部点对），`O(n³)`，可负权、不可负环\n- **Bellman-Ford**：单源，`O(ne)`，可负权，可检测负环\n!! 求「任意两点」用 Floyd；负权单源用 Bellman-Ford。"},
  {"ch":"ds-6","t":"拓扑排序与关键路径","tag":"必背","b":"拓扑排序：反复取入度为 0 的顶点并删其出边；若输出不足 n 个 → **图中有环**。\n关键路径（AOE）：事件最早 `ve` 正推取 max、最迟 `vl` 逆推取 min；活动余量 `l(e)-e(e)=0` 即关键活动。\n!! 关键路径 = **最长**路径，可能不唯一；缩短非关键活动不缩短工期。"},
  {"ch":"ds-7","t":"折半查找与判定树","tag":"必背","b":"判定树是平衡二叉树，h 层最多 `2^h - 1` 个结点；n 个元素高度 `⌈log₂(n+1)⌉`。\n成功 ASL ≈ `log₂(n+1) - 1`。\n!! 折半查找**只适用于顺序存储的有序表**，链表不行（无法随机定位中点）。"},
  {"ch":"ds-7","t":"B 树与 B+ 树","tag":"对照","b":"m 阶 B 树：根 `1 ≤ k ≤ m-1`；非根 `⌈m/2⌉-1 ≤ k ≤ m-1`；孩子数 = 关键字数 + 1。\n插入：满则**分裂**（中间关键字上移）；删除：不足则**借/合并**。\n**B+ 树**：只有叶子存记录，叶子间用指针连成链表，支持顺序遍历；非叶结点只作索引。\n!! B+ 树查询必须走到叶子，但范围查询更快，数据库索引多用 B+。"},
  {"ch":"ds-7","t":"散列表 ASL","tag":"公式","b":"`α = n/m`（装填因子）。ASL 只与 α 和冲突处理方法有关，与 n、m 绝对值无关。\n线性探测：成功 ASL 与失败 ASL 都要按「探测次数」算；失败 ASL 的分母是 **m**（所有散列地址）。\n!! 拉链法失败 ASL 分母常取 m；开放定址法失败 ASL 分母也取 m。"},
  {"ch":"ds-8","t":"八大排序对照表（最常考）","tag":"必背","b":"- 插入：O(n²) / O(1) / **稳定**\n- 冒泡：O(n²) / O(1) / **稳定**\n- 选择：O(n²) / O(1) / **不稳定**\n- 希尔：O(n^1.3)~O(n²) / O(1) / **不稳定**\n- 快排：O(n log n)~O(n²) / O(log n) / **不稳定**\n- 归并：O(n log n) / O(n) / **稳定**\n- 堆排：O(n log n) / O(1) / **不稳定**\n- 基数：O(d(n+r)) / O(n+r) / **稳定**\n!! 记「不稳定」四兄弟：**希尔、快、堆、选**。"},
  {"ch":"ds-8","t":"一趟排序结果反推算法","tag":"技巧","b":"- 每趟固定一个元素位置 → 冒泡 / 快排 / 选择\n- 局部有序、前缀逐渐变长 → 插入排序\n- 按增量分组跳跃 → 希尔排序\n- 每趟合并若干有序段 → 归并\n!! 快排一趟后：基准左侧全小、右侧全大（但不保证整体有序）。"},
  {"ch":"ds-8","t":"外部排序","tag":"必背","b":"归并趟数 `S = ⌈log_m (N/M)⌉`，m 为归并路数，N 为记录数，M 为内存可容纳数。\n优化：增大归并路数 m（用**败者树**）、用**置换-选择排序**生成更长的初始归并段、**最佳归并树**（哈夫曼思想）。\n!! 增加归并路数会增大内部比较开销，败者树正是为降低该开销而设计。"}
];

  {"id":"co-101","ch":"co-1","tag":"2019 真题","stem":"下列关于冯·诺依曼结构计算机基本思想的叙述中，错误的是（　）。","opts":["程序的功能都通过中央处理器执行指令实现","指令和数据都用二进制表示，形式上无差别","指令按地址访问，数据都在指令中直接给出","程序执行前，指令和数据需预先存放在存储器中"],"ans":[2],"ex":"冯·诺依曼结构的两大思想是「存储程序」和「指令数据同等对待」。指令与数据都按地址访问、都存在存储器中，数据并非都直接给出（只有立即数寻址才在指令中）。故 C 错。"},
  {"id":"co-102","ch":"co-1","tag":"2022 真题","stem":"将高级语言源程序转换为可执行目标文件的主要过程是（　）。","opts":["预处理 → 编译 → 汇编 → 链接","预处理 → 汇编 → 编译 → 链接","预处理 → 编译 → 链接 → 汇编","预处理 → 汇编 → 链接 → 编译"],"ans":[0],"ex":"标准流程：**预处理**（展开宏与 include）→ **编译**（生成汇编代码）→ **汇编**（生成机器码目标文件 .o）→ **链接**（合并库与目标文件成可执行文件）。"},
  {"id":"co-103","ch":"co-1","tag":"2014 真题","stem":"程序 P 在机器 M 上的执行时间是 20 秒。编译优化后，P 执行的指令数减少为原来的 70%，而 CPI 增加到原来的 1.2 倍，则 P 在 M 上的执行时间是（　）。","opts":["8.4 秒","11.7 秒","14 秒","16.8 秒"],"ans":[3],"ex":"CPU 执行时间 = 指令数 × CPI × 时钟周期。时钟周期不变，故 T′ = 20 × 0.7 × 1.2 = 16.8 秒。"},
  {"id":"co-104","ch":"co-1","tag":"2022 真题","stem":"某计算机主频为 1GHz，程序 P 运行过程中共执行 10000 条指令，其中 80% 的指令平均需 1 个时钟周期、20% 的指令平均需 10 个时钟周期。程序 P 的平均 CPI 和 CPU 执行时间分别是（　）。","opts":["2.8，28μs","28，28μs","2.8，28ms","28，28ms"],"ans":[0],"ex":"平均 CPI = 0.8×1 + 0.2×10 = 2.8。执行时间 = 指令数 × CPI × 时钟周期 = 10000 × 2.8 / 1GHz = 2.8×10⁻⁵ s = 28μs。"},
  {"id":"co-105","ch":"co-1","stem":"某计算机主频为 2GHz，某基准程序中指令的平均 CPI 为 2.5，则该机的 MIPS 为（　）。","opts":["400","800","1250","2000"],"ans":[1],"ex":"MIPS = 主频 / (CPI × 10⁶) = 2×10⁹ / (2.5×10⁶) = 800。注意 MIPS 只反映整数指令吞吐，不代表浮点性能（浮点看 MFLOPS）。"},
  {"id":"co-106","ch":"co-1","stem":"存储层次「寄存器 → Cache → 主存 → 辅存」中，越往下层（　）。","opts":["速度越快、容量越小、每位价格越高","速度越慢、容量越大、每位价格越低","速度越慢、容量越小、每位价格越低","速度越快、容量越大、每位价格越低"],"ans":[1],"ex":"层次结构的基本规律：越靠近 CPU 越快、越贵、越小；越远越慢、越便宜、越大。这依赖程序的**局部性原理**才能有效。"},
  {"id":"co-201","ch":"co-2","tag":"必背","stem":"8 位补码能表示的整数范围是（　）。","opts":["-127 ~ +127","-128 ~ +127","-128 ~ +128","-127 ~ +128"],"ans":[1],"ex":"n 位补码范围 [-2^(n-1), 2^(n-1)-1]，8 位即 [-128, 127]。补码比原码/反码多表示一个负数（1000…0 代表 -2^(n-1)），且 0 只有一种表示。"},
  {"id":"co-202","ch":"co-2","tag":"易错","stem":"补码 `1000 0000`（8 位）所表示的真值是（　）。","opts":["0","-0","-128","+128"],"ans":[2],"ex":"补码中 `1000…0` 是**最小负数** -2^(n-1) = -128。它没有对应的正数（+128 超出 8 位补码范围），所以补码的负数比正数多一个。"},
  {"id":"co-203","ch":"co-2","tag":"高频","stem":"IEEE 754 单精度浮点数的字段划分是（　）。","opts":["1 位符号 + 8 位阶码 + 23 位尾数","1 位符号 + 7 位阶码 + 24 位尾数","1 位符号 + 11 位阶码 + 20 位尾数","2 位符号 + 8 位阶码 + 22 位尾数"],"ans":[0],"ex":"单精度共 32 位：符号 1、阶码 8（偏移量 127）、尾数 23（隐含最高位 1）。双精度 64 位：1 + 11 + 52，偏移量 1023。"},
  {"id":"co-204","ch":"co-2","stem":"采用双符号位（变形补码）判断补码加法溢出，当两个符号位为（　）时表示负溢出。","opts":["00","01","10","11"],"ans":[2],"ex":"两个符号位里**高位那个才是真符号位**。两个正数相加，结果符号位可能是 00 或 01 —— 出现「01」说明超出正上限，是**正溢出**；两个负数相加，结果可能是 11 或 10 —— 出现「10」说明低于负下限，是**负溢出**。所以本题问负溢出应选「10」。正常结果两符号位相同：00 表示正、11 表示负。"},
  {"id":"co-205","ch":"co-2","stem":"移码与补码的关系是（　）。","opts":["完全相同","仅符号位相反","仅数值位相反","相差一个偏移量"],"ans":[1],"ex":"对同一真值，移码与补码**只有符号位相反**（数值位完全相同）。因此移码保持了真值的大小顺序，便于浮点数比较阶码大小。"},
  {"id":"co-206","ch":"co-2","tag":"必背","stem":"浮点数加减运算的正确步骤是（　）。","opts":["对阶 → 尾数加减 → 规格化 → 舍入 → 判溢出","规格化 → 对阶 → 尾数加减 → 舍入 → 判溢出","对阶 → 规格化 → 尾数加减 → 判溢出 → 舍入","尾数加减 → 对阶 → 规格化 → 舍入 → 判溢出"],"ans":[0],"ex":"口诀「**对、加、规、舍、判**」：先对阶（小阶向大阶看齐，右移尾数），再尾数加减，然后规格化（左规/右规），舍入，最后判是否溢出。"},
  {"id":"co-301","ch":"co-3","tag":"必背","stem":"关于 SRAM 与 DRAM，下列说法正确的是（　）。","opts":["SRAM 用电容存储信息，需要定期刷新","DRAM 用触发器存储信息，速度快","SRAM 不需要刷新，常用来做 Cache","DRAM 读出是非破坏性的"],"ans":[2],"ex":"SRAM 用触发器（双稳态）存信息，**不需刷新**，速度快、集成度低 → 做 Cache；DRAM 用电容存信息，**需周期性刷新**且**读出是破坏性的**（读后要重写）→ 做主存。"},
  {"id":"co-302","ch":"co-3","stem":"DRAM 的三种刷新方式中，既没有「死区」又不使存取周期变长的是（　）。","opts":["集中刷新","分散刷新","异步刷新","不需要刷新"],"ans":[2],"ex":"集中刷新有死区；分散刷新无死区但把每个存取周期拉长；**异步刷新**把刷新均匀插入刷新间隔内（如 2ms 内分散刷新完所有行），兼顾两者，408 最常考。"},
  {"id":"co-303","ch":"co-3","stem":"用 2K×4 位的芯片构成 8K×8 位的存储器，需要芯片（　）片。","opts":["4","8","16","32"],"ans":[1],"ex":"字扩展倍数 = 8K/2K = 4（4 组），位扩展倍数 = 8/4 = 2（每组 2 片并联）。芯片总数 = 4 × 2 = 8 片。"},
  {"id":"co-304","ch":"co-3","tag":"2021 真题","stem":"主存地址 32 位、按字节编址，Cache 数据区大小 32KB，主存块大小 32B，采用直接映射方式和回写（Write Back）策略，则每个 Cache 行的位数至少是（　）。","opts":["275","274","258","257"],"ans":[0],"ex":"行数 = 32KB/32B = 1024 → 行号 10 位；块内地址 5 位；tag = 32−15 = 17 位。行内容 = 数据 32B（256 位）+ tag 17 + 有效位 1 + 脏位 1 = **275 位**。"},
  {"id":"co-305","ch":"co-3","tag":"2022 真题","stem":"主存地址 32 位、按字节编址，Cache 数据区容量 32KB，主存块大小 64B，采用 8 路组相联映射，则该 Cache 中比较器的个数与位数分别为（　）。","opts":["8，20","8，23","64，20","64，23"],"ans":[0],"ex":"组数 = 32KB/(64B×8) = 64 组 → 组号 6 位；块内 6 位；tag = 32−12 = 20 位。8 路组相联每组 8 个标记**并行比较**，故 8 个比较器、每个 20 位。"},
  {"id":"co-306","ch":"co-3","tag":"高频","stem":"某 Cache 命中率 95%，Cache 访问时间 1ns，主存访问时间 50ns，采用「先访 Cache，未命中再访主存」的方式，则平均访问时间 AMAT 为（　）。","opts":["1.25 ns","3.5 ns","35 ns","50 ns"],"ans":[1],"ex":"AMAT = h×Tc + (1−h)×(Tc + Tm) = 1 + 0.05×50 = 3.5 ns。若「先查 Cache 再查主存」的串行方式，未命中代价要算上已经花掉的 Tc。"},
  {"id":"co-307","ch":"co-3","tag":"易错","stem":"采用写回法（Write Back）的 Cache，每个 Cache 行必须额外增加（　）。","opts":["有效位","脏位（修改位）","替换位","校验位"],"ans":[1],"ex":"写回法只有在行被替换时才写回主存，因此需要一个**脏位**标记该行是否被修改过。写直达法则不需要脏位（每次写都同步到主存）。"},
  {"id":"co-401","ch":"co-4","stem":"指令中给出的形式地址与操作数所在的存储单元地址之间的关系由（　）决定。","opts":["指令字长","寻址方式","指令格式","数据通路宽度"],"ans":[1],"ex":"形式地址 A 只是指令中的一个字段，**寻址方式**决定如何由 A 得到有效地址 EA（如直接寻址 EA=A、间接 EA=(A)、相对 EA=PC+A）。"},
  {"id":"co-402","ch":"co-4","tag":"高频","stem":"相对寻址方式下，操作数的有效地址 EA 等于（　）。","opts":["(PC) + A","(PC) + (A)","A","(A)"],"ans":[0],"ex":"相对寻址 EA = (PC) + A，其中 PC 是**取下一条指令后**的值（重要！题目常考这一点），适合程序浮动与转移指令。"},
  {"id":"co-403","ch":"co-4","stem":"关于 RISC 与 CISC，下列说法错误的是（　）。","opts":["RISC 指令数量少、格式规整、长度固定","RISC 通常采用硬布线控制，便于流水","CISC 指令复杂、寻址方式多，多用微程序控制","CISC 的指令执行周期通常比 RISC 更短更整齐"],"ans":[3],"ex":"CISC 指令长度可变、执行周期长短不一，很难流水；RISC 指令等长、单周期为主，适合流水线。D 描述恰好相反。"},
  {"id":"co-404","ch":"co-4","stem":"某机指令字长 16 位，含 1 个 6 位操作码字段和 1 个 10 位地址码字段，按字节编址，则该指令能直接访问的存储空间为（　）。","opts":["1KB","2KB","4KB","8KB"],"ans":[0],"ex":"地址码 10 位可表示 2¹⁰ = 1024 个地址；按字节编址即 1024 B = **1KB**。若按字（2B）编址则能访问 2KB 空间，注意编址单位。"},
  {"id":"co-405","ch":"co-4","stem":"堆栈寻址方式中，若栈向**高地址方向**增长、栈指针 SP 指向栈顶元素，则压栈操作应（　）。","opts":["先写入元素，再 SP 加 1","先 SP 减 1，再写入元素","SP 不变，只写内存","先 SP 加 1，再写入元素"],"ans":[3],"ex":"栈向高地址增长且 SP 指向栈顶元素时：压栈要先把指针移到新的空位（SP+1），再写入数据。\n!! 若栈向**低**地址增长（多数教材的默认设定），则是先 SP−1 再写。做题时**先看清题目给的增长方向与 SP 的含义**。"},
  {"id":"co-501","ch":"co-5","stem":"硬布线控制器与微程序控制器相比，其主要优点是（　）。","opts":["速度快、便于修改","速度快，但设计与修改困难","设计简单、便于扩展","不依赖指令系统"],"ans":[1],"ex":"硬布线用组合逻辑直接产生控制信号，**速度快**但设计繁琐、修改困难（改指令就要改电路）；微程序控制把控制信号存为微指令，**易修改、易扩展**但速度较慢。"},
  {"id":"co-502","ch":"co-5","tag":"必背","stem":"一条指令分 5 段流水，各段耗时相同，理想情况下相对非流水线的加速比最多为（　）。","opts":["2","5","10","取决于指令条数"],"ans":[1],"ex":"k 段流水线在指令数很大时加速比上限为 k = 5。实际受限于各段耗时不均、数据冒险、控制冒险等，通常达不到理想值（Amdahl 定律）。"},
  {"id":"co-503","ch":"co-5","tag":"高频","stem":"流水线中「后一条指令需要用到前一条指令刚算出的结果」造成的冲突称为（　），一般用（　）缓解。","opts":["结构冒险；增加存储器端口","数据冒险；数据转发（旁路）","控制冒险；延迟槽","数据冒险；扩大 Cache"],"ans":[1],"ex":"数据冒险（RAW）的常规解法是**转发/旁路**：直接把 ALU 结果送给下一条指令的输入端，避免等写回寄存器。load-use 冒险则必须配合一个周期的阻塞。"},
  {"id":"co-504","ch":"co-5","stem":"CPU 区分从存储器取出的是指令还是数据，依据是（　）。","opts":["数据的内容","取指阶段发出的控制信号（或指令周期的阶段）","地址的奇偶性","数据总线宽度"],"ans":[1],"ex":"同一条总线既取指令又读数据，靠**控制信号**（如 MFC、读/写命令 + 当前所处机器周期）区分。这也是「指令与数据形式上无差别」的体现。"},
  {"id":"co-505","ch":"co-5","stem":"下列关于指令周期的说法，正确的是（　）。","opts":["所有指令的指令周期长度都相同","指令周期由若干机器周期组成，各指令可以不同","取指周期一定比执行周期长","机器周期就是时钟周期"],"ans":[1],"ex":"指令周期完成一条指令的完整取指 + 译码 + 执行。不同指令的机器周期数不同（如乘法比加法长）。机器周期 ≠ 时钟周期，一个机器周期可含多个时钟周期。"},
  {"id":"co-601","ch":"co-6","stem":"某总线宽度 32 位，工作频率 100MHz，每个总线周期传送 1 次数据，则总线带宽为（　）。","opts":["100 MB/s","200 MB/s","400 MB/s","800 MB/s"],"ans":[2],"ex":"带宽 = 频率 × 每次传送字节数 = 100×10⁶ × 4B = 400 MB/s。若一个时钟周期内有多次传送（如 DDR），还要乘上次数字。"},
  {"id":"co-602","ch":"co-6","stem":"同步总线与异步总线相比，主要特点是（　）。","opts":["同步总线通过握手信号协调，适应不同速度设备","同步总线统一时钟、传输速度快，但只适合速度相近的设备","异步总线不需要任何控制信号","同步总线可靠性必然更低"],"ans":[1],"ex":"同步总线靠统一时钟，速度快、控制简单，但必须按最慢设备定周期（或分频）；异步总线用「请求/应答」握手，能适配不同速度设备，代价是额外的控制开销与时延。"},
  {"id":"co-603","ch":"co-6","stem":"集中式总线仲裁方式中，**控制线最少、结构最简单**，但优先级固定、且某一设备故障会使其后所有设备都无法获得总线的是（　）。","opts":["链式查询","计数器定时查询","独立请求","分布式仲裁"],"ans":[0],"ex":"- **链式查询**：只要 3 根线，最省钱；优先级由物理位置决定（越近越优先），速度最慢，且某环节故障会波及后续设备。\n- **计数器定时查询**：线数居中，优先级可通过计数起点轮换。\n- **独立请求**：每设备一根请求线，**响应最快、最灵活**，但线数最多。\n!! 考「最快」答独立请求，考「最省钱/最简单」答链式查询。"},
  {"id":"co-604","ch":"co-6","stem":"总线「复用」技术的作用是（　）。","opts":["提高总线带宽","减少总线信号线数量","降低传输延迟","增加总线仲裁的优先级"],"ans":[1],"ex":"复用让同一组线在不同时间段传送不同信息（如地址/数据复用、分时复用），目的是**减少引脚/线数**，代价是需要额外的时序与控制逻辑。"},
  {"id":"co-701","ch":"co-7","tag":"高频","stem":"DMA 方式与中断方式的主要区别在于（　）。","opts":["DMA 不需要 CPU 参与任何总线操作","DMA 由硬件直接控制数据在主存与外设间传输，只在传输结束时中断 CPU","中断方式的数据传输速度一定比 DMA 快","DMA 只能用于输入设备"],"ans":[1],"ex":"中断方式每传一个字都要 CPU 执行中断服务程序；DMA 由 DMA 控制器接管总线成块搬运，仅在整块传完（或出错）时发中断。DMA 仍需**周期挪用/停止 CPU/交替访存**来占用总线。"},
  {"id":"co-702","ch":"co-7","stem":"DMA 控制器采用「周期挪用」方式工作，其含义是（　）。","opts":["DMA 长期占用总线，CPU 停止运行","DMA 与 CPU 交替使用总线，每次挪用一两个存取周期","DMA 只在 CPU 空闲时传输","DMA 与 CPU 同时访问同一存储体"],"ans":[1],"ex":"周期挪用（cycle stealing）是 DMA 与 CPU 交替访存的折中方案：DMA 每传送一个数据就「借」一两个存取周期，期间 CPU 暂停访存但不停机。相比「停止 CPU 访存」对 CPU 影响更小。"},
  {"id":"co-703","ch":"co-7","stem":"中断响应过程中，CPU 保护断点的操作发生在（　）。","opts":["中断请求之后、中断响应之前","中断响应周期内","中断服务程序执行中","中断返回时"],"ans":[1],"ex":"中断响应周期里，CPU 关中断、保存断点（PC 等）并送入中断服务程序入口。**中断服务程序内部**才保存现场（通用寄存器、PSW）。断点与现场不是一回事。"},
  {"id":"co-704","ch":"co-7","stem":"I/O 端口与主存统一编址（存储器映射方式）的主要缺点是（　）。","opts":["需要专门的 I/O 指令","占用主存地址空间","只能用程序查询方式","无法使用 DMA"],"ans":[1],"ex":"统一编址用普通访存指令访问 I/O 端口，编程方便、寻址方式可复用，但**占用主存地址空间**，且译码时不易区分访存与访外设。独立编址则相反。"},
  {"id":"co-705","ch":"co-7","stem":"程序查询方式（轮询）的主要缺点是（　）。","opts":["硬件成本太高","CPU 大量时间浪费在等待与查询上","无法传送大量数据","需要 DMA 控制器配合"],"ans":[1],"ex":"程序查询时 CPU 反复读状态寄存器直到设备就绪，期间无法做别的事，CPU 与外设**串行**工作，效率最低。优点是硬件最简单、控制最直接。"},
  {"id":"co-207","ch":"co-2","tag":"计算","stem":"8 位定点整数 x = −25，其补码表示是（　）。","opts":["1110 0111","1110 0110","1001 1001","1001 1010"],"ans":[0],"ex":"+25 = 0001 1001。求 −25 的补码：各位取反得 1110 0110，再加 1 得 **1110 0111**（即 0xE7）。口诀「取反加一」，注意是在原码的绝对值部分上操作。"},
  {"id":"co-406","ch":"co-4","stem":"下列寻址方式中，取操作数需要访问主存两次的是（　）。","opts":["直接寻址","间接寻址","立即寻址","寄存器寻址"],"ans":[1],"ex":"间接寻址要先访存取出有效地址 EA（第一次），再按 EA 访存取操作数（第二次）。直接寻址访存一次、立即与寄存器寻址都不访存。"},
  {"id":"co-506","ch":"co-5","tag":"计算","stem":"某 5 段流水线，各段耗时均为 1 个时钟周期。连续执行 100 条指令且无任何冒险，相对非流水线执行的加速比约为（　）。","opts":["5","4.8","4","3.5"],"ans":[1],"ex":"非流水线需 100×5 = 500 个周期；流水线需 k + (n−1) = 5 + 99 = 104 个周期。加速比 = 500/104 ≈ **4.8**，低于理论上限 5，差距来自「填满流水线」的启动开销。"},
  {"id":"co-607","ch":"co-6","stem":"总线完成一次数据传输所需的最短时间称为（　）。","opts":["总线周期","总线带宽","总线宽度","总线利用率"],"ans":[0],"ex":"**总线周期**（总线传送周期）= 一次总线操作所需时间，与时钟周期、总线宽度共同决定带宽：`带宽 = 数据线字节数 / 总线周期`。"},
  {"id":"co-107","ch":"co-1","stem":"计算机系统的多级层次结构中，最底层是（　）。","opts":["操作系统层","微程序机器级（硬件直接执行）","高级语言层","汇编语言层"],"ans":[1],"ex":"自底向上：微程序机器级 → 传统机器级 → 操作系统级 → 汇编语言级 → 高级语言级。最底层由硬件直接实现，是其他所有层的基础。"},
  {"id":"co-208","ch":"co-2","tag":"易错","stem":"8 位定点整数 x = −0 的原码、反码、补码依次是（　）。","opts":["1000 0000、1111 1111、0000 0000","1000 0000、1111 1111、1000 0000","0000 0000、0000 0000、0000 0000","1111 1111、1000 0000、0000 0000"],"ans":[0],"ex":"−0 的原码 1000 0000，反码=原码数值位取反=1111 1111，补码=反码+1=1 0000 0000 丢掉进位=**0000 0000**。补码中 0 只有一种表示，这是补码优于原码/反码的关键。"},
  {"id":"co-209","ch":"co-2","stem":"原码恢复余数除法中，若某步减去除数后余数为负，正确的处理是（　）。","opts":["直接进入下一步","加回除数恢复余数，本位上商 0","丢弃该余数","本位仍上商 1"],"ans":[1],"ex":"余数为负说明「够减的假设不成立」，要把除数加回去恢复原余数，并在该位上商 0，然后左移继续。加减交替法省去了恢复步骤，是现代实现方式。"},
  {"id":"co-308","ch":"co-3","tag":"计算","stem":"某 DRAM 芯片存取周期 60 ns，共 128 行。若采用**集中刷新**，每个存取周期刷新一行，则刷新全部行需要（　）。","opts":["3.2 μs","7.68 μs","60 ns","128 ns"],"ans":[1],"ex":"集中刷新在一个刷新周期内连续刷完所有行：128 × 60 ns = 7680 ns = **7.68 μs**。这段时间内不能访存，称为「死区」。"},
  {"id":"co-309","ch":"co-3","stem":"虚拟存储器地址变换中，若 TLB（快表）命中，则（　）。","opts":["仍需再访问页表","可直接得到物理页号，省去访存查页表","一定发生缺页","必须转到辅存"],"ans":[1],"ex":"TLB 是页表项的 Cache。命中即拿到页框号，与页内偏移拼成物理地址，**不必访问主存中的页表**，这是提速的关键。TLB 缺失 ≠ 缺页。"},
  {"id":"co-407","ch":"co-4","tag":"计算","stem":"某机指令字长 32 位、定长，含 8 位操作码、2 个各 4 位的寄存器号，其余为立即数。按补码解释时该立即数的表示范围是（　）。","opts":["0 ~ 255","−128 ~ +127","−32768 ~ +32767","0 ~ 65535"],"ans":[2],"ex":"立即数位宽 = 32 − 8 − 4×2 = **16 位**。16 位补码范围 −2¹⁵ ~ 2¹⁵−1，即 −32768 ~ +32767。"},
  {"id":"co-408","ch":"co-4","stem":"采用变长指令格式的主要目的是（　）。","opts":["简化指令译码","提高代码密度、节省存储空间","加快流水线","减少寻址方式数量"],"ans":[1],"ex":"变长指令让常用指令用短格式，从而**提高代码密度**（CISC 常用此法）。代价是译码复杂、难以流水，这也是 RISC 坚持定长指令的原因。"},
  {"id":"co-507","ch":"co-5","stem":"水平型微指令与垂直型微指令相比，其特点是（　）。","opts":["微指令字长、并行控制能力强、微程序短","微指令短、并行度低、微程序长","两者在并行度上完全相同","只适用于 RISC"],"ans":[0],"ex":"水平型：一条微指令能并行发出多个控制信号，字长长、微程序短、执行快；垂直型：类似机器指令，字长短、并行度低、微程序长但易编写。"},
  {"id":"co-508","ch":"co-5","stem":"流水线中由转移（分支）指令引起的冒险属于（　）。","opts":["结构冒险","数据冒险","控制冒险","存储冒险"],"ans":[2],"ex":"控制冒险（指令冒险）：取到的下一条指令地址不确定。缓解手段有分支预测、延迟槽、提前在 ID 段判断转移。结构冒险是硬件资源冲突，数据冒险是数据依赖。"},

  {"id":"co-606","ch":"co-6","tag":"计算","stem":"某总线数据线 64 位、时钟频率 66 MHz，每个时钟周期传送 2 次数据（双沿），则带宽约为（　）。","opts":["528 MB/s","1056 MB/s","4224 MB/s","264 MB/s"],"ans":[1],"ex":"64 位 = 8 B；每秒传送 66M × 2 次；带宽 = 8 × 2 × 66×10⁶ ≈ **1056 MB/s**（约 1 GB/s）。"},
  {"id":"co-706","ch":"co-7","stem":"中断向量表的作用是（　）。","opts":["存放中断服务程序的代码","存放各中断源对应的中断服务程序入口地址","记录中断优先级","保存设备状态字"],"ans":[1],"ex":"中断向量表存的是**入口地址**（向量），CPU 响应中断后按中断类型号查表即可跳转，无需软件逐级判断，实现快速定位。"},

  {"id":"co-708","ch":"co-7","stem":"当 DMA 请求与 CPU 访存请求同时到达时，通常优先响应（　）。","opts":["CPU","DMA","随机选择","由操作系统临时决定"],"ans":[1],"ex":"外设数据不等人，DMA 请求若不能及时响应会导致数据丢失（如磁盘数据流），因此硬件上通常给 DMA **更高优先级**，CPU 让出总线。"}

window.DATA.k.co = [
  {"ch":"co-1","t":"冯·诺依曼结构五大部件","tag":"必背","b":"运算器、控制器、存储器、输入设备、输出设备。\n**核心思想**：存储程序 + 程序控制；指令与数据同等对待（都用二进制、都存存储器、都按地址访问）。\n!! 「指令和数据形式上无差别」是常考判断题；「数据都直接放在指令里」是错误说法。"},
  {"ch":"co-1","t":"性能公式（必背）","tag":"必背","b":"`CPU 执行时间 = 指令数 × CPI × 时钟周期 = 指令数 × CPI / 主频`\n`MIPS = 主频 / (CPI × 10⁶)`\n`MFLOPS = 浮点运算次数 / (执行时间 × 10⁶)`\n!! 主频高 ≠ 跑得快，还要看 CPI；MIPS 只反映整数吞吐。"},
  {"ch":"co-1","t":"程序的翻译与执行","tag":"速记","b":"`预处理 → 编译 → 汇编 → 链接`\n- 预处理：展开宏、处理 include\n- 编译：源程序 → 汇编语言\n- 汇编：汇编语言 → 机器码目标文件\n- 链接：合并库与目标文件 → 可执行文件\n!! 汇编程序与解释程序的区别常考：解释器不生成目标文件。"},
  {"ch":"co-1","t":"Amdahl 定律","tag":"进阶","b":"若某部分占总执行时间的比例为 p，该部分提速 s 倍，则总加速比\n`S = 1 / ((1-p) + p/s)`\n!! 结论：**优化瓶颈部分**，优化占比小的部分收益极低。"},
  {"ch":"co-2","t":"四种码制的范围（n 位）","tag":"必背","b":"- 原码：`-(2^(n-1)-1) ~ +(2^(n-1)-1)`，有 ±0\n- 反码：同上，负数按位取反，有 ±0\n- 补码：`-2^(n-1) ~ +(2^(n-1)-1)`，0 唯一\n- 移码：补码符号位取反，用于阶码\n!! 补码比原码多一个负数 `-2^(n-1)`，即 `1000…0`。"},
  {"ch":"co-2","t":"IEEE 754 格式","tag":"必背","b":"单精度 32 位：`1 符号 + 8 阶码（偏 127）+ 23 尾数`\n双精度 64 位：`1 + 11（偏 1023）+ 52`\n规格化数的尾数隐含最高位 1（即 1.M）。\n阶码全 0 → 非规格化数 / 零；阶码全 1 → 无穷大或 NaN。\n!! 真值 = `(-1)^S × 1.M × 2^(E-127)`。"},
  {"ch":"co-2","t":"溢出判断三种方法","tag":"技巧","b":"- **双符号位**：`01` 正溢、`10` 负溢，`00/11` 正常\n- **进位异或**：最高位进位与次高位进位**不同**即溢出\n- **符号相同相加**：正+正得负、负+负得正 即溢出\n!! 补码加减法统一用加法器实现：`A - B = A + (-B)`。"},
  {"ch":"co-2","t":"浮点加减五步","tag":"速记","b":"**对阶 → 尾数加减 → 规格化 → 舍入 → 判溢出**\n- 对阶：小阶向大阶看齐，尾数**右移**（保精度）\n- 规格化：结果溢出则右规，最高位非 1 则左规\n- 舍入：0 舍 1 入 / 恒置 1 法\n!! 顺序不能乱，尤其「对阶」必须在加减之前。"},
  {"ch":"co-3","t":"SRAM vs DRAM vs ROM","tag":"对照","b":"- **SRAM**：触发器，不需刷新，快、贵、集成度低 → Cache\n- **DRAM**：电容，需刷新，破坏性读出，便宜、集成度高 → 主存；地址复用（RAS/CAS）\n- **ROM**：非易失；Flash 可电擦写，作 U 盘/SSD\n!! DRAM 刷新按**行**进行，与是否被访问无关。"},
  {"ch":"co-3","t":"刷新三方式","tag":"对照","b":"| 方式 | 死区 | 存取周期 |\n|---|---|---|\n| 集中刷新 | 有 | 不变 |\n| 分散刷新 | 无 | 变长 |\n| **异步刷新** | 无 | 基本不变 |\n!! 异步刷新 = 把刷新均匀插到 2ms 间隔里，考试默认选它。"},
  {"ch":"co-3","t":"芯片数量与地址位数","tag":"计算","b":"`芯片数 = (总容量) / (单片容量)`，拆成**字扩展 × 位扩展**。\n`地址线数 = log₂(寻址单元数)`\n!! 关键：**按字节编址还是按字编址**。存储字长 4B、按字编址、4KB 容量 → 寻址单元 1K → 地址 10 位；按字节编址则 4K → 12 位。"},
  {"ch":"co-3","t":"Cache 三种映射（地址划分）","tag":"必背","b":"- 直接映射：`tag ｜ 行号 ｜ 块内地址`，冲突多、硬件简单\n- 全相联：`tag ｜ 块内地址`，需与所有行比较\n- 组相联（n 路）：`tag ｜ 组号 ｜ 块内地址`，n 个比较器并行\n!! Cache 行位数 = 数据位 + tag + 有效位(+ 脏位，写回法才有)。"},
  {"ch":"co-3","t":"AMAT 与写策略","tag":"计算","b":"`AMAT = h×Tc + (1-h)×Tm`（并行查）；若串行先查 Cache 则未命中要算 `Tc+Tm`。\n写策略：\n- 写命中：**写回**（需脏位）/ **写直达**（同步主存）\n- 写不命中：**写分配**（先调入）/ **非写分配**（直接写主存）\n!! 常见搭配：写回 + 写分配；写直达 + 非写分配。"},
  {"ch":"co-3","t":"虚拟存储与 TLB","tag":"进阶","b":"地址变换：`虚拟地址 →（TLB 查表，未命中查页表）→ 物理地址 → Cache/主存`。\nTLB 缺失 ≠ 缺页：TLB 缺失可能只是缓存项不在，缺页才是页面不在主存（要调页，代价极大）。\n!! 页表项常见字段：有效位、脏位、访问位、访问权限、物理页号。"},
  {"ch":"co-4","t":"常见寻址方式（EA 公式）","tag":"必背","b":"- 立即寻址：操作数在指令中\n- 直接寻址：`EA = A`\n- 间接寻址：`EA = (A)`\n- 寄存器寻址：操作数在寄存器\n- 寄存器间接：`EA = (R)`\n- 相对寻址：`EA = (PC) + A`，PC 为**取下条指令后**的值\n- 基址/变址：`EA = (R) + A`\n!! 相对寻址的 PC 值是最容易错的地方。"},
  {"ch":"co-4","t":"指令格式与地址范围","tag":"计算","b":"指令字长固定时，地址码位数决定可直接寻址的空间：\n`地址范围 = 2^地址位数 × 编址单位`\n!! 按字节编址时 10 位地址 → 1KB；按字（2B）编址 → 2KB。"},
  {"ch":"co-4","t":"RISC vs CISC","tag":"对照","b":"- RISC：指令少、**定长**、格式规整、寻址方式少、寄存器多、硬布线控制、**适合流水**\n- CISC：指令多、**变长**、寻址方式多、微程序控制、兼容性好\n!! RISC 的一条指令通常单周期完成；CISC 指令周期长短不一。"},
  {"ch":"co-5","t":"控制器两种实现","tag":"对照","b":"- **硬布线**：组合逻辑直接产生控制信号，速度快、不易修改\n- **微程序**：控制信号存成微指令（在控制存储器中），易修改扩展，速度较慢\n!! 微指令格式分水平型（并行度高、微程序短）与垂直型（并行度低、微程序长）。"},
  {"ch":"co-5","t":"流水线三类冒险","tag":"必背","b":"- **结构冒险**：资源冲突 → 增加部件/分离 Cache\n- **数据冒险**（RAW）→ **数据转发（旁路）**，load-use 需阻塞一拍\n- **控制冒险**：转移指令 → 延迟槽、分支预测、提前判断\n!! 流水线加速比上限 = 段数 k；吞吐率 ≈ 1/最长段耗时。"},
  {"ch":"co-5","t":"指令周期与机器周期","tag":"速记","b":"`指令周期 = 取指 + 间址 + 执行 + 中断` 各机器周期之和。\n`机器周期 = 若干时钟周期`（由访存时间决定）。\n!! 不同指令的机器周期数不同：取指周期对所有指令相同，执行周期因指令而异。"},
  {"ch":"co-6","t":"总线性能计算","tag":"计算","b":"`总线带宽 = 总线宽度(B) × 工作频率`（每次传送 1 次时）\n若一个时钟周期传 2 次（DDR）则再 ×2。\n`总线宽度 = 数据线条数`\n!! 注意单位：Mbps 与 MB/s 差 8 倍。"},
  {"ch":"co-6","t":"总线仲裁三方式","tag":"对照","b":"- **链式查询**：3 根线，最省钱，优先级固定，近端优先，故障易扩散\n- **计数器定时查询**：线数较多，优先级可通过计数起点轮换\n- **独立请求**：每设备独立请求线，**响应最快**、最灵活，线数最多\n!! 考「哪个最快」→ 独立请求；「哪个最省钱」→ 链式查询。"},
  {"ch":"co-7","t":"I/O 四种控制方式","tag":"必背","b":"1. **程序查询**：CPU 轮询，串行，最慢\n2. **程序中断**：设备就绪发中断，CPU 逐字处理\n3. **DMA**：硬件成块搬运，仅在结束时中断，CPU 参与最少\n4. **通道/IOP**：专用处理器执行通道程序，进一步解放 CPU\n!! 数据传送率从低到高：查询 < 中断 < DMA < 通道。"},
  {"ch":"co-7","t":"DMA 三种工作方式","tag":"对照","b":"- **停止 CPU 访存**：DMA 独占总线，适合高速块传输\n- **周期挪用**：每次借一两个存取周期，CPU 影响小（最常见）\n- **交替访问**：CPU 与 DMA 分时交替访存（C1/C2 周期）\n!! DMA 传送结束后通过**中断**通知 CPU 做善后。"},
  {"ch":"co-7","t":"中断响应与中断服务","tag":"易错","b":"**中断响应周期**（硬件完成）：关中断、保存断点、送中断向量/入口地址。\n**中断服务程序**（软件完成）：保存现场（通用寄存器、PSW）、处理、恢复现场、开中断、返回。\n!! 断点 ≠ 现场。断点是 PC，现场是各寄存器内容。"}

  {"id":"os-102","ch":"os-1","tag":"高频","stem":"用户程序需要执行 I/O 操作时，必须通过（　）方式请求操作系统服务。","opts":["库函数直接访问硬件","系统调用（陷入内核态）","修改中断向量表","关闭中断后直接执行"],"ans":[1],"ex":"特权指令（如 I/O 指令、关中断）只能在**核心态**执行。用户程序通过系统调用（trap/陷入）进入内核态，由 OS 代为完成。"},
  {"id":"os-103","ch":"os-1","stem":"从用户态切换到核心态，可能由下列哪种事件引起（　）。","opts":["用户程序的普通算术运算","时钟中断或系统调用","进程调度程序选择新进程","用户程序访问自己的局部变量"],"ans":[1],"ex":"用户态 → 核心态只能由**中断/异常/陷入**触发。核心态内的操作（如进程调度）本身就在核心态，不算切换。"},
  {"id":"os-104","ch":"os-1","stem":"操作系统中引入「中断」机制的主要目的是（　）。","opts":["提高 CPU 主频","实现 CPU 与 I/O 设备的并行工作，提高利用率","扩大主存容量","简化编译器的实现"],"ans":[1],"ex":"中断让 CPU 不必轮询等待外设，可在外设工作期间执行别的程序，从而实现 CPU 与 I/O 并行。它也是 OS 实现并发与系统调用的基础。"},
  {"id":"os-105","ch":"os-1","stem":"下列功能中，属于操作系统「存储管理」范畴的是（　）。","opts":["分配与回收内存空间、地址变换、内存保护与扩充","把源程序翻译成目标代码","管理进程的创建与撤销","将逻辑地址编译为物理地址"],"ans":[0],"ex":"存储管理：内存分配回收、地址变换（逻辑→物理）、内存保护、内存扩充（虚拟存储）。B 属编译程序，C 属进程管理，D 属地址变换但「编译」不是 OS 的职责。"},
  {"id":"os-201","ch":"os-2","tag":"必背","stem":"进程控制块 PCB 中通常不包含（　）。","opts":["进程标识符 PID","程序代码本身","进程状态与优先级","CPU 现场（寄存器内容）"],"ans":[1],"ex":"PCB 是进程存在的**唯一标志**，存标识信息、状态、调度信息、资源清单、CPU 现场，但**不含程序代码**（代码在程序段中，通过指针关联）。"},
  {"id":"os-202","ch":"os-2","tag":"易错","stem":"下列进程状态转换中，不可能发生的是（　）。","opts":["就绪 → 运行","运行 → 就绪","运行 → 阻塞","阻塞 → 运行"],"ans":[3],"ex":"阻塞态只能先转为**就绪态**（等待的事件发生后进入就绪队列），不能直接运行。运行→阻塞（请求资源/等待 I/O）、运行→就绪（时间片到）、就绪→运行（被调度）都是合法的。"},
  {"id":"os-203","ch":"os-2","stem":"关于线程，下列说法正确的是（　）。","opts":["线程是资源分配的基本单位","线程拥有独立的地址空间","同一进程内的线程共享该进程的地址空间与资源","线程切换的开销大于进程切换"],"ans":[2],"ex":"进程是**资源分配**的基本单位，线程是**调度/执行**的基本单位。同进程线程共享地址空间、打开文件等，但各有独立栈与寄存器现场，故切换开销**小于**进程。"},
  {"id":"os-204","ch":"os-2","stem":"进程间通信方式中，属于「间接通信」的是（　）。","opts":["共享内存","消息传递（信箱）","管道","信号"],"ans":[1],"ex":"消息传递中发送方把消息送入**信箱**、接收方从信箱取，双方不直接指定对方（间接通信）。共享内存、管道通常需要在共享区上做同步，属于直接/半直接方式。"},
  {"id":"os-205","ch":"os-2","stem":"在支持线程的系统中，同一进程的多个线程（　）。","opts":["必须串行执行","可以在多核上并行执行","共享各自的私有栈","各自拥有独立的页表"],"ans":[1],"ex":"多线程（多核）可由内核调度到不同 CPU 上并行执行。同进程线程共享页表与地址空间，但各自有独立栈（栈是私有资源）。"},
  {"id":"os-301","ch":"os-3","tag":"计算","stem":"三个进程 P1、P2、P3 的到达时间与运行时间分别为 (0,7)、(2,4)、(4,1)（单位：ms）。采用**非抢占式 SJF** 调度，平均周转时间为（　）。","opts":["7 ms","8 ms","9 ms","10 ms"],"ans":[0],"ex":"t=0 P1 运行至 7；t=7 时 P2(4)、P3(1) 已到达，选短者 P3 运行至 8；再 P2 运行至 12。周转 = 完成 − 到达：P1=7、P2=10、P3=4，平均 = 21/3 = 7 ms。（FCFS 则为 (7+9+8)/3 = 8 ms）"},
  {"id":"os-302","ch":"os-3","stem":"多级反馈队列调度算法中，若进程在当前队列时间片内未完成，则被（　）。","opts":["立即终止","放入更高优先级队列","放入更低优先级队列（时间片变长）","放入阻塞队列"],"ans":[2],"ex":"多级反馈队列「喂短作业、惩罚长作业」：用尽时间片未完成的进程降入下一级（时间片更长的）队列。可兼顾响应时间与吞吐量。"},
  {"id":"os-303","ch":"os-3","tag":"易错","stem":"下列调度算法中，可能导致**饥饿**的是（　）。","opts":["先来先服务","时间片轮转","短作业优先（SJF）","公平分享调度"],"ans":[2],"ex":"SJF 总是优先短作业，长作业可能长期排不上队 → 饥饿。高优先级优先调度同样可能导致低优先级饥饿。FCFS 与轮转不会。"},
  {"id":"os-304","ch":"os-3","stem":"进程调度的时机不包括（　）。","opts":["当前进程时间片用完","当前进程因 I/O 请求进入阻塞态","当前进程执行了普通的算术指令","更高优先级的进程到达（抢占式）"],"ans":[2],"ex":"普通指令执行不改变进程状态，不会引起调度。调度发生在进程状态改变、时间片耗尽、被抢占、中断返回等时机。"},
  {"id":"os-305","ch":"os-3","stem":"衡量调度算法的指标中，「周转时间」等于（　）。","opts":["进程实际运行的时间","进程完成时刻 − 进程到达时刻","进程等待的累计时间","进程占用 CPU 的时间"],"ans":[1],"ex":"周转时间 = 完成时刻 − 到达时刻（含等待与运行）。`带权周转时间 = 周转时间 / 运行时间`，平均带权周转时间更严格地反映调度效果。"},
  {"id":"os-401","ch":"os-4","tag":"必背","stem":"实现临界区互斥必须遵循的四条准则中，不包括（　）。","opts":["空闲让进","忙则等待","有限等待","优先级高者先进"],"ans":[3],"ex":"四准则：**空闲让进、忙则等待、有限等待、让权等待**。优先级并非互斥的必要条件（优先级反转反而是需要防范的问题）。"},
  {"id":"os-402","ch":"os-4","stem":"信号量 S 的初值为 2，依次执行 P、P、V、P 四个操作后，S 的值为（　）。","opts":["0","1","2","-1"],"ans":[0],"ex":"P 操作 S=S−1，V 操作 S=S+1。依次为：2→1（P）→0（P）→1（V）→0（P），结果为 0。注意此时没有进程被阻塞（S 始终 ≥ 0 时表示还有可用资源）。"},
  {"id":"os-403","ch":"os-4","tag":"高频","stem":"生产者-消费者问题中，用于表示「缓冲区中空闲单元数」的信号量初值应设为（　）。","opts":["0","1","n（缓冲区容量）","无限大"],"ans":[2],"ex":"empty 表示空闲缓冲单元数，初值 = n；full 表示已放产品数，初值 = 0；mutex 为互斥信号量，初值 = 1。生产者先 P(empty) 再 P(mutex)，顺序不能颠倒（否则可能死锁）。"},
  {"id":"os-404","ch":"os-4","stem":"管程（Monitor）机制相比信号量的主要优势是（　）。","opts":["执行速度更快","把共享数据的互斥与同步封装在语言层面，减少编程错误","不需要任何同步原语","能在用户态直接操作硬件"],"ans":[1],"ex":"管程由「共享数据 + 操作过程 + 条件变量」组成，进入管程自动互斥，同步用条件变量 wait/signal 表达，把易错的 PV 配对封装掉，显著降低死锁与漏配对风险。"},
  {"id":"os-405","ch":"os-4","stem":"读者-写者问题中，若采用「读者优先」策略，可能出现的问题是（　）。","opts":["写者可能饥饿","读者可能饥饿","两者都会饥饿","不会饥饿"],"ans":[0],"ex":"读者优先下，只要有读者在读，写者就一直等待；读者源源不断则**写者饥饿**。写者优先则相反。公平策略用队列排队解决。"},
  {"id":"os-501","ch":"os-5","tag":"必背","stem":"产生死锁的四个必要条件中，不包括（　）。","opts":["互斥条件","请求并保持条件","不可剥夺条件","优先级相同条件"],"ans":[3],"ex":"四条件：**互斥、请求并保持、不可剥夺、循环等待**。破坏其中任一条即可预防死锁（如资源按序分配破坏循环等待）。"},
  {"id":"os-502","ch":"os-5","stem":"银行家算法属于（　）。","opts":["死锁预防","死锁避免","死锁检测与解除","不做任何处理"],"ans":[1],"ex":"银行家算法在每次分配前试探是否仍存在**安全序列**，只做「安全」的分配，属于**死锁避免**（动态策略）。死锁预防是破坏必要条件（静态策略）。"},
  {"id":"os-503","ch":"os-5","tag":"计算","stem":"系统有 3 类资源，已分配矩阵与需求矩阵已知，某时刻可用资源为 (1,1,2)，若按银行家算法存在一个安全序列，则说明（　）。","opts":["系统当前一定是死锁的","系统当前处于安全状态，按该序列分配可使所有进程完成","系统一定不会死锁","必须立即拒绝新的资源请求"],"ans":[1],"ex":"存在安全序列 ⇒ 系统**当前**安全，按该序列逐步满足需求可让所有进程完成。但「安全」只是不死锁的充分条件，不安全状态未必已死锁。"},
  {"id":"os-504","ch":"os-5","stem":"资源分配图中，若图中存在环路且每类资源（　），则一定发生死锁。","opts":["有多个实例","只有一个实例","可以被抢占","与进程一一对应"],"ans":[1],"ex":"单实例资源的分配图中，**环路 ⇔ 死锁**；多实例资源的图中，有环只说明可能死锁，还需进一步化简判断。"},
  {"id":"os-505","ch":"os-5","stem":"破坏「循环等待」条件最常用的方法是（　）。","opts":["一次性分配全部资源","允许资源被抢占","给资源编号，规定进程按编号递增顺序申请资源","禁止进程申请多个资源"],"ans":[2],"ex":"资源有序分配法（按编号递增申请）破坏循环等待；「一次性分配」破坏请求并保持；「可抢占」破坏不可剥夺条件。"},
  {"id":"os-601","ch":"os-6","tag":"计算","stem":"某系统页面大小为 4KB，逻辑地址为 0x2A3F，则页号与页内偏移分别为（　）。","opts":["2 与 0xA3F","2 与 0x2A3","0x2A 与 0x3F","0x2A3F 与 0"],"ans":[0],"ex":"页大小 4KB = 2¹²，低 12 位为页内偏移，高位为页号。0x2A3F 二进制低 12 位 = 0xA3F，高位 = 0x2 = 2。故页号 2、偏移 0xA3F。"},
  {"id":"os-602","ch":"os-6","tag":"易错","stem":"下列页面置换算法中，可能出现 Belady 异常的是（　）。","opts":["LRU","OPT（最佳置换）","FIFO","Clock"],"ans":[2],"ex":"Belady 异常：增加物理块数反而使缺页率**上升**。只有 **FIFO** 会出现（LRU、OPT 属于栈式算法，不会出现）。"},
  {"id":"os-603","ch":"os-6","stem":"分页存储管理中，页表的作用是（　）。","opts":["记录进程的代码段与数据段","实现页号到物理块号的映射","存放进程的 PCB","记录空闲分区链表"],"ans":[1],"ex":"页表项记录「页号 → 物理块号」以及有效位、访问位、修改位、保护位等。地址变换由 MMU 查页表完成，必要时配合 TLB 加速。"},
  {"id":"os-604","ch":"os-6","stem":"分段与分页的主要区别是（　）。","opts":["分段是物理单位，分页是逻辑单位","分页的页是等长的物理单位，分段的段是长度不等的逻辑单位","两者完全等价","分段不需要地址变换"],"ans":[1],"ex":"页是**等长**的物理划分（对用户不可见），段是**不等长**的、按程序逻辑划分的单位（对用户可见，便于共享与保护）。分段更易实现信息共享与保护。"},
  {"id":"os-605","ch":"os-6","stem":"虚拟存储器的实现依赖于（　）与（　）的结合。","opts":["分页技术；Cache 技术","请求调页（段）技术；页面（段）置换技术","多道程序；时间片轮转","静态重定位；动态重定位"],"ans":[1],"ex":"虚拟存储 = **请求调入** + **置换**，建立在局部性原理之上。缺页时从辅存调入，内存不足时按置换算法换出。"},
  {"id":"os-606","ch":"os-6","tag":"计算","stem":"某进程访问序列固定，采用 LRU 置换算法时，若增加分配给该进程的物理块数，其缺页次数（　）。","opts":["一定增加","一定减少或不增加","可能增加","保持不变"],"ans":[1],"ex":"LRU 是栈式算法，增大块数后任何时刻驻留集都是原驻留集的超集，缺页次数**单调不增**。FIFO 才可能异常增加。"},
  {"id":"os-701","ch":"os-7","tag":"对照","stem":"文件采用索引分配方式的主要优点是（　）。","opts":["顺序访问速度最快","支持直接（随机）访问，且不会产生外部碎片","不占用额外空间","适合超大文件而无需多级索引"],"ans":[1],"ex":"索引分配为每个文件建索引块，记录各逻辑块对应的物理块号，支持**随机访问**；连续分配也支持随机访问但会产生外部碎片；链接分配只适合顺序访问。"},
  {"id":"os-702","ch":"os-7","stem":"在 UNIX 类系统中，索引结点（inode）中通常不包含（　）。","opts":["文件大小与权限","文件数据块的地址索引","文件名","链接计数与时间戳"],"ans":[2],"ex":"inode 存文件元数据与被索引的块地址，但**文件名存放在目录项**中。这正是硬链接能多个名字指向同一 inode 的原因。"},
  {"id":"os-703","ch":"os-7","stem":"采用「混合索引」结构的主要目的是（　）。","opts":["减少目录项大小","兼顾小文件的访问效率与大文件的容量扩展","消除内部碎片","加快磁盘寻道"],"ans":[1],"ex":"UNIX 的 inode 用直接块 + 一级/二级/三级间接块：小文件只走直接块（快），大文件靠多级间接扩展容量，兼顾两者。"},
  {"id":"os-704","ch":"os-7","stem":"文件系统的位示图（bitmap）主要用于（　）。","opts":["记录文件的访问权限","管理磁盘空闲空间","缓存文件内容","记录进程打开的文件"],"ans":[1],"ex":"位示图用 1 位表示一个盘块是否空闲，空间紧凑、便于查找连续空闲块（很多连续块可用一个字表示），是常见的空闲空间管理方法。"},
  {"id":"os-705","ch":"os-7","stem":"采用「多级目录」结构相比单级目录的主要好处是（　）。","opts":["加快磁盘转速","解决文件重名问题并便于分类管理","增加文件的最大长度","减少 inode 数量"],"ans":[1],"ex":"多级（树形）目录允许不同用户、不同目录下存在同名文件，并支持路径名、便于分类与权限控制。"},
  {"id":"os-801","ch":"os-8","tag":"计算","stem":"磁头当前位于 100 号磁道，磁道请求序列为 55、58、39、18、90、160、150、38、184。采用 **SCAN（电梯，向磁道号增大方向）** 算法，磁头移动总量为（　）。","opts":["208","250","248","498"],"ans":[1],"ex":"向大：100→150→160→184（到端 199 后反向）→90→58→55→39→38→18。移动 = (184−100) + (184−18) = 84 + 166 = **250** 磁道。（FCFS 为 498，SSTF 为 248）"},
  {"id":"os-802","ch":"os-8","stem":"SPOOLing 技术（假脱机）主要解决的问题是（　）。","opts":["提高磁盘容量","把独占设备改造为共享设备，提高设备利用率","加快 CPU 主频","实现内存与辅存的信息交换"],"ans":[1],"ex":"SPOOLing 用磁盘上的输入井/输出井 + 缓冲区 + 井管理程序，使打印机等独占设备可被多进程「共享」使用（如打印队列）。"},
  {"id":"os-803","ch":"os-8","stem":"I/O 软件层次结构中，最贴近硬件的一层是（　）。","opts":["用户层 I/O 软件","设备独立性软件","设备驱动程序","中断处理程序"],"ans":[3],"ex":"自顶向下：用户层 I/O → 设备独立性软件 → 设备驱动程序 → **中断处理程序** → 硬件。中断处理直接与硬件交互，最底层。"},
  {"id":"os-804","ch":"os-8","stem":"引入缓冲区的主要目的是（　）。","opts":["提高内存利用率","缓和 CPU 与 I/O 设备速度不匹配的矛盾，减少中断频率","替代 Cache 的作用","实现虚拟设备"],"ans":[1],"ex":"缓冲区缓和速度差、减少对 CPU 的中断次数、提高 CPU 与设备的并行度。单缓冲/双缓冲/缓冲池各有侧重。"},
  {"id":"os-805","ch":"os-8","stem":"设备独立性（设备无关性）的含义是（　）。","opts":["所有设备的物理特性完全相同","用户程序使用逻辑设备名，由系统映射到具体物理设备","设备驱动不能被替换","I/O 必须经过 CPU 直接控制"],"ans":[1],"ex":"设备独立性让程序用**逻辑设备名**编程，OS 通过逻辑设备表（LUT）映射到物理设备，更换设备不必改程序——这是 I/O 软件分层的重要收益。"},
  {"id":"os-106","ch":"os-1","tag":"概念","stem":"微内核操作系统结构的主要优点是（　）。","opts":["性能最高","内核精简、可靠性高、便于扩展与移植","不需要进程间通信","所有系统服务都运行在核心态"],"ans":[1],"ex":"微内核只把最基本的功能（进程调度、基本内存管理、IPC）留在内核，其余作为用户态服务，因此**内核小、一处服务崩溃不易拖垮系统、易扩展**。代价是服务间通信要走内核，性能开销大。"},
  {"id":"os-107","ch":"os-1","stem":"用户程序发起系统调用时，CPU 的运行状态变化是（　）。","opts":["由核心态转为用户态","由用户态转入核心态，服务完成后返回用户态","自始至终在用户态","自始至终在核心态"],"ans":[1],"ex":"系统调用通过陷入（trap）指令从用户态进入核心态，由内核完成服务后用返回指令恢复用户态。这是用户程序获得内核服务的唯一正规入口。"},
  {"id":"os-206","ch":"os-2","stem":"创建进程时，系统为新进程建立的最关键数据结构是（　）。","opts":["页表","进程控制块 PCB","文件描述符表","中断向量表"],"ans":[1],"ex":"PCB 是进程存在的**唯一标志**：有了 PCB 才有被调度的资格，销毁进程即回收 PCB。页表、打开文件表是 PCB 所指向的资源。"},
  {"id":"os-207","ch":"os-2","tag":"高频","stem":"关于用户级线程，下列说法正确的是（　）。","opts":["由内核直接调度","由用户库管理、内核不可见，一个线程阻塞可能导致整个进程阻塞","可以自动在多个 CPU 上并行","切换必须陷入内核"],"ans":[1],"ex":"用户级线程的创建、调度、切换全在用户库完成，内核只看见一个进程。优点是切换快、无需陷入；致命缺点是**一个线程发起阻塞系统调用，整个进程都会被挂起**，且无法利用多核并行。"},
  {"id":"os-306","ch":"os-3","stem":"实时调度中的 EDF 算法指的是（　）。","opts":["最早截止期优先","最短作业优先","最高响应比优先","时间片轮转"],"ans":[0],"ex":"EDF（Earliest Deadline First）按截止时间排序，越早到期越优先，可抢占。在单处理器上，只要总利用率 ≤ 1，EDF 就能保证所有任务满足时限。"},
  {"id":"os-307","ch":"os-3","tag":"易错","stem":"实时系统中的「优先级反转」问题，常用（　）解决。","opts":["提升所有进程的优先级","优先级继承或优先级天花板协议","关闭中断","增大时间片"],"ans":[1],"ex":"优先级反转：高优先级任务被低优先级任务持有的锁阻塞，而中优先级任务又抢占低优先级任务，导致高优先级任务长期等待。**优先级继承**（持锁者临时升到等待者的优先级）或**优先级天花板**可解决。"},
  {"id":"os-406","ch":"os-4","tag":"易错","stem":"信号量 S 的当前值为 −3，这表示（　）。","opts":["有 3 个资源可供分配","有 3 个进程正在等待该资源","有 3 个进程正在使用该资源","信号量的值出错"],"ans":[1],"ex":"信号量 S < 0 时，|S| 就是**在该信号量上阻塞等待的进程数**。S > 0 表示还有 S 个资源可用，S = 0 表示资源刚好用完但无人等待。"},
  {"id":"os-506","ch":"os-5","stem":"若某时刻的资源分配图可完全化简，则系统（　）。","opts":["一定发生了死锁","一定没有死锁","可能死锁，无法判断","正处于不安全状态"],"ans":[1],"ex":"资源分配图能完全化简 ⇔ 存在安全序列 ⇔ **当前没有死锁**。不能化简则说明存在死锁（对单实例资源是充要条件，多实例时也是判定依据）。"},
  {"id":"os-607","ch":"os-6","tag":"必背","stem":"TLB（快表）的本质是（　）。","opts":["放在主存中的页表副本","页表项的 Cache，位于 CPU 内部，速度极快","磁盘上的交换区","进程控制块的一部分"],"ans":[1],"ex":"TLB 缓存最近使用的页表项，命中即可直接得到页框号，避免一次访存查页表。它是**页表项的 Cache**，容量很小但极快。"},
  {"id":"os-608","ch":"os-6","stem":"发生缺页中断并需要从磁盘调入页面时，CPU 处于（　）。","opts":["用户态","核心态","不确定","停机状态"],"ans":[1],"ex":"缺页处理要访问页表、分配页框、发起磁盘 I/O，全是特权操作，必须在**核心态**完成。处理期间该进程被阻塞，CPU 可调度其他进程。"},
  {"id":"os-706","ch":"os-7","stem":"UNIX 中硬链接与软链接（符号链接）的主要区别是（　）。","opts":["硬链接直接指向 inode，软链接是一个存放目标路径的新文件","硬链接可以跨文件系统","软链接删除后原文件会消失","两者在实现上完全等价"],"ans":[0],"ex":"硬链接是目录项直接指向同一 inode，多个名字地位平等，删光引用才真正删除；软链接是独立的文件，内容为目标路径，目标删除后成为悬空链接。硬链接**不能跨文件系统**。"},
  {"id":"os-707","ch":"os-7","stem":"进程打开一个文件时，操作系统会（　）。","opts":["把整个文件读入内存","在系统打开文件表中建立表项，并给进程返回文件描述符","删除原有的磁盘副本","锁定文件禁止其他进程访问"],"ans":[1],"ex":"open 在内存中建立「打开文件表」表项（含文件位置指针、打开方式、引用计数等），返回的**文件描述符**是该表项的索引。文件内容按需读取，不会整份载入。"},
  {"id":"os-806","ch":"os-8","stem":"磁盘的物理地址通常由（　）组成。","opts":["柱面号、磁头号、扇区号","页号、页内偏移","块号、字节偏移","磁道号、簇号"],"ans":[0],"ex":"经典 CHS 编址：柱面号（C）+ 磁头号（H）+ 扇区号（S）。定位过程是先寻道到柱面、再等旋转到磁头下、最后读写扇区。"},

  {"ch":"os-1","t":"OS 四大特征","tag":"必背","b":"- **并发**：宏观同时、微观交替（区别于并行：真正同时）\n- **共享**：互斥共享与同时共享\n- **虚拟**：把一个物理实体变成多个逻辑实体（虚拟处理器、虚拟存储器）\n- **异步**：进程走走停停，不可预知\n!! 并发与共享是 OS 最基本的特征，二者互为存在条件。"},
  {"ch":"os-1","t":"内核态与用户态","tag":"必背","b":"**特权指令**（I/O 指令、关中断、设置页表基址、加载 PSW…）只能在核心态执行。\n用户态 → 核心态：**中断、异常、系统调用（trap）**。\n核心态 → 用户态：执行特权指令修改 PSW 后返回。\n!! 典型陷阱：进程调度、缺页处理都发生在核心态，不是「切换到核心态」的触发原因。"},
  {"ch":"os-1","t":"系统调用 vs 库函数","tag":"易错","b":"系统调用是 OS 提供的**内核态**接口（fork、read、write…），需陷入内核。\n库函数是语言/运行时提供的用户态函数（printf、malloc），可能内部再包装系统调用。\n!! 陷阱：`printf` 本身就基本是用户态缓冲 + 一次 write 系统调用，别一概而论。"},
  {"ch":"os-2","t":"进程三态与五态","tag":"必背","b":"三态：**就绪 → 运行 → 阻塞**（+ 新建、终止共五态）。\n合法转换：就绪→运行（调度）、运行→就绪（时间片到/被抢占）、运行→阻塞（请求资源/等待 I/O）、阻塞→就绪（事件完成）。\n!! 阻塞→运行 **不允许**，必须先回到就绪队列。"},
  {"ch":"os-2","t":"PCB 内容","tag":"必背","b":"四类信息：**标识信息**（PID、UID）、**说明信息**（状态、优先级、时间片）、**现场信息**（寄存器、PSW、栈指针）、**管理信息**（资源清单、链接指针）。\n!! PCB 是进程存在的唯一标志；**不含程序代码**。"},
  {"ch":"os-2","t":"进程 vs 线程","tag":"对照","b":"- 进程 = 资源分配单位；线程 = 调度执行单位\n- 同进程线程共享：地址空间、全局变量、打开文件；私有：栈、寄存器、PC\n- 线程切换开销 < 进程切换（不切换页表/地址空间）\n!! 用户级线程由库管理（内核不可见），内核级线程由内核调度（可多核并行）。"},
  {"ch":"os-3","t":"调度指标公式","tag":"公式","b":"`周转时间 = 完成时刻 − 到达时刻`\n`带权周转时间 = 周转时间 / 运行时间`\n`等待时间 = 周转时间 − 运行时间`\n`响应时间 = 首次被调度时刻 − 到达时刻`\n!! 算平均时别漏除进程数；SJF 的平均等待/周转时间最优（但可能饥饿）。"},
  {"ch":"os-3","t":"调度算法对照","tag":"对照","b":"- **FCFS**：简单、非抢占、利于长作业与 CPU 繁忙型\n- **SJF/SPF**：平均等待最短，但需预知运行时间，可能饥饿\n- **RR 时间片轮转**：响应快，时间片太大会退化成 FCFS\n- **优先级**：可抢占，可能饥饿（用老化缓解）\n- **多级反馈队列**：兼顾响应与吞吐，最通用\n!! 常考「哪个平均周转最短」→ SJF。"},
  {"ch":"os-4","t":"临界区四准则","tag":"必背","b":"**空闲让进、忙则等待、有限等待、让权等待**。\n让权等待：进不去临界区时应释放 CPU（避免忙等）。\n!! 大部分软件方法（Peterson、Dekker）无法做到让权等待。"},
  {"ch":"os-4","t":"PV 操作语义","tag":"必背","b":"`P(S)`：S = S−1；若 S < 0 则阻塞自己，入等待队列。\n`V(S)`：S = S+1；若 S ≤ 0 则唤醒一个等待进程。\n信号量 |S| = 等待队列中的进程数（S<0 时）。\n!! P 与 V 必须成对；互斥信号量初值 1，同步信号量初值看「初始可用资源数」。"},
  {"ch":"os-4","t":"生产者-消费者（必背模板）","tag":"必背","b":"```\nempty=n, full=0, mutex=1\n生产者: P(empty); P(mutex); 放产品; V(mutex); V(full);\n消费者: P(full);  P(mutex); 取产品; V(mutex); V(empty);\n```\n!! **顺序陷阱**：P(empty) 必须在 P(mutex) 之前，否则生产者占着锁等空位 → 死锁。"},
  {"ch":"os-5","t":"死锁四条件与对策","tag":"必背","b":"四个必要条件：**互斥、请求并保持、不可剥夺、循环等待**。\n- 预防：破坏任一条件（资源有序分配破坏循环等待）\n- 避免：银行家算法（试探安全序列）\n- 检测：资源分配图化简\n- 解除：撤销进程 / 剥夺资源\n!! 「死锁避免」是动态的、每次分配都检查；「预防」是静态规则。"},
  {"ch":"os-5","t":"银行家算法要点","tag":"进阶","b":"数据结构：Available、Max、Allocation、Need（Need = Max − Allocation）。\n步骤：试探性分配 → 求安全序列 → 存在则真正分配，否则回滚并让进程等待。\n`安全状态 ⇒ 不会死锁`，但`不安全状态 ⇏ 已死锁`。\n!! 计算题常给矩阵求「是否存在安全序列」，按 Work 逐步推进即可。"},
  {"ch":"os-6","t":"分页地址变换","tag":"必背","b":"`页号 = 逻辑地址 / 页大小`（高位），`页内偏移 = 逻辑地址 % 页大小`（低位）。\n页大小 4KB → 页内偏移 **12 位**。\n`物理地址 = 物理块号 × 页大小 + 页内偏移`。\n!! 两级页表：外层页号 + 外层页内地址（= 页表大小 / 页大小）+ 页内偏移。"},
  {"ch":"os-6","t":"页面置换算法","tag":"对照","b":"- **OPT**：理论最优（换最久不用的），无法实现\n- **FIFO**：实现简单，**有 Belady 异常**\n- **LRU**：最近最久未使用，性能接近 OPT，开销较大（需硬件计数/栈）\n- **Clock**：LRU 的近似实现（访问位循环扫描）\n!! Belady 异常只有 FIFO 有；LRU/OPT 不会。"},
  {"ch":"os-6","t":"分段 vs 分页","tag":"对照","b":"| | 分页 | 分段 |\n|---|---|---|\n| 单位 | 页等长（物理） | 段不等长（逻辑） |\n| 用户可见 | 不可见 | 可见 |\n| 目的 | 提高内存利用率 | 便于共享与保护 |\n| 碎片 | 内部碎片 | 外部碎片 |\n!! 段页式 = 先分段再分页，兼顾两者。"},
  {"ch":"os-7","t":"文件三种分配方式","tag":"对照","b":"- **连续分配**：顺序访问最快、支持随机，但**外部碎片**大\n- **链接分配**：无碎片、顺序访问好，**不支持随机访问**\n- **索引分配**：支持随机访问、无外部碎片，索引块本身有开销（小文件浪费）\n!! 大文件常用「混合索引」（直接 + 多级间接）。"},
  {"ch":"os-7","t":"inode 与目录","tag":"易错","b":"**inode**：存元数据（大小、权限、时间、块地址索引、链接数），**不存文件名**。\n**目录项**：文件名 + inode 号。\n!! 因此同一 inode 可以有多个文件名（硬链接）；软链接则是新建一个存放路径的文件。"},
  {"ch":"os-7","t":"空闲空间管理","tag":"速记","b":"- **位示图**：1 位/块，紧凑，便于找连续空闲块\n- **空闲链表**：链接各空闲块\n- **成组链接**：UNIX 采用，兼顾大文件与小碎片\n- **空闲区表**：记录起始块与长度\n!! 「便于查找连续空闲块」→ 位示图。"},
  {"ch":"os-8","t":"I/O 软件四层","tag":"必背","b":"自顶向下：**用户层 I/O 软件 → 设备独立性软件 → 设备驱动程序 → 中断处理程序**（→ 硬件）。\n设备独立性软件：提供统一接口、缓冲、分配与回收、逻辑设备名映射。\n!! 最贴近硬件的是**中断处理程序**。"},
  {"ch":"os-8","t":"磁盘调度算法","tag":"计算","b":"- **FCFS**：按请求顺序，公平但移动量大\n- **SSTF**：每次选最近磁道，可能饥饿\n- **SCAN（电梯）**：单向扫到端点再折返\n- **C-SCAN**：只单向扫，回程不服务，更公平\n- **LOOK**：扫到最远请求即折返（不扫到端点）\n!! SCAN 移动量 = 起始到端点的距离 + 端点回折到最远请求的距离。"},
  {"ch":"os-8","t":"SPOOLing 与缓冲","tag":"速记","b":"SPOOLing = 输入井 + 输出井（磁盘）+ 输入/输出缓冲区（内存）+ 井管理程序，把**独占设备虚拟成共享设备**。\n缓冲区作用：缓和速度差、减少中断次数、提高并行度。\n!! 单缓冲 / 双缓冲 / 缓冲池三者的并行度依次提高。"}
